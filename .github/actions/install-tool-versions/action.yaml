name: Install Tools
description: Install tools via asdf vm.
inputs:
  tools:
    default: ""
    description: |
      Line separated tool names to be installed,
      as asdf action doesn't have to install certain tools from .tool-versions file.
      Note: The tool name should match what's in the .tool-versions file.

runs:
  using: composite
  steps:
    - name: Mark repo as safe for git
      shell: bash
      run: |
        # Mark the repo as safe for Git by setting the safe.directory config option. This is required for running jobs in containers like the playwright integration tests.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Filter .tool-versions
      shell: bash
      run: |
        cp -a .tool-versions .tool-versions-orig
        echo "${{ inputs.tools }}" | sed '/^$/d' > .tool-versions-input
        echo "⭐ Input tool names content:"
        cat .tool-versions-input
        grep -w -f .tool-versions-input .tool-versions-orig > .tool-versions
        echo "⭐ Filtered .tool-versions content:"
        cat .tool-versions

    - name: Determine asdf paths
      shell: bash
      run: |
        set -euo pipefail
        home=""
        for candidate in "$HOME" "/github/home" "/home/runner"; do
          if [[ -n "$candidate" && -d "$candidate" && -w "$candidate" ]]; then
            home="$candidate"
            break
          fi
        done
        if [[ -z "$home" ]]; then
          home="/tmp/asdf-home"
          mkdir -p "$home"
        fi
        echo "ASDF_BIN_DIR=$home/.cache/asdf/0.20.0/bin" >> "$GITHUB_ENV"
        echo "ASDF_DATA_DIR=$home/.asdf" >> "$GITHUB_ENV"

    - name: Restore asdf cache
      id: restore-asdf-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.ASDF_BIN_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-asdf-0.20.0

    - name: Install asdf
      if: steps.restore-asdf-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset="linux-amd64"; checksum="9c25e1af7cc4c9d59ff3736eba14fd000480c32929258f80d8c5a8b290ebee14" ;;
          Linux-ARM64) asset="linux-arm64"; checksum="bbc1889886a9826ce3f57f56e4bae575767a4af3d35d649d62116ee14334e59a" ;;
          macOS-X64) asset="darwin-amd64"; checksum="8217f33fd165131546aa034f3dabd1a6978cced71c271b4079b4f880965554c1" ;;
          macOS-ARM64) asset="darwin-arm64"; checksum="cc94a8cb12bd9692cd760ca184291552fd7206cf8306e51e4de45db94eea3cb5" ;;
          *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/asdf-v0.20.0-${asset}.tar.gz"
        curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
          --output "$archive" "https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-${asset}.tar.gz"
        actual="$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
        [[ "$actual" == "$checksum" ]] || { echo "asdf checksum mismatch: expected $checksum, got $actual" >&2; exit 1; }
        mkdir -p "$ASDF_BIN_DIR"
        tar -xzf "$archive" -C "$ASDF_BIN_DIR"

    - name: Add asdf to PATH
      shell: bash
      run: |
        echo "$ASDF_BIN_DIR" >> "$GITHUB_PATH"
        echo "$ASDF_DATA_DIR/shims" >> "$GITHUB_PATH"

    - name: Save asdf cache
      if: steps.restore-asdf-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.ASDF_BIN_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-asdf-0.20.0

    - name: Restore tools cache
      id: restore-tools-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.ASDF_DATA_DIR }}
        key: ${{ runner.os }}-asdf-0.20.0-tools-${{ hashFiles('.tool-versions') }}

    - name: Install tools
      uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
      id: asdf-install
      continue-on-error: true
      env:
        # Use GNU mirror to avoid overloading ftp.gnu.org
        # See: https://www.gnu.org/prep/ftp.en.html
        # Used by asdf-make: https://github.com/yacchi/asdf-make/blob/2b8c33adca11b79158298f1e35fe6a9ea363b6b0/lib/utils.bash#L7
        MAKE_CUSTOM_MIRROR: https://ftpmirror.gnu.org/
      with:
        skip_install: true

    - name: Retry failed tool installations
      if: steps.asdf-install.outcome == 'failure'
      shell: bash
      env:
        ASDF_DATA_DIR: ${{ env.ASDF_DATA_DIR }}
      run: |
        set -uo pipefail  # Note: no -e so we can capture exit codes
        MAX_RETRIES=5
        FAILED_TOOLS=()
        asdf_dir="${ASDF_DATA_DIR:-$HOME/.asdf}"

        echo "⚠️ Initial asdf install failed, retrying..."

        while IFS= read -r line; do
          [[ -z "$line" || "$line" =~ ^# ]] && continue
          tool=$(echo "$line" | awk '{print $1}')
          version=$(echo "$line" | awk '{print $2}')

          echo "::group::🔧 $tool $version"

          # Check if already installed
          if asdf list "$tool" 2>/dev/null | grep -qF "$version"; then
            echo "✅ $tool $version already installed, skipping"
            echo "::endgroup::"
            continue
          fi

          echo "📦 $tool $version not found, will install..."

          # Add plugin if not present
          if ! asdf plugin list 2>/dev/null | grep -q "^${tool}$"; then
            echo "Adding plugin for $tool..."
            asdf plugin add "$tool" || true
          fi

          # Retry loop for installation
          RETRY_DELAY=10
          installed=false
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Attempt $attempt/$MAX_RETRIES for $tool $version..."
            
            # Clean up any partial downloads/installs from previous failed attempts
            # (includes leftovers from the initial asdf-install step that failed)
            echo "🧹 Cleaning up partial downloads/installs..."
            rm -rf "${asdf_dir}/downloads/${tool}/${version}" 2>/dev/null || true
            rm -rf "${asdf_dir}/installs/${tool}/${version}" 2>/dev/null || true
            
            # Capture exit code without exiting on failure
            set +e
            asdf install "$tool" "$version"
            exit_code=$?
            set -e
            
            if [ $exit_code -eq 0 ]; then
              echo "✅ $tool $version installed successfully"
              installed=true
              break
            else
              echo "⚠️ Attempt $attempt failed (exit code: $exit_code)"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⏳ Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              fi
            fi
          done
          
          if [ "$installed" = false ]; then
            echo "❌ Failed to install $tool $version after $MAX_RETRIES attempts"
            FAILED_TOOLS+=("$tool@$version")
          fi
          echo "::endgroup::"
        done < .tool-versions

        # Report results
        if [ ${#FAILED_TOOLS[@]} -gt 0 ]; then
          echo ""
          echo "❌ The following tools failed to install after retries:"
          printf '  - %s\n' "${FAILED_TOOLS[@]}"
          exit 1
        fi
        echo "✅ All tools installed successfully"

    - name: Print asdf build logs
      if: always()
      shell: bash
      env:
        ASDF_DATA_DIR: ${{ env.ASDF_DATA_DIR }}
      run: |
        set -euo pipefail
        root="${ASDF_DATA_DIR:-$HOME/.asdf}/downloads"
        if [ -d "$root" ]; then
          echo "=== asdf installer logs under $root ==="
          # Group each log in the Actions UI
          while IFS= read -r -d '' f; do
            echo "::group::${f#$root/}"
            cat "$f" || true
            echo "::endgroup::"
          done < <(find "$root" -type f -name install.log -print0)
        else
          echo "No asdf downloads dir at $root"
        fi

    - name: Save tools cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.ASDF_DATA_DIR }}
        key: ${{ runner.os }}-asdf-0.20.0-tools-${{ hashFiles('.tool-versions') }}

    - name: List installed versions
      shell: bash
      run: |
        asdf current

    - name: Checkout .tool-versions changes
      shell: bash
      run: |
        git clean -f .tool-versions*
        git checkout .tool-versions
