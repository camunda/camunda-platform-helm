name: Install Tools
description: Install tools from .tool-versions with the shared infraex-common-config asdf-install-tooling action.
inputs:
  tools:
    default: ""
    description: |
      Line separated tool names to be installed,
      as asdf action doesn't have to install certain tools from .tool-versions file.
      Note: The tool name should match what's in the .tool-versions file.

runs:
  using: composite
  steps:
    - name: Mark repo as safe for git
      shell: bash
      run: |
        # Mark the repo as safe for Git by setting the safe.directory config option. This is required for running jobs in containers like the playwright integration tests.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Filter .tool-versions
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/install-tool-versions"
        mkdir -p "$dir"
        echo "${INPUTS_TOOLS}" | sed '/^$/d' > "$dir/tools"
        echo "⭐ Input tool names content:"
        cat "$dir/tools"
        grep -w -f "$dir/tools" .tool-versions > "$dir/.tool-versions"
        echo "⭐ Filtered .tool-versions content:"
        cat "$dir/.tool-versions"
      env:
        INPUTS_TOOLS: ${{ inputs.tools }}

    - name: Install tools
      uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@e2923304b40dfc031b3f595bcc1445e90c981adb # 3.0.0
      with:
        tool_versions_files: ${{ runner.temp }}/install-tool-versions/.tool-versions
