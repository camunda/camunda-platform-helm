name: Test - Camunda Hub GitOps Phases

"on":
  workflow_call:
    inputs:
      camunda-helm-git-ref:
        required: true
        type: string
      camunda-helm-git-ref-name:
        required: false
        type: string
        default: ""
    secrets:
      VAULT_ADDR:
        required: false
      VAULT_JWT_PATH:
        required: false
      VAULT_JWT_ROLE:
        required: false
      VAULT_JWT_AUDIENCE:
        required: false

permissions:
  contents: read

jobs:
  reconcile:
    name: ${{ matrix.controller }} reconciliation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        controller: ${{ fromJSON(github.event_name == 'merge_group' && '["helm","argocd","flux"]' || '["helm","flux"]') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm
            kind
            kubectl

      - name: Create KIND cluster
        run: kind create cluster --name camunda-hub-gitops-${{ matrix.controller }}

      - name: Import Docker Hub credentials
        id: secrets
        if: matrix.controller == 'argocd'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/distribution/ci DOCKERHUB_USERNAME;
            secret/data/products/distribution/ci DOCKERHUB_PASSWORD;

      - name: Install Argo CD
        if: matrix.controller == 'argocd'
        env:
          DOCKERHUB_USERNAME: ${{ steps.secrets.outputs.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ steps.secrets.outputs.DOCKERHUB_PASSWORD }}
        run: |
          kubectl create namespace argocd
          kubectl -n argocd create secret docker-registry dockerhub \
            --docker-username="${DOCKERHUB_USERNAME}" --docker-password="${DOCKERHUB_PASSWORD}"
          kubectl -n argocd create serviceaccount argocd-redis
          kubectl -n argocd patch serviceaccount argocd-redis -p '{"imagePullSecrets":[{"name":"dockerhub"}]}'
          curl --fail --location --output /tmp/argocd-install.yaml \
            https://raw.githubusercontent.com/argoproj/argo-cd/e95e1be88a2da6c06bff5c2fe1791e4d233ed810/manifests/install.yaml
          sed -i 's#image: public.ecr.aws/docker/library/redis:#image: docker.io/library/redis:#' /tmp/argocd-install.yaml
          kubectl apply --server-side -n argocd -f /tmp/argocd-install.yaml
          kubectl wait -n argocd --for=jsonpath='{.status.readyReplicas}'=1 \
            statefulset/argocd-application-controller --timeout=5m
          kubectl wait -n argocd --for=condition=Available \
            deployment/argocd-repo-server deployment/argocd-redis --timeout=5m

      - name: Install Flux
        if: matrix.controller == 'flux'
        run: |
          curl --fail --location --output /tmp/flux-install.yaml \
            https://github.com/fluxcd/flux2/releases/download/v2.9.3/install.yaml
          printf '%s  %s\n' 'aa0bd71dbc4bed916b9cafa850c4618f341c74c580832c613dca04a067ee7281' \
            /tmp/flux-install.yaml | sha256sum --check
          kubectl apply --server-side -f /tmp/flux-install.yaml
          kubectl wait -n flux-system --for=condition=Available deployment/source-controller --timeout=5m
          kubectl wait -n flux-system --for=condition=Available deployment/helm-controller --timeout=5m

      - name: Test lifecycle reconciliation
        working-directory: scripts/gitops-phase-test
        run: |
          set -o pipefail
          go run . \
            --controller "${{ matrix.controller }}" \
            --revision "${INPUTS_CAMUNDA_HELM_GIT_REF}" \
            --revision-ref-name "${INPUTS_CAMUNDA_HELM_GIT_REF_NAME}" \
            2>&1 | tee "${RUNNER_TEMP}/gitops-phase-${{ matrix.controller }}.log"
        env:
          INPUTS_CAMUNDA_HELM_GIT_REF: ${{ inputs.camunda-helm-git-ref }}
          INPUTS_CAMUNDA_HELM_GIT_REF_NAME: ${{ inputs.camunda-helm-git-ref-name }}

      - name: Show Argo CD diagnostics
        if: failure() && matrix.controller == 'argocd'
        run: |
          kubectl -n argocd get application,appproject -o yaml || true
          kubectl -n argocd get pods -o wide || true
          kubectl -n argocd get events --sort-by=.metadata.creationTimestamp || true
          kubectl -n argocd logs statefulset/argocd-application-controller --all-containers=true || true
          kubectl -n argocd logs deployment/argocd-repo-server --all-containers=true || true
          kubectl -n argocd logs deployment/argocd-redis --all-containers=true || true

      - name: Upload lifecycle diagnostics
        if: failure()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: gitops-phase-${{ matrix.controller }}-diagnostics
          path: ${{ runner.temp }}/gitops-phase-${{ matrix.controller }}.log

      - name: Delete KIND cluster
        if: always()
        run: kind delete cluster --name camunda-hub-gitops-${{ matrix.controller }}

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: "reconcile/${{ matrix.controller }}"
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
