name: Test - Camunda Hub GitOps Phases

"on":
  workflow_call:
    inputs:
      camunda-helm-git-ref:
        required: true
        type: string
      camunda-helm-git-ref-name:
        required: false
        type: string
        default: ""
      controllers:
        description: JSON array overriding the event-specific controller matrix.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  reconcile:
    name: ${{ matrix.controller }} reconciliation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        controller: ${{ fromJSON(inputs.controllers || (github.event_name == 'merge_group' && '["helm","argocd","flux"]' || '["helm","flux"]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm
            kind
            kubectl

      - name: Create KIND cluster
        run: kind create cluster --name camunda-hub-gitops-${{ matrix.controller }}

      - name: Install Argo CD
        if: matrix.controller == 'argocd'
        run: |
          kubectl create namespace argocd
          kubectl apply --server-side -n argocd -f \
            https://raw.githubusercontent.com/argoproj/argo-cd/e95e1be88a2da6c06bff5c2fe1791e4d233ed810/manifests/install.yaml
          kubectl wait -n argocd --for=jsonpath='{.status.readyReplicas}'=1 \
            statefulset/argocd-application-controller --timeout=5m
          kubectl wait -n argocd --for=condition=Available \
            deployment/argocd-repo-server --timeout=5m

      - name: Install Flux
        if: matrix.controller == 'flux'
        run: |
          curl --fail --location --output /tmp/flux-install.yaml \
            https://github.com/fluxcd/flux2/releases/download/v2.9.3/install.yaml
          printf '%s  %s\n' 'aa0bd71dbc4bed916b9cafa850c4618f341c74c580832c613dca04a067ee7281' \
            /tmp/flux-install.yaml | sha256sum --check
          kubectl apply --server-side -f /tmp/flux-install.yaml
          kubectl wait -n flux-system --for=condition=Available deployment/source-controller --timeout=5m
          kubectl wait -n flux-system --for=condition=Available deployment/helm-controller --timeout=5m

      - name: Test lifecycle reconciliation
        working-directory: scripts/gitops-phase-test
        run: |
          set -o pipefail
          go run . \
            --controller "${{ matrix.controller }}" \
            --revision "${{ inputs.camunda-helm-git-ref }}" \
            --revision-ref-name "${{ inputs.camunda-helm-git-ref-name }}" \
            2>&1 | tee "${RUNNER_TEMP}/gitops-phase-${{ matrix.controller }}.log"

      - name: Capture Argo CD diagnostics
        if: always() && matrix.controller == 'argocd'
        timeout-minutes: 3
        run: |
          mkdir -p "${RUNNER_TEMP}/gitops-phase-argocd"
          kubectl --request-timeout=15s -n argocd get application gitops-phase -o yaml > "${RUNNER_TEMP}/gitops-phase-argocd/application.yaml" 2>&1 || true
          kubectl --request-timeout=15s -n argocd get appproject default -o yaml > "${RUNNER_TEMP}/gitops-phase-argocd/project.yaml" 2>&1 || true
          kubectl --request-timeout=15s -n argocd get pods -o yaml > "${RUNNER_TEMP}/gitops-phase-argocd/pods.yaml" 2>&1 || true
          kubectl --request-timeout=15s -n argocd get events --sort-by=.metadata.creationTimestamp > "${RUNNER_TEMP}/gitops-phase-argocd/events.log" 2>&1 || true
          kubectl --request-timeout=15s -n argocd logs deployment/argocd-repo-server --all-containers=true > "${RUNNER_TEMP}/gitops-phase-argocd/repo-server.log" 2>&1 || true
          kubectl --request-timeout=15s -n argocd logs statefulset/argocd-application-controller --all-containers=true > "${RUNNER_TEMP}/gitops-phase-argocd/controller.log" 2>&1 || true
          kubectl --request-timeout=15s -n argocd logs deployment/argocd-server --all-containers=true > "${RUNNER_TEMP}/gitops-phase-argocd/server.log" 2>&1 || true
          kubectl --request-timeout=15s -n argocd logs deployment/argocd-redis --all-containers=true > "${RUNNER_TEMP}/gitops-phase-argocd/redis.log" 2>&1 || true
          kubectl --request-timeout=15s -n argocd logs deployment/argocd-repo-server --all-containers=true --previous > "${RUNNER_TEMP}/gitops-phase-argocd/repo-server-previous.log" 2>&1 || true

      - name: Upload lifecycle diagnostics
        if: always() && (failure() || matrix.controller == 'argocd')
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: gitops-phase-${{ matrix.controller }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitops-phase-${{ matrix.controller }}.log
            ${{ runner.temp }}/gitops-phase-${{ matrix.controller }}/

      - name: Delete KIND cluster
        if: always()
        run: kind delete cluster --name camunda-hub-gitops-${{ matrix.controller }}
