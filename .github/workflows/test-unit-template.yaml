name: "Test - Unit - Template"

on:
  workflow_call:
    inputs:
      identifier:
        description: The unique identifier of used in the deployment hostname.
        required: true
        type: string
      camunda-helm-git-ref:
        required: false
        default: main
        type: string
      camunda-helm-dir:
        required: true
        type: string
    secrets:
      VAULT_ADDR:
        required: false
      VAULT_JWT_PATH:
        required: false
      VAULT_JWT_ROLE:
        required: false
      VAULT_JWT_AUDIENCE:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.identifier }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  init:
    name: Unit - Generate test matrix
    if: inputs.camunda-helm-dir != ''
    runs-on: ubuntu-latest
    outputs:
      unitTestEnabled: ${{ steps.test-type-vars.outputs.unitTestEnabled }}
      unitTestMatrix: ${{ steps.test-type-vars.outputs.unitTestMatrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: "${{ inputs.camunda-helm-git-ref }}"
    - name: Get CI unit test matrix
      id: test-type-vars
      uses: ./.github/actions/test-type-vars
      with:
        chart-dir: "${{ inputs.camunda-helm-dir }}"
    - name: ℹ️ Print outputs ℹ️
      run: |
        echo "unitTestEnabled: ${{ steps.test-type-vars.outputs.unitTestEnabled }}"
        echo "unitTestMatrix: ${{ steps.test-type-vars.outputs.unitTestMatrix }}"

  unitScripts:
    name: UnitTest Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@02b3f0e49b00b98fffc76af690ebc83c28f24dae # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            bats
            golang
      - name: Install bats-assert
        run: |
          git clone https://github.com/bats-core/bats-assert.git test/test_helper/bats-assert
          git clone https://github.com/bats-core/bats-support.git test/test_helper/bats-support
      - name: Run bats
        run: |
          bats test/scripts/*.bats
      - name: Verify license headers
        run: |
          make go.license-verify
      - name: Test license-check tool
        run: |
          cd scripts/license-check && go test ./...
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  unit:
    name: Unit - ${{ matrix.test.name }}
    if: ${{ needs.init.outputs.unitTestEnabled == 'true' && needs.init.outputs.unitTestMatrix != '' }}
    needs: init
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.init.outputs.unitTestMatrix) }}
    env:
      chartPath: "charts/${{ inputs.camunda-helm-dir }}"
    steps:
    - uses: camunda/infra-global-github-actions/start-build-monitor@02b3f0e49b00b98fffc76af690ebc83c28f24dae # main
    - name: ℹ️ Print workflow inputs ℹ️
      env:
        GITHUB_CONTEXT: ${{ toJson(inputs) }}
      run: |
        echo "Workflow Inputs:"
        echo "${GITHUB_CONTEXT}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install tools
      uses: ./.github/actions/install-tool-versions
      with:
        tools: |
          golang
          helm
    - name: Configure curl and wget
      uses: ./.github/actions/setup-curl
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.asdf/installs/golang/*/packages/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Format
      run: |
        make go.fmt
    - name: Install License Tool
      run: |
        make go.addlicense-install
        asdf reshim golang
    - name: Check License
      run: |
        make go.addlicense-check
    - name: Add helm repos
      run: |
        make helm.repos-add
    - name: Get Helm dependency
      run: |
        make helm.dependency-update
    - name: ⭐️ Test ⭐️
      run: |
        cd charts/${{ inputs.camunda-helm-dir }}/test/unit
        go test $(printf "./%s " ${{ matrix.test.packages }})
    - name: Observe build status
      if: always()
      continue-on-error: true
      uses: ./.github/actions/observe-build-status
      with:
        build_status: ${{ job.status }}
        job_name: "${{ github.job }}/${{ matrix.test.name }}"
        secret_vault_address: ${{ secrets.VAULT_ADDR }}
        secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
        secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
        secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
