# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: "Test - Release Tooling"

# Gates every Go module under scripts/.
# Deliberately UNFILTERED: the tooling's behavior is
# coupled to inputs that live outside scripts/ (charts/**/values*.yaml,
# charts/chart-versions.yaml, the committed version-matrix, the release-please
# trace + Harbor API shapes), so a chart-only PR must still run these tests.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go lint + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            golangci-lint
            helm
            git-cliff
            yq
            jq
            actionlint
            shellcheck

      # TestImageSetRealChartContract reads each chart's vendored subcharts
      # (keycloak/ES/PG for 8.7-8.9), so they must be present before `go test`.
      # dependency-update downloads the subcharts; it does not render templates.
      - name: Vendor subcharts for the real-chart contract tests
        run: |
          make helm.repos-add
          make helm.dependency-update

      - name: Install ripgrep for helm_unused_values tests
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Test every Go module under scripts/
        run: make go.test-scripts

      - name: Lint every Go module under scripts/
        run: make go.lint lintBase=HEAD~1

      - name: Gate the complexity of changed Go functions and workflow run blocks
        run: make go.complexity lintBase=HEAD~1

      - name: Lint workflows and shell scripts
        run: make ci.lint

      - name: Install schema generator
        run: |
          make install.readme-generator

      - name: Validate previous-minor schema upgrade coverage
        run: |
          for allowlist in charts/*/test/unit/deprecation/allowlist.yaml; do
            make helm.schema-validate-values chartPath="${allowlist%/test/unit/deprecation/allowlist.yaml}"
          done

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  credential-store-changes:
    name: Detect credential-store changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.stores == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            stores:
              - 'scripts/deploy-camunda/credentials/reconcile*.go'
              - 'charts/internal-keycloak-26/**'
              - 'charts/internal-postgresql/**'
              - 'test/integration/companion-values/*-dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/ci/registry/dependencies/*-dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/ci/registry/scenarios/dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/integration/scenarios/chart-full-setup/values/features/dogfood-hub.yaml'
              - '.github/workflows/test-release-tooling.yaml'
              - 'Makefile'
              - '.tool-versions'

  credential-store-integration:
    name: Credential stores against real images
    needs: credential-store-changes
    if: needs.credential-store-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang

      # Runs the reconcile scripts against PostgreSQL, Elasticsearch, and
      # Keycloak containers, including the kc.sh bootstrap-admin recovery.
      - name: deploy-camunda — credential-store integration tests
        run: make test.deploy-camunda-credential-stores

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
