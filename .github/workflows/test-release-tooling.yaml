# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: "Test - Release Tooling"

# Gates the Go that the release and chart-validate pipelines depend on
# (scripts/camunda-core + scripts/release-tools + scripts/validate-values-schema
# + scripts/deploy-camunda + scripts/orchestration-entra-lifecycle).
# Deliberately UNFILTERED: the tooling's behavior is
# coupled to inputs that live outside scripts/ (charts/**/values*.yaml,
# charts/chart-versions.yaml, the committed version-matrix, the release-please
# trace + Harbor API shapes), so a chart-only PR must still run these tests.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test + vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm

      # TestImageSetRealChartContract reads each chart's vendored subcharts
      # (keycloak/ES/PG for 8.7-8.9), so they must be present before `go test`.
      # dependency-update downloads the subcharts; it does not render templates.
      - name: Vendor subcharts for the real-chart contract tests
        run: |
          make helm.repos-add
          for v in 8.7 8.8 8.9 8.10; do
            make helm.dependency-update chartPath="charts/camunda-platform-$v"
          done

      - name: camunda-core — vet + test
        working-directory: scripts/camunda-core
        run: |
          go vet ./pkg/...
          go test ./pkg/...

      - name: deploy-camunda — vet + test
        working-directory: scripts/deploy-camunda
        run: |
          go vet ./...
          go test ./...

      - name: release-tools — vet + test
        working-directory: scripts/release-tools
        run: |
          go vet ./...
          go test ./...

      - name: validate-values-schema — vet + test
        working-directory: scripts/validate-values-schema
        run: |
          go vet ./...
          go test ./...

      - name: orchestration-entra-lifecycle — vet + test
        working-directory: scripts/orchestration-entra-lifecycle
        run: |
          go vet ./...
          go test ./...

      - name: integration-tests-gate — vet + test
        working-directory: scripts/integration-tests-gate
        run: |
          go vet ./...
          go test ./...

  credential-store-changes:
    name: Detect credential-store changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.stores == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            stores:
              - 'scripts/deploy-camunda/cmd/topology_reconcile*.go'
              - 'charts/internal-keycloak-26/**'
              - 'charts/internal-postgresql/**'
              - 'test/integration/companion-values/*-dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/ci/registry/dependencies/*-dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/ci/registry/scenarios/dogfood.yaml'
              - 'charts/camunda-platform-8.10/test/integration/scenarios/chart-full-setup/values/features/dogfood-hub.yaml'
              - '.github/workflows/test-release-tooling.yaml'
              - 'Makefile'
              - '.tool-versions'

  credential-store-integration:
    name: Credential stores against real images
    needs: credential-store-changes
    if: needs.credential-store-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang

      # Runs the reconcile scripts against PostgreSQL, Elasticsearch, and
      # Keycloak containers, including the kc.sh bootstrap-admin recovery.
      - name: deploy-camunda — credential-store integration tests
        run: make test.deploy-camunda-credential-stores
