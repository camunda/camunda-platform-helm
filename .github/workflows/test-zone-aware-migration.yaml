name: "Test - Zone-aware migration"

on:
  pull_request:
    paths:
      - "charts/camunda-platform-8.10/templates/orchestration/**"
      - "charts/camunda-platform-8.10/templates/common/constraints.tpl"
      - "charts/camunda-platform-8.10/templates/common/_helpers.tpl"
      - "charts/camunda-platform-8.10/values.yaml"
      - "charts/camunda-platform-8.10/values.schema.json"
      - "charts/camunda-platform-8.10/values.schema.extra.json"
      - "charts/camunda-platform-8.10/test/integration/scenarios/zone-aware-migration/**"
      - "charts/camunda-platform-8.11/templates/orchestration/**"
      - "charts/camunda-platform-8.11/templates/common/constraints.tpl"
      - "charts/camunda-platform-8.11/templates/common/_helpers.tpl"
      - "charts/camunda-platform-8.11/values.yaml"
      - "charts/camunda-platform-8.11/values.schema.json"
      - "charts/camunda-platform-8.11/values.schema.extra.json"
      - "charts/camunda-platform-8.11/test/integration/scenarios/zone-aware-migration/**"
      - "scripts/zone-aware-migration/**"
      - "Makefile"
      - ".github/workflows/test-zone-aware-migration.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zone-aware-migration:
    name: Zone-aware migration - KIND ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.10", "8.11"]
    env:
      chartPath: charts/camunda-platform-${{ matrix.version }}
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            kind
            kubectl
            helm
            golang

      - name: Checkout pre-change chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .migration-base

      - name: Create KIND cluster
        run: kind create cluster --name zone-aware-migration --wait 120s

      - name: Add helm repos
        run: make helm.repos-add

      - name: Get Helm dependency
        run: make helm.dependency-update

      - name: Verify the migration sequence
        env:
          BASE_CHART_DIR: ${{ github.workspace }}/.migration-base/${{ env.chartPath }}
        run: |
          if [[ "${{ matrix.version }}" == "8.11" && ! -f "${BASE_CHART_DIR}/Chart.yaml" ]]; then
            export BASE_CHART_DIR="${GITHUB_WORKSPACE}/.migration-base/charts/camunda-platform-8.10"
          fi
          make helm.dependency-update chartPath="$BASE_CHART_DIR"
          make test.zone-aware-migration

      - name: Collect diagnostics
        if: failure()
        run: make diagnostics.print namespace=zone-aware-migration

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
