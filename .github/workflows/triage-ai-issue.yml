name: Triage - Issue triage

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, transferred]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (omit to process project intake and unassessed internal Backlog issues)
        required: false
  workflow_call:
    inputs:
      issue_number:
        description: Issue number (omit for bulk processing)
        required: false
        type: string
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true

permissions:
  contents: read

jobs:
  select:
    if: >-
      github.event_name != 'issues' ||
      !startsWith(github.event.label.name, 'triage:slack-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      issues: ${{ steps.select.outputs.issues }}
      has_issues: ${{ steps.select.outputs.has_issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool-versions
        with:
          tools: golang
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ steps.vault.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
          permission-members: read
          permission-issues: read
          permission-organization-projects: read
      - name: Select issues
        id: select
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: make run.issue-triage command=select

  triage:
    needs: select
    if: needs.select.outputs.has_issues == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    concurrency:
      group: issue-triage-${{ github.repository }}-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool-versions
        with:
          tools: golang
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
            secret/data/products/distribution/ci GLEAN_API_TOKEN;
            secret/data/products/distribution/ci SLACK_DISTRO_BOT_WEBHOOK_GH;
          exportEnv: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ steps.vault.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
          permission-members: read
          permission-issues: write
          permission-organization-projects: write
      - name: Assess priority and report external intake
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GLEAN_API_TOKEN: ${{ steps.vault.outputs.GLEAN_API_TOKEN }}
          SLACK_WEBHOOK: ${{ steps.vault.outputs.SLACK_DISTRO_BOT_WEBHOOK_GH }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: make run.issue-triage command=triage
