# type: Project Management
# owner: @camunda/smx
---
# AI-Powered Bug & Task Triage Workflow
#
# This workflow automatically triages new/untriaged issues using Glean Chat API (RAG).
# It analyzes issues against Distro triage documentation and applies severity/likelihood labels,
# posts a structured triage assessment comment, and moves issues to Backlog.
#
# How it works:
# - Triggers on issue events (opened, labeled, unlabeled, reopened, transferred) and manual dispatch
# - Schedule trigger (daily at 10 AM UTC) is currently commented out pending manual testing
# - Fetches untriaged issues from Project #33 (Status=Inbox, no TRIAGE:COMPLETED label)
# - Calls Glean Chat API with issue content for AI-powered triage assessment
# - Skips issues with confidence < 0.7 or 'triage:manual' label
# - Applies severity/* and likelihood/* labels based on AI assessment
# - Posts a triage assessment comment with rationale and similar issues
# - Moves issue to 📋 Backlog
# - The assign-urgency-to-issue.yml workflow then calculates urgency and routes to Ready if immediate
#
# Manual usage:
#   gh workflow run ai-triage-issue.yml
#   gh workflow run ai-triage-issue.yml -f issue_number=123
#
name: Triage - Issue triage

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, transferred]
  # schedule:
  #   - cron: '0 10 * * *'  # Daily at 10:00 UTC - commented out pending manual testing
  workflow_dispatch:
    inputs:
      classification_only:
        description: Verify App-token author classification without triage or issue mutations
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'Issue number to triage (optional, for single-issue mode)'
        required: false
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: false
        type: string
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_JWT_PATH:
        required: false
      VAULT_JWT_ROLE:
        required: false
      VAULT_JWT_AUDIENCE:
        required: false
      VAULT_ROLE_ID:
        required: false
      VAULT_SECRET_ID:
        required: false

concurrency:
  group: ai-triage-${{ inputs.issue_number || github.event.inputs.issue_number || github.event.issue.number || 'bulk' }}
  cancel-in-progress: false

jobs:
  ai-triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      PROJECT_NUMBER: 33
      CONFIDENCE_THRESHOLD: '0.7'
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: camunda/camunda-platform-helm
          ref: ${{ github.repository == 'camunda/camunda-platform-helm' && github.sha || 'main' }}
          persist-credentials: false
      - uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@f9cb6ee788ce74f87effda9aeb0a3aa2612ea6c1 # 3.0.14
      - name: Import Vault secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault-secrets
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: ${{ secrets.VAULT_JWT_ROLE != '' && 'jwt' || 'approle' }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          roleId: ${{ secrets.VAULT_JWT_ROLE == '' && secrets.VAULT_ROLE_ID || '' }}
          secretId: ${{ secrets.VAULT_JWT_ROLE == '' && secrets.VAULT_SECRET_ID || '' }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
            secret/data/products/distribution/ci GLEAN_API_TOKEN;
            secret/data/products/distribution/ci SLACK_DISTRO_BOT_WEBHOOK_GH;
          exportEnv: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-github-token
        with:
          app-id: ${{ steps.vault-secrets.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault-secrets.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
          permission-issues: write
          permission-members: read
          permission-organization-projects: write

      - name: Set GitHub token
        run: |
          echo "GH_TOKEN=${{ steps.generate-github-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Fetch untriaged issues
        id: fetch_issues
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number || github.event.inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Determine which issues to process
          if [[ -n "$MANUAL_ISSUE" ]]; then
            if [[ ! "$MANUAL_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::issue_number must be a positive integer"
              exit 1
            fi
            # Single issue mode (manual dispatch or workflow_call with issue_number)
            ISSUE_NUMBERS="$MANUAL_ISSUE"
            echo "📋 Single issue mode: #${ISSUE_NUMBERS}"
          elif [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            # New issue event
            ISSUE_NUMBERS="$EVENT_ISSUE"
            echo "📋 New issue event: #${ISSUE_NUMBERS}"
          else
            # Bulk mode (scheduled or manual dispatch without issue_number)
            echo "📋 Bulk mode: fetching untriaged issues from Project #${PROJECT_NUMBER}"

            # Query for issues in Inbox status without TRIAGE:COMPLETED label
            # shellcheck disable=SC2016 # the $ names are GraphQL variables, not shell expansions
            QUERY='
              query($owner:String!, $repo:String!) {
                repository(owner:$owner, name:$repo) {
                  issues(first:50, states:OPEN, orderBy:{field:CREATED_AT, direction:DESC}) {
                    nodes {
                      number
                      labels(first:20) { nodes { name } }
                      projectItems(first:10) {
                        nodes {
                          id
                          project { number }
                          fieldValues(first:20) {
                            nodes {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                field { ... on ProjectV2SingleSelectField { name } }
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }'

            RESPONSE=$(gh api graphql -f query="$QUERY" -F owner="$OWNER" -F repo="$REPO")

            # Filter issues:
            # - In target project (#33)
            # - Status = "📥 Inbox"
            # - No TRIAGE:COMPLETED label
            # - No triage:manual label
            ISSUE_NUMBERS=$(echo "$RESPONSE" | jq -r --argjson pn "$PROJECT_NUMBER" '
              .data.repository.issues.nodes[]
              | select(
                  (.projectItems.nodes[] | select(.project.number==$pn) | .fieldValues.nodes[] | select(.field.name=="Status") | .name) == "📥 Inbox"
                  and (.labels.nodes | map(.name) | any(. == "TRIAGE:COMPLETED") | not)
                  and (.labels.nodes | map(.name) | any(. == "triage:manual") | not)
                )
              | .number' | tr '\n' ' ')

            if [[ -z "$ISSUE_NUMBERS" ]]; then
              echo "ℹ️  No untriaged issues found"
              echo "has_issues=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "📋 Found untriaged issues: $ISSUE_NUMBERS"
          fi

          echo "has_issues=true" >> "$GITHUB_OUTPUT"
          echo "issue_numbers=$ISSUE_NUMBERS" >> "$GITHUB_OUTPUT"

      - name: Triage issues
        if: steps.fetch_issues.outputs.has_issues == 'true'
        env:
          ISSUE_NUMBERS: ${{ steps.fetch_issues.outputs.issue_numbers }}
          GLEAN_API_TOKEN: ${{ steps.vault-secrets.outputs.GLEAN_API_TOKEN }}
          SLACK_DISTRO_BOT_WEBHOOK_GH: ${{ steps.vault-secrets.outputs.SLACK_DISTRO_BOT_WEBHOOK_GH }}
          CLASSIFICATION_ONLY: ${{ inputs.classification_only || false }}
        run: make run.issue-triage
