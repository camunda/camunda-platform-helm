---
name: Check values-latest.yaml

"on":
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - 'charts/camunda-platform-*/values-latest.yaml'
      - 'scripts/check-values-latest.sh'
      - '.github/workflows/check-values-latest.yaml'
  workflow_dispatch:
    inputs:
      chart-version:
        description: |
          Specific chart version to check (e.g., 8.7), leave empty for all
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  check-values-latest:
    name: Check values-latest.yaml files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            yq

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run validation script
        id: validation
        continue-on-error: true
        run: |
          if [[ -n "${{ inputs.chart-version }}" ]]; then
            bash scripts/check-values-latest.sh \
              "${{ inputs.chart-version }}"
          else
            bash scripts/check-values-latest.sh
          fi

      - name: Report outdated values-latest.yaml
        if: steps.validation.outcome == 'failure'
        run: |
          echo "::warning title=values-latest.yaml outdated::Some image versions in values-latest.yaml files are not up-to-date. See the validation step logs."

      - name: Sync PR warning comment and label
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const marker = '<!-- check-values-latest -->'
            const label = 'deps/stale'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const outdated = process.env.VALIDATION_OUTCOME === 'failure'

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            })
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            )

            if (outdated) {
              const body = marker + '\n' +
                '⚠️ **values-latest.yaml is outdated**\n\n' +
                'Some image versions in `values-latest.yaml` files are ' +
                'not up-to-date with the latest releases. Please review ' +
                'the workflow logs for details.\n\n' +
                '🔎 [Open PRs labeled `deps/charts`](https://github.com/camunda/camunda-platform-helm/pulls?q=is%3Apr+state%3Aopen+label%3Adeps%2Fcharts)'
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] })
            } else {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id })
              }
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
              } catch (e) {
                if (e.status !== 404) throw e
              }
            }

      # - name: 🚨 Notify the team via Slack 🚨
      #   if: failure() && !(contains(github.event.*.labels.*.name, 'skip-slack-notify'))
      #   uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
