# Docs: https://github.com/camunda/camunda-platform-helm/blob/main/docs/gha-workflows.md
name: "Clean Up Namespace"

on:
  workflow_call:
    inputs:
      namespace:
        description: The namespace where the deployment is running.
        required: true
        type: string
      camunda-helm-git-ref:
        required: false
        default: main
        type: string
      distro-platform:
        default: gke
        type: string
      auth-data:
        required: false
        type: string
      teleport-token:
        description: The Teleport token to use for authentication.
        required: false
        default: infra-ci-prod-github-action-distribution
        type: string

env:
  TELEPORT_TOKEN: ${{ inputs.teleport-token }}

jobs:
  cleanup:
    name: Cleanup - ${{ inputs.namespace }} on ${{ inputs.distro-platform }}
    # This if is here to protect against important namespaces getting deleted accidentally.
    # Right now this is scoped to QA namespaces only. I don't see a reason to
    # run this on any other namespaces are the helm repo can clean up during it runs.
    # There might be a case for the mono repo to run this but if/when that happens, this will be easy to extend.
    if: startsWith(inputs.namespace, 'qa-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write 
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
      - name: CI Setup - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This is needed to load repo GH composite actions if the workflow triggered by workflow_call.
          repository: camunda/camunda-platform-helm
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: Load and filter distro config
        id: load-config
        shell: bash
        run: |
          config=$(cat ./.github/config/test-integration-matrix.yaml)

          filtered=$(echo "$config" | yq -o json | jq -r --arg platform "${INPUTS_DISTRO_PLATFORM}" '.matrix.distro[] | select(.platform == ($platform | ascii_downcase))')

          if [[ -z "$filtered" ]]; then
            echo "No distro found for platform ${INPUTS_DISTRO_PLATFORM}"
            exit 1
          fi

          {
            echo "distro_config<<EOF"
            echo "$filtered"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUTS_DISTRO_PLATFORM: ${{ inputs.distro-platform }}

      - name: Load infra config
        id: infra
        shell: bash
        run: |
          INFRA_CONFIG=".github/config/infra.yaml"
          echo "CLUSTER_NAME=$(yq '.eks.cluster-name' "$INFRA_CONFIG")" >> "$GITHUB_ENV"

      - name: CI Setup - Install tools
        uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@ab4b2b3604eea14f2b41b77bbc9a66bbf2e51df4 # 3.0.13

      - name: Import Vault secrets
        if: inputs.distro-platform == 'gke'
        id: test-credentials-secret
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_NAME;
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_LOCATION;
            secret/data/products/distribution/ci DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER;
            secret/data/products/distribution/ci DISTRO_CI_GCP_SERVICE_ACCOUNT;
            secret/data/products/distribution/ci ENTRA_APP_CLIENT_ID;
            secret/data/products/distribution/ci ENTRA_APP_CLIENT_SECRET;
            secret/data/products/distribution/ci ENTRA_APP_DIRECTORY_ID;
          exportEnv: false

      - name: Import GitHub App credentials from Vault
        id: distro-ci-app
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/distribution/ci/github-app-manage-gh-envs APP_ID;
            secret/data/products/distribution/ci/github-app-manage-gh-envs APP_KEY;
          exportEnv: false

      - name: CI Setup - Authenticate to cluster
        id: cluster-auth
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ steps.distro-ci-app.outputs.APP_ID }}
          GH_APP_KEY:       ${{ steps.distro-ci-app.outputs.APP_KEY }}
          GKE_CLUSTER_NAME: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_LOCATION }}
          GKE_WIP:          ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GKE_SA:           ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_SERVICE_ACCOUNT }}
          ROSA_URL:         ${{ secrets[fromJson(steps.load-config.outputs.distro_config).secret.server-url] }}
          ROSA_USER:        ${{ secrets[fromJson(steps.load-config.outputs.distro_config).secret.username] }}
          ROSA_PASS:        ${{ secrets[fromJson(steps.load-config.outputs.distro_config).secret.password] }}
          CLUSTER_NAME:     ${{ env.CLUSTER_NAME }}

      - name: CI Cleanup
        shell: bash
        run: |
          kubectl annotate ns "${INPUTS_NAMESPACE}" cleaner/ttl=1s --overwrite=true
          kubectl annotate ns "${INPUTS_NAMESPACE}" janitor/ttl=1s --overwrite=true
        env:
          INPUTS_NAMESPACE: ${{ inputs.namespace }}

      - name: CI Cleanup - Delete the deployment's Entra login app registration
        if: inputs.distro-platform == 'gke' && contains(inputs.namespace, 'qaen')
        continue-on-error: true
        working-directory: scripts/deploy-camunda
        shell: bash
        env:
          ENTRA_APP_CLIENT_ID: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_CLIENT_ID }}
          ENTRA_APP_CLIENT_SECRET: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_CLIENT_SECRET }}
          ENTRA_APP_DIRECTORY_ID: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_DIRECTORY_ID }}
          INPUTS_NAMESPACE: ${{ inputs.namespace }}
        run: |
          go run . entra cleanup-login-app --namespace "${INPUTS_NAMESPACE}" --log-level info

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
