        uses: ./.github/actions/upload-artifact-retry
        with:
          name: e2e-html-report-${{ inputs.identifier }}-${{ inputs.flow }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.shortname }}
          path: playwright-report
          retention-days: 14

      - name: E2E - Upload Playwright JSON results
        if: always() && steps.e2e-plan.outcome == 'success'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: playwright-results-json-${{ github.run_id }}-${{ inputs.identifier }}-${{ inputs.flow }}-${{ inputs.distro-platform }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/test-results/*/playwright-results.json
            e2e-artifacts/results/*.json
          if-no-files-found: warn
          retention-days: 5

      - name: E2E - Upload Playwright traces for failed tests
        if: always() && (steps.e2e.outcome == 'failure' || steps.e2e.outputs.non-blocking-failed == 'true')
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: playwright-traces-${{ github.run_id }}-${{ inputs.identifier }}-${{ inputs.flow }}-${{ inputs.distro-platform }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/test-results/**/trace.zip
            e2e-artifacts/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 5

      - name: E2E - Upload namespace diagnostics
        if: always() && hashFiles('e2e-artifacts/diagnostics/*.txt') != ''
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: diagnostics-e2e-${{ inputs.identifier }}-${{ inputs.flow }}-${{ inputs.shortname }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/diagnostics/
          retention-days: 1
          if-no-files-found: ignore

      ##########################################################################################################
      # Diagnostics
      ##########################################################################################################

      - name: 🚨 Get failed Pods info 🚨
        if: failure() && env.TEST_NAMESPACE != ''
        uses: ./.github/actions/failed-pods-info

      - name: Collect topology namespace diagnostics
        if: failure() && inputs.is-topology && env.TEST_NAMESPACE != ''
        uses: ./.github/actions/topology-diagnostics
        with:
          base-namespace: ${{ env.TEST_NAMESPACE }}
          suffixes: ${{ inputs.topology-namespace-suffixes }}

      - name: Compute diagnostics artifact name
        if: failure()
        id: diag-artifact
        shell: bash
        run: |
          raw="diagnostics-${{ inputs.identifier }}-${{ inputs.flow }}-${{ inputs.shortname }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}"
          # Artifact names reject spaces/colons/slashes etc.; normalize to a safe set.
          echo "name=${raw//[^a-zA-Z0-9._-]/-}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment diagnostics bundle
        if: failure()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: ${{ steps.diag-artifact.outputs.name }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      ##########################################################################################################
      # Cleanup
      ##########################################################################################################

      # The GitHub App token from setup expires after an hour, which a long
      # deploy plus e2e run can exceed.
      - name: CI Cleanup - Refresh cluster auth
        id: cleanup-auth
        if: always() && env.TEST_NAMESPACE != ''
        continue-on-error: true
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.setup.outputs.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.setup.outputs.GKE_CLUSTER_LOC }}
          GKE_WIP:          ${{ steps.setup.outputs.GKE_WIP }}
          GKE_SA:           ${{ steps.setup.outputs.GKE_SA }}
          ROSA_URL:         ${{ secrets[inputs.server-url] }}
          ROSA_USER:        ${{ secrets[inputs.username] }}
          ROSA_PASS:        ${{ secrets[inputs.password] }}
          CLUSTER_NAME:     ${{ env.INFRA_CLUSTER_NAME }}

      - name: CI Cleanup - Warn when cleanup cannot reach the cluster
        if: always() && env.TEST_NAMESPACE != '' && steps.cleanup-auth.outcome == 'failure'
        run: |
          echo "::warning title=Integration cleanup::could not re-authenticate to the cluster; namespace ${TEST_NAMESPACE} and its topology namespaces are left for the cleaner/janitor TTL (${CI_DEPLOYMENT_TTL:-1h}) and the Entra/Auth0 test clients may not be deleted"

      - name: CI Cleanup - Cleanup GitHub deployment
        if: always() && env.TEST_NAMESPACE != '' && (env.CI_DEPLOYMENT_TTL == '' || inputs.distro-type != 'kubernetes')
        continue-on-error: true # We don't want to fail if the deployment is not found.
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: delete-env
          token: ${{ steps.cleanup-auth.outputs.token || steps.setup.outputs.cluster-auth-token }}
          env: ${{ steps.setup.outputs.identifier }}
          ref: ${{ inputs.caller-git-ref }}

      - name: CI Cleanup - Delete venom Entra app registration
        if: always() && env.TEST_NAMESPACE != '' && (inputs.auth == 'oidc' || inputs.scenario == 'oidc' || inputs.test-identity == 'oidc')
        continue-on-error: true
        env:
          ENTRA_APP_CLIENT_ID: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_ID }}
          ENTRA_APP_CLIENT_SECRET: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_SECRET }}
          ENTRA_APP_OBJECT_ID: ${{ steps.setup.outputs.ENTRA_APP_OBJECT_ID }}
          ENTRA_APP_DIRECTORY_ID: ${{ steps.setup.outputs.ENTRA_APP_DIRECTORY_ID }}
        run: |
          deploy-camunda entra cleanup-venom-app \
            --namespace "$TEST_NAMESPACE" \
            --log-level info

      - name: CI Cleanup - Delete Auth0 OIDC clients
        # The auth0 scenario provisions per-component first-party clients in the
        # tenant via `auth0 ensure-clients`; namespace deletion does not touch
        # the tenant, so without this step orphans accumulate across PR runs.
        if: always() && env.TEST_NAMESPACE != '' && inputs.scenario == 'auth0'
        continue-on-error: true
        env:
          AUTH0_DOMAIN: ${{ steps.setup.outputs.AUTH0_DOMAIN }}
          AUTH0_MGMT_CLIENT_ID: ${{ steps.setup.outputs.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ steps.setup.outputs.AUTH0_MGMT_CLIENT_SECRET }}
        run: |
          deploy-camunda auth0 cleanup-clients \
            --namespace "$TEST_NAMESPACE" \
            --domain "$AUTH0_DOMAIN" \
            --log-level info

      - name: CI Cleanup
        if: always() && env.TEST_NAMESPACE != '' && inputs.always-delete-namespace
        run: |
          kubectl annotate ns $TEST_NAMESPACE test-flow=${{ inputs.flow }} --overwrite || true
          kubectl annotate ns $TEST_NAMESPACE build-failed=true --overwrite || true

          if [[ "$(kubectl get ns $TEST_NAMESPACE --ignore-not-found)" != "" && "${{ env.CI_DEPLOYMENT_TTL }}" == "" ]]; then
            kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=1s --overwrite=true
            kubectl annotate ns $TEST_NAMESPACE janitor/ttl=1s --overwrite=true
          else
            if [[ "${{ inputs.distro-type }}" == "kubernetes" && "${{ env.CI_DEPLOYMENT_TTL }}" != "" ]]; then
              kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=${CI_DEPLOYMENT_TTL} --overwrite=true || true
              kubectl annotate ns $TEST_NAMESPACE janitor/ttl=${CI_DEPLOYMENT_TTL} --overwrite=true || true
            else
              kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=1s --overwrite=true || true
              kubectl annotate ns $TEST_NAMESPACE janitor/ttl=1s --overwrite=true || true
            fi
          fi

      - name: CI Cleanup - Reap topology namespaces
        if: always() && env.TEST_NAMESPACE != '' && inputs.always-delete-namespace && inputs.is-topology
        run: |
          while IFS= read -r suffix; do
            ns="$(deploy-camunda topology namespace --base "$TEST_NAMESPACE" --suffix "$suffix")"

            kubectl annotate ns "$ns" test-flow=${{ inputs.flow }} --overwrite || true
            kubectl annotate ns "$ns" build-failed=true --overwrite || true

            if [[ "$(kubectl get ns "$ns" --ignore-not-found)" != "" && "${{ env.CI_DEPLOYMENT_TTL }}" == "" ]]; then
              kubectl annotate ns "$ns" cleaner/ttl=1s --overwrite=true || true
              kubectl annotate ns "$ns" janitor/ttl=1s --overwrite=true || true
            else
              if [[ "${{ inputs.distro-type }}" == "kubernetes" && "${{ env.CI_DEPLOYMENT_TTL }}" != "" ]]; then
                kubectl annotate ns "$ns" cleaner/ttl="${CI_DEPLOYMENT_TTL}" --overwrite=true || true
                kubectl annotate ns "$ns" janitor/ttl="${CI_DEPLOYMENT_TTL}" --overwrite=true || true
              else
                kubectl annotate ns "$ns" cleaner/ttl=1s --overwrite=true || true
                kubectl annotate ns "$ns" janitor/ttl=1s --overwrite=true || true
              fi
            fi
          done < <(jq -r '.[]' <<< '${{ inputs.topology-namespace-suffixes }}')

      - name: CI Cleanup - Mark cleanup done
        id: cleanup-done
        if: always()
        run: echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  # Record a successful scenario result as a commit status on the PR HEAD commit.
  # This enables progressive CI result caching: future merge queue attempts can
  # skip scenarios that already passed for the same content hash.
  record-result:
    name: Record cache result - ${{ inputs.flow }} on ${{ inputs.distro-platform }} - ${{ inputs.shortname }}
    needs: [integration]
    # Only record when:
    # 1. The integration job succeeded (non-blocking e2e legs may have failed)
    #    Note: we check both 'failure' AND 'cancelled' to prevent false positives when
    #    tests are cancelled (e.g., timeout). A cancelled job result is 'cancelled', not 'failure'.
    # 2. PR HEAD SHA is available (set by the init job for merge_group and pull_request events)
    # 3. Camunda version is set (needed for content hash computation)
    if: >-
      ${{
        !cancelled() &&
        !contains(needs.*.result, 'failure') &&
        !contains(needs.*.result, 'cancelled') &&
        inputs.pr-head-sha != '' &&
        inputs.camunda-version != ''
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: camunda/camunda-platform-helm
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/ci-result-cache/go.mod
          cache: true
          cache-dependency-path: scripts/ci-result-cache/go.sum

      - name: Record passing result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd scripts/ci-result-cache && go build -o /tmp/ci-result-cache .
          /tmp/ci-result-cache record \
            --sha "${{ inputs.pr-head-sha }}" \
            --version "${{ inputs.camunda-version }}" \
            --shortname "${{ inputs.shortname }}" \
            --flow "${{ inputs.flow }}" \
            --repo-root "${{ github.workspace }}" \
            --target-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Runs only when the integration job ended before its own cleanup steps
  # finished (job timeout, cancellation, lost runner).
  cleanup-fallback:
    name: Cleanup fallback - ${{ inputs.flow }} on ${{ inputs.distro-platform }} - ${{ inputs.shortname }}
    needs: [integration]
    if: ${{ always() && needs.integration.result != 'skipped' && needs.integration.outputs.cleanup-done != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/camunda/team-distribution/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      deployments: write
      packages: read
    steps:
      - name: CI Setup - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This is needed to load repo GH composite actions if the workflow triggered by workflow_call.
          repository: camunda/camunda-platform-helm
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: CI Setup - Configure Git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Download deploy-camunda binary
        timeout-minutes: 3
        continue-on-error: true # A sustained artifact-service outage must not skip the namespace-reaping steps below.
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.binary-artifact-name }}
          path: ${{ runner.temp }}/bin

      - name: Add deploy-camunda to PATH
        run: |
          if [ -f "${RUNNER_TEMP}/bin/deploy-camunda" ]; then
            chmod +x "${RUNNER_TEMP}/bin/deploy-camunda"
          fi
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: CI Setup - ℹ️ Set workflow vars for both install and upgrade ℹ️
        id: vars
        uses: ./.github/actions/workflow-vars
        with:
          deployment-ttl: ${{ env.CI_DEPLOYMENT_TTL }}
          setup-flow: ${{ inputs.flow }}
          platform: ${{ inputs.distro-platform }}
          identifier-base: ${{ inputs.identifier }}
          chart-dir: ${{ inputs.camunda-helm-dir }}
          chart-upgrade-version: ${{ inputs.camunda-helm-upgrade-version }}
          prefix: ${{ inputs.namespace-prefix }}

      - name: CI Setup - Set test type vars
        id: test-type-vars
        uses: ./.github/actions/test-type-vars
        with:
          chart-dir: "${{ inputs.camunda-helm-dir }}"
          infra-type: "${{ inputs.infra-type }}"
          platform: "${{ inputs.distro-platform }}"
          flow: "${{ inputs.flow }}"

      - name: Import Vault secrets
        if: inputs.distro-platform == 'gke'
        id: test-credentials-secret
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_NAME;
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_LOCATION;
            secret/data/products/distribution/ci DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER;
            secret/data/products/distribution/ci DISTRO_CI_GCP_SERVICE_ACCOUNT;
            secret/data/products/distribution/ci AUTH0_DOMAIN;
            secret/data/products/distribution/ci AUTH0_MGMT_CLIENT_ID;
            secret/data/products/distribution/ci AUTH0_MGMT_CLIENT_SECRET;
            secret/data/products/distribution/ci ENTRA_APP_CLIENT_ID;
            secret/data/products/distribution/ci ENTRA_APP_CLIENT_SECRET;
            secret/data/products/distribution/ci ENTRA_APP_OBJECT_ID;
            secret/data/products/distribution/ci ENTRA_APP_DIRECTORY_ID;
          exportEnv: false

      - name: CI Setup - Authenticate to cluster
        id: cluster-auth
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_LOCATION }}
          GKE_WIP:          ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GKE_SA:           ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_SERVICE_ACCOUNT }}
          ROSA_URL:         ${{ secrets[inputs.server-url] }}
          ROSA_USER:        ${{ secrets[inputs.username] }}
          ROSA_PASS:        ${{ secrets[inputs.password] }}
          CLUSTER_NAME:     ${{ env.INFRA_CLUSTER_NAME }}


      - name: CI Cleanup - Cleanup GitHub deployment
        if: always() && (env.CI_DEPLOYMENT_TTL == '' || inputs.distro-type != 'kubernetes')
        continue-on-error: true # We don't want to fail if the deployment is not found.
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: delete-env
          token: ${{ steps.cluster-auth.outputs.token }}
          env: ${{ steps.vars.outputs.identifier }}
          ref: ${{ inputs.caller-git-ref }}

      - name: CI Cleanup - Delete venom Entra app registration
        if: always() && (inputs.auth == 'oidc' || inputs.scenario == 'oidc' || inputs.test-identity == 'oidc')
        continue-on-error: true
        env:
          ENTRA_APP_CLIENT_ID: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_CLIENT_ID }}
          ENTRA_APP_CLIENT_SECRET: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_CLIENT_SECRET }}
          ENTRA_APP_OBJECT_ID: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_OBJECT_ID }}
          ENTRA_APP_DIRECTORY_ID: ${{ steps.test-credentials-secret.outputs.ENTRA_APP_DIRECTORY_ID }}
        run: |
          deploy-camunda entra cleanup-venom-app \
            --namespace "$TEST_NAMESPACE" \
            --log-level info

      - name: CI Cleanup - Delete Auth0 OIDC clients
        # Mirrors the Entra cleanup above. The auth0 scenario provisions
        # per-component first-party clients in the tenant via
        # `auth0 ensure-clients`; namespace deletion does not touch the
        # tenant, so without this step orphans accumulate across PR runs.
        if: always() && inputs.scenario == 'auth0'
        continue-on-error: true
        env:
          AUTH0_DOMAIN: ${{ steps.test-credentials-secret.outputs.AUTH0_DOMAIN }}
          AUTH0_MGMT_CLIENT_ID: ${{ steps.test-credentials-secret.outputs.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ steps.test-credentials-secret.outputs.AUTH0_MGMT_CLIENT_SECRET }}
        run: |
          deploy-camunda auth0 cleanup-clients \
            --namespace "$TEST_NAMESPACE" \
            --domain "$AUTH0_DOMAIN" \
            --log-level info

      - name: CI Cleanup
        if: always() && inputs.always-delete-namespace
        env:
          OPENSEARCH_USERNAME: ${{ steps.test-credentials-secret.outputs.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ steps.test-credentials-secret.outputs.OPENSEARCH_PASSWORD }}
        run: |
          kubectl annotate ns $TEST_NAMESPACE test-flow=${{ inputs.flow }} --overwrite || true
          kubectl annotate ns $TEST_NAMESPACE build-failed=true --overwrite || true

          if [[ "$(kubectl get ns $TEST_NAMESPACE --ignore-not-found)" != "" && "${{ env.CI_DEPLOYMENT_TTL }}" == "" ]]; then
            kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=1s --overwrite=true
            kubectl annotate ns $TEST_NAMESPACE janitor/ttl=1s --overwrite=true
          else
            if [[ "${{ inputs.distro-type }}" == "kubernetes" && "${{ env.CI_DEPLOYMENT_TTL }}" != "" ]]; then
              kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=${CI_DEPLOYMENT_TTL} --overwrite=true || true
              kubectl annotate ns $TEST_NAMESPACE janitor/ttl=${CI_DEPLOYMENT_TTL} --overwrite=true || true
            else
              kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=1s --overwrite=true || true
              kubectl annotate ns $TEST_NAMESPACE janitor/ttl=1s --overwrite=true || true
            fi
          fi

      - name: CI Cleanup - Reap topology namespaces
        if: always() && inputs.always-delete-namespace && inputs.is-topology
        env:
          OPENSEARCH_USERNAME: ${{ steps.test-credentials-secret.outputs.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ steps.test-credentials-secret.outputs.OPENSEARCH_PASSWORD }}
        run: |
          while IFS= read -r suffix; do
            ns="$(deploy-camunda topology namespace --base "$TEST_NAMESPACE" --suffix "$suffix")"

            kubectl annotate ns "$ns" test-flow=${{ inputs.flow }} --overwrite || true
            kubectl annotate ns "$ns" build-failed=true --overwrite || true

            if [[ "$(kubectl get ns "$ns" --ignore-not-found)" != "" && "${{ env.CI_DEPLOYMENT_TTL }}" == "" ]]; then
              kubectl annotate ns "$ns" cleaner/ttl=1s --overwrite=true || true
              kubectl annotate ns "$ns" janitor/ttl=1s --overwrite=true || true
            else
              if [[ "${{ inputs.distro-type }}" == "kubernetes" && "${{ env.CI_DEPLOYMENT_TTL }}" != "" ]]; then
                kubectl annotate ns "$ns" cleaner/ttl="${CI_DEPLOYMENT_TTL}" --overwrite=true || true
                kubectl annotate ns "$ns" janitor/ttl="${CI_DEPLOYMENT_TTL}" --overwrite=true || true
              else
                kubectl annotate ns "$ns" cleaner/ttl=1s --overwrite=true || true
                kubectl annotate ns "$ns" janitor/ttl=1s --overwrite=true || true
              fi
            fi
          done < <(jq -r '.[]' <<< '${{ inputs.topology-namespace-suffixes }}')
