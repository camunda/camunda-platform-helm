# Docs: https://github.com/camunda/camunda-platform-helm/blob/main/docs/gha-workflows.md
name: "Test - Integration - Runner"
on:
  workflow_call:
    inputs:
      helmChartVersion:
        description: Deploy from OCI registry using this version (overrides git-based chart packaging for install flow)
        required: false
        default: ""
        type: string
      values-config:
        type: string
        description: Some of the values files will allow subsitutions. For example, on the image.tags. This config supplies those values
        default: '{}'
        required: false
      auth:
        description: The authentication type to use for the tests.
        required: true
        default: keycloak
        type: string
      exclude:
        description: The test suites to exclude.
        required: false
        default: ""
        type: string
      identifier:
        description: The unique identifier of used in the deployment hostname.
        required: true
        type: string
      binary-artifact-name:
        description: Name of the uploaded deploy-camunda binary artifact to download. Callers that build the binary per-leg must override this with a per-run-unique name to avoid artifact-name collisions across parallel reusable-workflow legs.
        required: false
        default: deploy-camunda-binary
        type: string
      camunda-helm-repo:
        description: The Helm repo which is used during the upgrade flow.
        required: false
        default: camunda/camunda-platform
        type: string
      camunda-helm-dir:
        required: false
        default: camunda-platform-8.8
        type: string
      camunda-helm-git-ref:
        required: false
        default: main
        type: string
      camunda-helm-upgrade-version:
        description: The Helm chart version used in the upgrade-patch flow.
        required: false
        default: ""
        type: string
      camunda-version-previous:
        description: The Camunda version used in the upgrade-minor flow.
        required: false
        default: ""
        type: string
      caller-git-ref:
        required: false
        default: main
        type: string
      deployment-ttl:
        description: Define a TTL for the lifespan of the deployment.
        required: false
        default: "12h"
        type: string
      distro-platform:
        default: gke
        type: string
      distro-type:
        default: kubernetes
        type: string
      infra-type:
        description: Define the infrastructure that will be used to run the deployment.
        default: "preemptible"
        type: string
      flow:
        required: false
        default: install
        type: string
      test-enabled:
        required: false
        default: true
        type: boolean
      e2e-enabled:
        required: false
        default: false
        type: boolean
      wait-ingress-ready:
        description: "Gate deploy success on the ingress host becoming publicly DNS-resolvable + HTTP-reachable. Opt-in; external reusable-workflow consumers default to false."
        required: false
        default: false
        type: boolean
      ingress-ready-timeout:
        description: "Minutes to poll for ingress readiness when wait-ingress-ready is true. Defaults to the tool default (8)."
        required: false
        default: 8
        type: number
      extra-values:
        description: Pass extra values to the Helm chart.
        required: false
        type: string
      vault-secret-mapping:
        description: (optional) defines how to map Vault secrets to distro CI environment variables
        required: false
        type: string
      auth-data:
        required: false
        type: string
      cluster-type:
        required: false
        type: string
      test-case:
        required: false
        default: "pr"
        type: string
      scenario:
        required: false
        default: "elasticsearch"
        type: string
      # =============================================================================
      # Selection + Composition Model Inputs (New - Preferred)
      # These inputs allow explicit configuration of identity, persistence, platform,
      # and features instead of relying on scenario name parsing.
      # =============================================================================
      test-identity:
        description: "Identity selection: keycloak, oidc, basic, hybrid"
        required: false
        type: string
      test-persistence:
        description: "Persistence selection: elasticsearch, opensearch, rdbms, rdbms-oracle"
        required: false
        type: string
      test-platform:
        description: "Platform selection: gke, eks, openshift"
        required: false
        type: string
      test-features:
        description: "Features (comma-separated): multitenancy, rba, documentstore"
        required: false
        type: string
      test-qa:
        description: "Enable QA configuration"
        required: false
        default: false
        type: boolean
      test-upgrade:
        description: "Enable upgrade flow configuration"
        required: false
        default: false
        type: boolean
      skip-e2e:
        description: "Skip E2E (Playwright smoke) tests for this scenario (declared in ci-test-config.yaml)"
        required: false
        default: false
        type: boolean
      e2e-matrix:
        description: "JSON matrix of e2e legs (suite + blocking) resolved from the CI scenario registry"
        required: false
        default: "[]"
        type: string
      is-topology:
        description: "Whether this scenario declares a multi-release topology"
        required: false
        default: false
        type: boolean
      topology-namespace-suffixes:
        description: "JSON array of topology release namespace suffixes"
        required: false
        default: "[]"
        type: string
      topology-hub-suffix:
        description: "Namespace suffix of the topology Hub release"
        required: false
        default: ""
        type: string
      topology-smoke-matrix:
        description: "JSON matrix derived from topology orchestration releases"
        required: false
        default: "[]"
        type: string
      pr-head-sha:
        description: "PR HEAD commit SHA for recording cache results"
        required: false
        default: ""
        type: string
      camunda-version:
        description: "Camunda version (e.g., 8.9) for cache result recording"
        required: false
        default: ""
        type: string
      camunda-helm-post-render:
        description: Set to true if you would like to run the post-renderer script for OpenShift
        required: false
        default: true
        type: boolean
      camunda-helm-credentials-source:
        description: |
          Auto-generate credentials or copy them from external secret.
          Valid options: auto-generated or external-secret-only.
          New optional auto-generated secrets are only supported in Camunda 8.4 chart and above.
        required: false
        default: auto-generated
        type: string
      cluster-name:
        required: false
        type: string
      cluster-location:
        required: false
        type: string
      workload-identity-provider:
        required: false
        type: string
      service-account:
        required: false
        type: string
      server-url:
        required: false
        type: string
      username:
        required: false
        type: string
      password:
        required: false
        type: string
      e2e-test-pattern:
        required: false
        default: "**/smoke-tests.spec.{ts,js}"
        type: string
      run-all-e2e-tests:
        description: "Run all E2E tests (playwright)"
        required: false
        default: false
        type: boolean
      teleport-token:
        description: The Teleport token to use for authentication.
        required: false
        default: infra-ci-prod-github-action-distribution
        type: string
      shortname:
        description: The shortname of the scenario.
        required: true
        default: "eske"
        type: string
      namespace-prefix:
        description: The prefix for the namespace. This is necessary because we only have permissions to create namespaces with a specific prefix.
        required: false
        default: ""
        type: string
      values-enterprise:
        required: false
        default: "false"
        type: string
        description: Enable enterprise values
      values-digest:
        required: false
        default: "true"
        type: string
        description: Enable digest values
      always-delete-namespace:
        description: Always delete the namespace after the test run
        default: false
        type: boolean
        required: false
      initialClaimValue:
        description: This is only used for testing Entra. This is here so we can do exploratory testing with Entra.
        required: false
        default: ""
        type: string
      include-image-tags:
        description: Include the image tags file for substitution from values-config
        required: false
        default: false
        type: boolean
      force-image-overrides:
        description: '⚠️ DANGER: Bypass OCI artifact immutability guard and allow image version overrides even when helmChartVersion is set. Only use if you know what you are doing.'
        required: false
        default: false
        type: boolean
      helm-version:
        description: "Helm version to install. Empty means use the pre-baked Helm from the CI runner image."
        required: false
        default: ""
        type: string
    outputs:
      deployment-url:
        description: The URL of the deployed application.
        value: ${{ jobs.integration.outputs.vars-ingress-host }}
      namespace:
        description: The namespace where the deployment is running.
        value: ${{ jobs.integration.outputs.vars-namespace }}

permissions:
  contents: read
  id-token: write
  deployments: write
  packages: read
  statuses: write

# No concurrency block here — this is the innermost layer containing the cleanup steps.
# cancel-in-progress at this level kills the job including cleanup, causing orphaned
# cloud resources. Cancellation is handled by outer caller workflows. See #5307.

env:
  # Vars with "CI_" prefix are used in the CI workflow only.
  # Vars with "TEST_" prefix are used in the test runner tool (Task).
  CI_DEPLOYMENT_TTL: ${{ inputs.deployment-ttl }}
  IS_TOPOLOGY: ${{ inputs.is-topology }}
  # Floor for the deploy-time cleaner/janitor TTL of a topology scenario, which holds
  # one namespace set across sequentially-run e2e legs. Must exceed install plus every
  # leg; at ~10m install and ~25m per leg, 4h covers the four-leg mns2 chain with room
  # for queueing. Applied only when no explicit deployment-ttl was requested.
  TOPOLOGY_MIN_TTL: 4h
  # The Helm repo which is used during the upgrade flow.
  TEST_CHART_REPO: ${{ inputs.camunda-helm-repo }}
  # Docker Hub auth to avoid image pull rate limit.
  TEST_CREATE_DOCKER_LOGIN_SECRET: "TRUE"
  # OIDC.
  INITIAL_CLAIM_VALUE: ${{ inputs.initialClaimValue }}
  # Mapping rule client IDs - defaults for Keycloak; overridden by entra.ensure-venom-app for OIDC.
  VENOM_CLIENT_ID: venom
  CONNECTORS_CLIENT_ID: connectors
  # Misc.
  # NOTE: Infrastructure values (CLUSTER_NAME, AWS_PROFILE, POSTGRESQL_JDBC_URL) are loaded
  # from .github/config/infra.yaml by the workflow-vars action (invoked via
  # integration-test-setup) and exported to $GITHUB_ENV per-job.
  TELEPORT_TOKEN: ${{ inputs.teleport-token }}
  FLOW: ${{ inputs.flow }}

jobs:
  # Deploy, test and clean up one scenario in a single job. "Re-run failed jobs"
  # only reruns failed jobs, so a failing test must fail the job that deployed
  # the namespace for the rerun to start from a fresh deployment.
  integration:
    if: github.event.action != 'closed'
    name: deploy and test ${{ inputs.flow }} on ${{ inputs.distro-platform }} - ${{ inputs.shortname }}
    runs-on: >-
      ${{
        (inputs.test-enabled && ((inputs.e2e-enabled && !inputs.skip-e2e) || inputs.scenario == 'shadow-e2e'))
        && (
          (inputs.scenario == 'shadow-e2e' || (inputs.flow == 'install' && !inputs.is-topology && contains(inputs.e2e-matrix, '"suite":"full"')))
          && 'gcp-core-32-longrunning-big-ssd'
          || 'gcp-core-8-release'
        )
        || 'ubuntu-latest'
      }}
    # Sum of the deploy step cap (40m), the per-leg timeouts enforced by
    # `ci e2e-run` (smoke 25m, full 50m, topology 40m per leg, up to 8 legs)
    # and setup/cleanup, so a leg timeout fires before the job is killed and
    # the cleanup steps still run.
    timeout-minutes: ${{ inputs.is-topology && 400 || ((inputs.scenario == 'shadow-e2e' || contains(inputs.e2e-matrix, '"suite":"full"')) && 150 || 90) }}
    container:
      image: ghcr.io/camunda/team-distribution/playwright-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host --user root
    defaults:
      run:
        shell: bash
    outputs:
      vars-identifier: ${{ steps.setup.outputs.identifier }}
      vars-ingress-host: ${{ steps.setup.outputs.ingress-host }}
      vars-namespace: ${{ steps.setup.outputs.namespace }}
      cleanup-done: ${{ steps.cleanup-done.outputs.done }}
    permissions:
      contents: read
      id-token: write
      deployments: write
      packages: read
    env:
      TEST_CLUSTER_TYPE: ${{ inputs.distro-type || inputs.cluster-type }}

    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@1bab7578250d06c3ac57ba8e2ddfc65ac3f7880c # main
      - name: Info - ℹ️ Print workflow inputs ℹ️
        env:
          GITHUB_CONTEXT: ${{ toJson(inputs) }}
        run: |
          if [[ -n "${INITIAL_CLAIM_VALUE}" ]]; then
            echo "::add-mask::${INITIAL_CLAIM_VALUE}"
          fi
          # Collapse the multi-KB input dump into a log group so it does not bury
          # the meaningful lines; expand it in the UI when needed.
          echo "::group::Workflow Inputs"
          echo "${GITHUB_CONTEXT}" | jq '."extra-values" = "<Check below>"'
          echo "Workflow Inputs - Extra Values:"
          echo "${GITHUB_CONTEXT}" | jq -r '."extra-values"'
          echo "::endgroup::"

      - name: CI Setup - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This is needed to load repo GH composite actions if the workflow triggered by workflow_call.
          repository: camunda/camunda-platform-helm
          ref: ${{ inputs.camunda-helm-git-ref }}

      - name: CI Setup - Configure Git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Download deploy-camunda binary
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.binary-artifact-name }}
          path: ${{ runner.temp }}/bin
      - name: Add deploy-camunda to PATH
        run: |
          chmod +x "${RUNNER_TEMP}/bin/deploy-camunda"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # The binary is built from camunda-helm-git-ref, which can predate `ci e2e-run`.
      - name: CI Setup - Check e2e runner support
        if: inputs.test-enabled && ((inputs.e2e-enabled && !inputs.skip-e2e) || inputs.scenario == 'shadow-e2e')
        env:
          HELM_GIT_REF: ${{ inputs.camunda-helm-git-ref }}
        run: |
          if ! deploy-camunda ci e2e-run --help > /dev/null 2>&1; then
            echo "::error title=Incompatible camunda-helm-git-ref::camunda-helm-git-ref '${HELM_GIT_REF}' builds a deploy-camunda without 'ci e2e-run', which this runner needs to run e2e. Rebase the ref onto camunda-platform-helm main, or set e2e-enabled: false."
            exit 1
          fi

      - name: Configure curl and wget
        uses: ./.github/actions/setup-curl

      # Tools (golang, helm, kubectl, yq, jq, node, playwright) are pre-installed in the Playwright runner image.
      # See: .github/docker/playwright-runner/Dockerfile
      # The per-scenario helm-version input below can override the pre-baked helm when set in ci-test-config.yaml.
      # When no override is provided, fall back to the helm version pinned in .tool-versions.

      - name: CI Setup - Install OpenShift CLI
        if: inputs.distro-platform == 'rosa'
        run: |
          if command -v oc > /dev/null 2>&1; then
            oc version --client
            exit 0
          fi
          curl -fsSL --retry 5 --retry-all-errors "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.17.11/openshift-client-linux.tar.gz" \
            | tar -xzf - -C /usr/local/bin oc
          oc version --client

      - name: CI Setup - Resolve Helm version
        id: helm-resolve
        run: |
          version="${{ inputs.helm-version }}"
          if [[ -z "$version" ]]; then
            version="$(awk '$1=="helm"{print $2}' .tool-versions)"
          fi
          prebaked="$(helm version --short --template '{{.Version}}' 2>/dev/null | sed 's/^v//' | cut -d'+' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "$prebaked" ]]; then
            echo "needs-install=false" >> "$GITHUB_OUTPUT"
            echo "Pre-baked helm $prebaked matches requested $version — skipping override"
          else
            echo "needs-install=true" >> "$GITHUB_OUTPUT"
            echo "Pre-baked helm $prebaked != requested $version — installing override"
          fi

      - name: CI Setup - Override Helm version
        if: steps.helm-resolve.outputs.needs-install == 'true'
        env:
          HELM_VERSION: ${{ steps.helm-resolve.outputs.version }}
        run: |
          tarball="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 180 --connect-timeout 15 "https://get.helm.sh/${tarball}" -o "/tmp/${tarball}"
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 180 --connect-timeout 15 "https://get.helm.sh/${tarball}.sha256sum" -o "/tmp/${tarball}.sha256sum"
          (cd /tmp && sha256sum --check "${tarball}.sha256sum")
          tar -xzf "/tmp/${tarball}" -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          rm -rf "/tmp/${tarball}" "/tmp/${tarball}.sha256sum" /tmp/linux-amd64
          helm version --short

      - name: CI Setup - Shared integration test setup
        id: setup
        uses: ./.github/actions/integration-test-setup
        with:
          vault-secret-mapping:        ${{ inputs.vault-secret-mapping }}
          distro-platform:             ${{ inputs.distro-platform }}
          auth-data:                   ${{ inputs.auth-data }}
          deployment-ttl:              ${{ env.CI_DEPLOYMENT_TTL }}
          flow:                        ${{ inputs.flow }}
          identifier:                  ${{ inputs.identifier }}
          camunda-helm-dir:            ${{ inputs.camunda-helm-dir }}
          camunda-helm-upgrade-version: ${{ inputs.camunda-helm-upgrade-version }}
          namespace-prefix:            ${{ inputs.namespace-prefix }}
          infra-type:                  ${{ inputs.infra-type }}
          values-enterprise:           ${{ inputs.values-enterprise }}
          values-digest:               ${{ inputs.values-digest }}
          camunda-version-previous:    ${{ inputs.camunda-version-previous }}
          # deploy-camunda matrix run installs the previous version itself, so
          # the job always resolves the current (target) chart.
          upgrade-step:                "true"
        env:
          VAULT_ADDR:       ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID:    ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID:  ${{ secrets.VAULT_SECRET_ID }}
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          ROSA_URL:         ${{ secrets[inputs.server-url] }}
          ROSA_USER:        ${{ secrets[inputs.username] }}
          ROSA_PASS:        ${{ secrets[inputs.password] }}
          DISTRO_CI_DOCKER_USERNAME_DOCKERHUB: ${{ secrets.DISTRO_CI_DOCKER_USERNAME_DOCKERHUB }}
          DISTRO_CI_DOCKER_PASSWORD_DOCKERHUB: ${{ secrets.DISTRO_CI_DOCKER_PASSWORD_DOCKERHUB }}

      - name: CI Setup - Start GitHub deployment
        if: inputs.flow != 'modular-upgrade-minor'
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        id: deployment
        continue-on-error: true # Deployment status is cosmetic; don't fail the job if the API 404s (e.g. merge queue refs).
        with:
          step: start
          token: ${{ steps.setup.outputs.cluster-auth-token }}
          env: ${{ steps.setup.outputs.identifier }}
          ref: ${{ inputs.caller-git-ref }}

      # modular-upgrade-minor upgrades a release deployed by an earlier install
      # flow, so it must not recreate or reseed the namespace.
      - name: Cluster Setup - Configure the namespace
        if: inputs.flow != 'modular-upgrade-minor'
        run: |
          echo $TEST_NAMESPACE
          # Check if namespace exists and if we own it (created by same run)
          if kubectl get ns $TEST_NAMESPACE &>/dev/null; then
            EXISTING_RUN_ID=$(kubectl get ns $TEST_NAMESPACE -o jsonpath='{.metadata.labels.github-run-id}' 2>/dev/null || echo "")
            if [[ "$EXISTING_RUN_ID" == "$GITHUB_WORKFLOW_RUN_ID" ]]; then
              echo "Namespace exists and was created by this run, deleting and recreating..."
              kubectl delete ns $TEST_NAMESPACE
            else
              echo "Namespace exists but was created by a different run (run-id: $EXISTING_RUN_ID), cleaning up stale release..."
              # Remove any stale Helm release left behind by a cancelled/completed previous run.
              # Without this, 'helm install' fails with "cannot re-use a name that is still in use".
              helm uninstall integration --namespace $TEST_NAMESPACE --wait --timeout 2m0s 2>/dev/null || true
              # Companions are separate releases, so the uninstall above does not touch them.
              # Kubernetes never garbage-collects PVCs created from volumeClaimTemplates, so the
              # delete is what stops a new pod binding the previous run's database.
              helm uninstall postgresql --namespace $TEST_NAMESPACE --wait --timeout 2m0s 2>/dev/null || true
              helm uninstall keycloak --namespace $TEST_NAMESPACE --wait --timeout 2m0s 2>/dev/null || true
              kubectl delete pvc -l app.kubernetes.io/component=postgresql \
                --namespace $TEST_NAMESPACE --ignore-not-found 2>/dev/null || true
            fi
          fi
          kubectl create ns $TEST_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl label ns $TEST_NAMESPACE github-id=${{ steps.setup.outputs.identifier }} --overwrite
          kubectl label ns $TEST_NAMESPACE test-flow=${{ inputs.flow }} --overwrite
          kubectl label ns $TEST_NAMESPACE github-run-id=$GITHUB_WORKFLOW_RUN_ID --overwrite
          kubectl label ns $TEST_NAMESPACE github-job-id=$GITHUB_WORKFLOW_JOB_ID --overwrite
          kubectl label ns $TEST_NAMESPACE github-org=$(dirname $GITHUB_REPOSITORY) --overwrite
          kubectl label ns $TEST_NAMESPACE github-repo=$(basename $GITHUB_REPOSITORY) --overwrite
          kubectl annotate ns $TEST_NAMESPACE cleaner/ttl=${{ inputs.deployment-ttl || '1h' }} --overwrite
          kubectl annotate ns $TEST_NAMESPACE janitor/ttl=${{ inputs.deployment-ttl || '1h' }} --overwrite
          kubectl annotate ns $TEST_NAMESPACE camunda.cloud/ephemeral=true --overwrite
          kubectl annotate ns $TEST_NAMESPACE github-workflow-run-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID --overwrite
          kubectl get ns $TEST_NAMESPACE -o yaml

      - name: Apply Vault mapped Secret
        if: inputs.vault-secret-mapping != ''
        run: |
          kubectl -n "$TEST_NAMESPACE" apply -f /tmp/vault-mapped-secrets.yaml

      - name: Cluster Setup - Install docker registry on cluster
        if: inputs.flow != 'modular-upgrade-minor'
        run: |
          kubectl create secret docker-registry registry-camunda-cloud \
          --namespace $TEST_NAMESPACE \
          --docker-server "registry.camunda.cloud" \
          --docker-username $TEST_DOCKER_USERNAME_CAMUNDA_CLOUD \
          --docker-password $TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD \
          --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-io \
          --namespace $TEST_NAMESPACE \
          --docker-server "ghcr.io" \
          --docker-username $GITHUB_ACTOR \
          --docker-password $GITHUB_TOKEN \
          --dry-run=client -o yaml | kubectl apply -f -

          # Docker Hub pull secret (replaces the legacy `task init.seed` lib taskfile target).
          # TEST_DOCKER_USERNAME/PASSWORD are exported by integration-test-setup from Vault.
          if [[ "${TEST_CREATE_DOCKER_LOGIN_SECRET:-FALSE}" == "TRUE" && -n "${TEST_DOCKER_USERNAME:-}" && -n "${TEST_DOCKER_PASSWORD:-}" ]]; then
            kubectl create secret docker-registry index-docker-io \
            --namespace $TEST_NAMESPACE \
            --docker-server "https://index.docker.io/v1/" \
            --docker-username "$TEST_DOCKER_USERNAME" \
            --docker-password "$TEST_DOCKER_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          fi
        env:
          TEST_DOCKER_USERNAME_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_USERNAME_CAMUNDA_CLOUD || steps.setup.outputs.NEXUS_USERNAME }}
          TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD || steps.setup.outputs.NEXUS_PASSWORD }}
          TEST_DOCKER_USERNAME: ${{ steps.setup.outputs.TEST_DOCKER_USERNAME }}
          TEST_DOCKER_PASSWORD: ${{ steps.setup.outputs.TEST_DOCKER_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##########################################################################################################
      # Deploy
      ##########################################################################################################

      - name: Cluster Setup - Configure TLS Certificates/Secrets
        uses: ./.github/actions/cluster-setup-secrets
        with:
          distro-platform: ${{ inputs.distro-platform }}
          chart-path: ${{ env.CHART_PATH }}
          namespace: ${{ env.TEST_NAMESPACE }}

      - name: Helm - Configure Helm with Entra Values
        if: (inputs.auth == 'oidc' || inputs.scenario == 'oidc' || inputs.test-identity == 'oidc') && inputs.values-config == '{}'
        timeout-minutes: 5
        env:
          TEST_CHART_FLOW: ${{ inputs.flow }}
          TEST_INGRESS_HOST: ${{ steps.setup.outputs.ingress-host }}
          TEST_VALUES_SCENARIO: "${{ inputs.scenario }}"
          TEST_AUTH_TYPE: ${{ inputs.auth }}
          INFRA_TYPE: ${{ inputs.infra-type }}
          EXTRA_VALUES: ${{ inputs.extra-values }}
          # Selection + composition model environment variables (new - preferred)
          TEST_IDENTITY: ${{ inputs.test-identity }}
          TEST_PERSISTENCE: ${{ inputs.test-persistence }}
          TEST_PLATFORM: ${{ inputs.test-platform || inputs.distro-platform }}
          TEST_FEATURES: ${{ inputs.test-features }}
          TEST_HELM_EXTRA_ARGS: >-
            ${{ env.TEST_HELM_EXTRA_ARGS }}
            ${{ steps.setup.outputs.legacy-ingress-arg }}
            --set global.host=${{ steps.setup.outputs.ingress-host }}
          ENTRA_APP_CLIENT_ID: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_ID }}
          ENTRA_APP_CLIENT_SECRET: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_SECRET }}
          ENTRA_APP_OBJECT_ID: ${{ steps.setup.outputs.ENTRA_APP_OBJECT_ID }}
          ENTRA_APP_DIRECTORY_ID: ${{ steps.setup.outputs.ENTRA_APP_DIRECTORY_ID }}
        run: |
          echo "$EXTRA_VALUES" > /tmp/extra-values-file.yaml
          deploy-camunda entra update-redirect-uris \
            --ingress-host "$TEST_INGRESS_HOST" \
            --log-level info
          deploy-camunda entra ensure-venom-app \
            --namespace "$TEST_NAMESPACE" \
            --log-level info | tee /tmp/entra-output.txt
          # Capture VENOM_CLIENT_ID and CONNECTORS_CLIENT_ID from Go CLI stdout.
          grep '^VENOM_CLIENT_ID=' /tmp/entra-output.txt >> "$GITHUB_ENV"
          grep '^CONNECTORS_CLIENT_ID=' /tmp/entra-output.txt >> "$GITHUB_ENV"

      - name: Helm - Pre-deploy scenario tweaks
        timeout-minutes: 5
        env:
          EXTRA_VALUES: ${{ inputs.extra-values }}
        run: |
          # Persist user-supplied extra values for `deploy-camunda matrix run` to consume
          # via --extra-values (flags.Deployment.ExtraValues → digest-overlay strip).
          # Written without echoing to stdout to avoid leaking sensitive values into logs.
          echo "$EXTRA_VALUES" > /tmp/extra-values-file.yaml

      - name: Helm - OCI Registry Login
        if: inputs.helmChartVersion != ''
        env:
          TEST_DOCKER_USERNAME_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_USERNAME_CAMUNDA_CLOUD }}
          TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD }}
        run: |
          export HARBOR_REGISTRY_HOST=registry.camunda.cloud
          export HARBOR_REGISTRY_USER="${TEST_DOCKER_USERNAME_CAMUNDA_CLOUD}"
          export HARBOR_REGISTRY_PASSWORD="${TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD}"
          export HARBOR_RETRY_DELAY=15

          source "${GITHUB_WORKSPACE}/scripts/harbor-retry.sh"
          harbor_login
          # Upgrade flows keep the previous-version TEST_CHART_VERSION for Step 1.
          if [[ "${{ inputs.flow }}" == "install" ]]; then
            echo "TEST_CHART_VERSION=${{ inputs.helmChartVersion }}" >> "$GITHUB_ENV"
          fi

      - name: Helm - 🌟 Deploy Camunda chart 🌟
        id: deploy
        timeout-minutes: 40
        # install deploys the current chart. upgrade-patch / upgrade-minor run the
        # two-step orchestration (install previous version + upgrade to current),
        # and modular-upgrade-minor upgrades the existing release.
        env:
          TEST_CHART_FLOW: ${{ inputs.flow }}
          # CAMUNDA_HOSTNAME is required by layered values (e.g. base.yaml contains $CAMUNDA_HOSTNAME)
          CAMUNDA_HOSTNAME: ${{ steps.setup.outputs.ingress-host }}
          # License key for Camunda Platform. Persisted to a file and injected via
          # --set-file (avoids shell word-splitting on spaces/semicolons).
          E2E_TESTS_LICENSE_KEY: ${{ secrets.E2E_TESTS_LICENSE_KEY || env.E2E_TESTS_LICENSE_KEY }}
          CAMUNDA_HELM_DIR: ${{ inputs.camunda-helm-dir }}
          INFRA_TYPE: ${{ inputs.infra-type }}
          WAIT_INGRESS_READY: ${{ inputs.wait-ingress-ready }}
          INGRESS_READY_TIMEOUT: ${{ inputs.ingress-ready-timeout }}
          # Selection + composition model environment variables (consumed by
          # deploy-camunda's prepare-values via the matrix run scenario resolver
          # — no flag wiring required, the runner reads $TEST_* env vars).
          TEST_IDENTITY: ${{ inputs.test-identity }}
          TEST_PERSISTENCE: ${{ inputs.test-persistence }}
          TEST_PLATFORM: ${{ inputs.test-platform || inputs.distro-platform }}
          TEST_FEATURES: ${{ inputs.test-features }}
          TEST_QA: ${{ inputs.test-qa }}
          TEST_UPGRADE: ${{ inputs.test-upgrade }}
          TEST_IMAGE_TAGS: ${{ inputs.include-image-tags }}
          FORCE_IMAGE_OVERRIDES: ${{ inputs.force-image-overrides }}
          TEST_VALUES_SCENARIO: "${{ inputs.scenario }}"
          VALUES_CONFIG: ${{ inputs.values-config }}
          HELM_CHART_VERSION: ${{ inputs.helmChartVersion }}
          TEST_DOCKER_USERNAME_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_USERNAME_CAMUNDA_CLOUD }}
          TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD: ${{ steps.setup.outputs.TEST_DOCKER_PASSWORD_CAMUNDA_CLOUD }}
          NEXUS_USERNAME: ${{ steps.setup.outputs.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ steps.setup.outputs.NEXUS_PASSWORD }}
          TEST_DOCKER_USERNAME: ${{ steps.setup.outputs.TEST_DOCKER_USERNAME }}
          TEST_DOCKER_PASSWORD: ${{ steps.setup.outputs.TEST_DOCKER_PASSWORD }}
          ENTRA_APP_CLIENT_ID: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_ID }}
          ENTRA_APP_CLIENT_SECRET: ${{ steps.setup.outputs.ENTRA_APP_CLIENT_SECRET }}
          ENTRA_APP_OBJECT_ID: ${{ steps.setup.outputs.ENTRA_APP_OBJECT_ID }}
          ENTRA_APP_DIRECTORY_ID: ${{ steps.setup.outputs.ENTRA_APP_DIRECTORY_ID }}
          AUTH0_DOMAIN: ${{ steps.setup.outputs.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ steps.setup.outputs.AUTH0_AUDIENCE }}
          AUTH0_MGMT_CLIENT_ID: ${{ steps.setup.outputs.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ steps.setup.outputs.AUTH0_MGMT_CLIENT_SECRET }}
          AUTH0_INITIAL_ADMIN_EMAIL: ${{ steps.setup.outputs.AUTH0_INITIAL_ADMIN_EMAIL }}
          RDBMS_POSTGRESQL_USERNAME: ${{ steps.setup.outputs.RDBMS_POSTGRESQL_USERNAME }}
          RDBMS_POSTGRESQL_PASSWORD: ${{ steps.setup.outputs.RDBMS_POSTGRESQL_PASSWORD }}
        run: |
          set -euo pipefail
          CHART_VERSION="${CAMUNDA_HELM_DIR#camunda-platform-}"

          # License key: pre-8.9 charts use global.license.key, >=8.9 use
          # global.license.secret.inlineSecret. Detect by grepping the chart's
          # values.yaml @param annotations.
          EXTRA_HELM_ARGS=()
          if [[ -n "${E2E_TESTS_LICENSE_KEY:-}" ]]; then
            LICENSE_FILE=/tmp/license-key.txt
            printf '%s' "${E2E_TESTS_LICENSE_KEY}" > "$LICENSE_FILE"
            if grep -q '@param global.license.key' "${{ env.CHART_PATH }}/values.yaml" 2>/dev/null; then
              EXTRA_HELM_ARGS+=(--extra-helm-arg=--set-file=global.license.key="$LICENSE_FILE")
            else
              EXTRA_HELM_ARGS+=(--extra-helm-arg=--set-file=global.license.secret.inlineSecret="$LICENSE_FILE")
            fi
          fi

          # Pass the legacy ingress arg + global.host as helm extra args.
          LEGACY_INGRESS_ARG="${{ steps.setup.outputs.legacy-ingress-arg }}"
          if [[ -n "$LEGACY_INGRESS_ARG" ]]; then
            # legacy-ingress-arg is space-delimited (e.g. "--set foo=bar"); split it.
            # shellcheck disable=SC2206
            LEGACY_TOKENS=($LEGACY_INGRESS_ARG)
            for tok in "${LEGACY_TOKENS[@]}"; do
              EXTRA_HELM_ARGS+=(--extra-helm-arg="$tok")
            done
          fi

          # OCI chart override: when helmChartVersion is set, deploy from the published
          # OCI artifact instead of the local git chart directory. For upgrade flows
          # Step 1 (installing the previous version) still uses the Helm repo — only
          # Step 2 uses the OCI ref.
          CHART_REF_ARGS=()
          if [[ -n "${HELM_CHART_VERSION:-}" ]]; then
            CHART_REF_ARGS+=(--chart-ref "oci://registry.camunda.cloud/team-distribution/camunda-platform")
            CHART_REF_ARGS+=(--chart-version "${HELM_CHART_VERSION}")
          fi

          FORCE_IMAGE_OVERRIDE_ARGS=()
          if [[ "${FORCE_IMAGE_OVERRIDES}" == "true" ]]; then
            echo "::warning::Bypassing OCI artifact immutability guard; image version overrides may be applied to helmChartVersion=${HELM_CHART_VERSION:-<none>}"
            FORCE_IMAGE_OVERRIDE_ARGS=(--force-image-overrides)
          fi

          # Convert VALUES_CONFIG JSON to .env file. In OCI immutability mode,
          # strip image tag keys so the released chart artifact remains the
          # source of truth while non-image test config (index prefixes, etc.) stays available.
          ENV_FILE_ARGS=()
          if [[ -n "${VALUES_CONFIG:-}" && "${VALUES_CONFIG}" != "{}" ]]; then
            if [[ -n "${HELM_CHART_VERSION:-}" && "${FORCE_IMAGE_OVERRIDES}" != "true" ]]; then
              echo "::notice::OCI artifact immutability mode: stripping *_IMAGE_TAG values from values-config"
              echo "${VALUES_CONFIG}" | jq -r 'to_entries[] | select((.key | endswith("_IMAGE_TAG")) | not) | "\(.key)=\(.value)"' > /tmp/values-config.env
            else
              echo "${VALUES_CONFIG}" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /tmp/values-config.env
            fi
            if [[ -s /tmp/values-config.env ]]; then
              ENV_FILE_ARGS=(--env-file /tmp/values-config.env)
            fi
          fi

          # Forward workflow extra-values via --extra-values (NOT
          # --extra-helm-arg=--values=…): only this path lands in
          # flags.Deployment.ExtraValues, which engages the digest-overlay strip.
          # For upgrade flows runner_upgrade.go nils Step 1's copy so the
          # override applies to Step 2 (the upgraded chart) only.
          EXTRA_VALUES_ARGS=()
          if [[ -s /tmp/extra-values-file.yaml ]] && grep -q '[^[:space:]]' /tmp/extra-values-file.yaml; then
            EXTRA_VALUES_ARGS=(--extra-values /tmp/extra-values-file.yaml)
          fi

          # Give deploy-camunda the requested namespace TTL; without this it stamps its 60m
          # default onto cleaner/janitor, so 12h nightly clusters get reaped after an hour.
          # A topology scenario runs its e2e legs sequentially, one namespace set for the
          # whole chain, so 60m expires mid-run; TOPOLOGY_MIN_TTL covers the chain. Only
          # the deploy-time annotation is raised — CI_DEPLOYMENT_TTL stays as it was, so
          # the cleanup steps still stamp ttl=1s and the namespaces are reaped at the end
          # of the run rather than lingering for the full TTL.
          export DEPLOY_CAMUNDA_TTL="${CI_DEPLOYMENT_TTL:-}"
          if [[ -z "$DEPLOY_CAMUNDA_TTL" && "$IS_TOPOLOGY" == "true" ]]; then
            export DEPLOY_CAMUNDA_TTL="$TOPOLOGY_MIN_TTL"
          fi

          # The workflow input is `number` type, so reject empty/fractional/negative
          # (any non-digit matches *[!0-9]*) and then zero before it reaches the
          # integer --ingress-ready-timeout flag; a valid whole minute passes through.
          INGRESS_READY_ARGS=()
          if [ "$WAIT_INGRESS_READY" = "true" ]; then
            case "$INGRESS_READY_TIMEOUT" in
              ''|*[!0-9]*)
                echo "::error::ingress-ready-timeout must be a positive whole number of minutes, got '$INGRESS_READY_TIMEOUT'" >&2
                exit 1
                ;;
            esac
            if [ "$INGRESS_READY_TIMEOUT" -lt 1 ]; then
              echo "::error::ingress-ready-timeout must be >= 1 minute, got '$INGRESS_READY_TIMEOUT'" >&2
              exit 1
            fi
            INGRESS_READY_ARGS+=(--wait-ingress-ready --ingress-ready-timeout "$INGRESS_READY_TIMEOUT")
          fi

          deploy-camunda matrix run \
            --repo-root "${GITHUB_WORKSPACE}" \
            --include-disabled \
            --scenario-filter "${{ inputs.scenario }}" \
            --shortname-filter "${{ inputs.shortname }}" \
            --shortname-exact \
            --flow-filter "${{ inputs.flow }}" \
            --versions "${CHART_VERSION}" \
            --platform "${{ inputs.distro-platform }}" \
            --namespace-override "${TEST_NAMESPACE}" \
            --skip-dependency-update=false \
            --timeout 20 \
            --extra-helm-set "global.host=${{ steps.setup.outputs.ingress-host }}" \
            ${INGRESS_READY_ARGS[@]+"${INGRESS_READY_ARGS[@]}"} \
            ${FORCE_IMAGE_OVERRIDE_ARGS[@]+"${FORCE_IMAGE_OVERRIDE_ARGS[@]}"} \
            ${ENV_FILE_ARGS[@]+"${ENV_FILE_ARGS[@]}"} \
            ${CHART_REF_ARGS[@]+"${CHART_REF_ARGS[@]}"} \
            ${EXTRA_HELM_ARGS[@]+"${EXTRA_HELM_ARGS[@]}"} \
            ${EXTRA_VALUES_ARGS[@]+"${EXTRA_VALUES_ARGS[@]}"} \
            --log-level info

      - name: Display Docker Image Git Commits
        id: display-image-commits
        if: always()
        continue-on-error: true
        run: |
          OUTPUT=$($GITHUB_WORKSPACE/scripts/list-chart-image-commits.sh)
          echo "$OUTPUT"
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY

      - name: CI Setup - Update GitHub deployment status
        if: inputs.flow == 'install'
        continue-on-error: true # Deployment status is cosmetic; don't fail the job if the API 404s (e.g. merge queue refs).
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: finish
          token: ${{ steps.setup.outputs.cluster-auth-token }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://${{ steps.setup.outputs.ingress-host }}
          env: ${{ steps.setup.outputs.identifier }}
          ref: ${{ inputs.caller-git-ref }}

      ##########################################################################################################
      # Test
      ##########################################################################################################

      # Each leg runs in its own step after refreshing cluster credentials: the
      # GKE kubeconfig token and the EKS tbot certificate expire after an hour,
      # and deploy plus several legs outlast that.
      - name: E2E - Plan Playwright legs
        id: e2e-plan
        if: inputs.test-enabled && ((inputs.e2e-enabled && !inputs.skip-e2e) || inputs.scenario == 'shadow-e2e')
        env:
          CAMUNDA_HELM_DIR: ${{ inputs.camunda-helm-dir }}
          E2E_STAGE: ${{ inputs.flow == 'install' && 'after-install' || 'after-upgrade' }}
          # install runs the registry's legs; upgrade flows run one blocking smoke leg.
          # A topology scenario runs its per-release legs instead.
          E2E_SUITE_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && !(inputs.flow == 'install' && inputs.is-topology))
              && (inputs.flow == 'install' && inputs.e2e-matrix || '[{"suite":"smoke","blocking":true,"shard_index":1,"shard_total":1}]')
              || '[]'
            }}
          E2E_TOPOLOGY_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && inputs.flow == 'install' && inputs.is-topology)
              && inputs.topology-smoke-matrix
              || '[]'
            }}
          E2E_TOPOLOGY_HUB_SUFFIX: ${{ inputs.topology-hub-suffix }}
          E2E_SHADOW: ${{ inputs.scenario == 'shadow-e2e' && inputs.flow == 'install' }}
          E2E_SCENARIO: ${{ inputs.scenario }}
          E2E_AUTH: ${{ inputs.auth }}
          E2E_EXCLUDE: ${{ inputs.exclude }}
          E2E_SCRUB_VAULT_MAPPING: ${{ inputs.vault-secret-mapping }}
        run: |
          deploy-camunda ci e2e-run \
            --repo-root "${GITHUB_WORKSPACE}" \
            --chart-dir "${CAMUNDA_HELM_DIR}" \
            --namespace "${TEST_NAMESPACE}" \
            --stage "${E2E_STAGE}" \
            --legs "${E2E_SUITE_LEGS}" \
            --topology-legs "${E2E_TOPOLOGY_LEGS}" \
            --topology-hub-suffix "${E2E_TOPOLOGY_HUB_SUFFIX}" \
            --shadow="${E2E_SHADOW}" \
            --scenario "${E2E_SCENARIO}" \
            --auth "${E2E_AUTH}" \
            --exclude "${E2E_EXCLUDE}" \
            --scrub-vault-mapping "${E2E_SCRUB_VAULT_MAPPING}" \
            --artifacts-dir "${GITHUB_WORKSPACE}/e2e-artifacts" \
            --plan --max-legs 8

      - name: E2E - Refresh cluster auth before leg 1
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.e2e-plan.outcome == 'success' && fromJSON(steps.e2e-plan.outputs.count) > 0 && inputs.auth-data == '' }}
        continue-on-error: true
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.setup.outputs.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.setup.outputs.GKE_CLUSTER_LOC }}
          GKE_WIP:          ${{ steps.setup.outputs.GKE_WIP }}
          GKE_SA:           ${{ steps.setup.outputs.GKE_SA }}
          ROSA_URL:         ${{ secrets[inputs.server-url] }}
          ROSA_USER:        ${{ secrets[inputs.username] }}
          ROSA_PASS:        ${{ secrets[inputs.password] }}
          CLUSTER_NAME:     ${{ env.INFRA_CLUSTER_NAME }}

      - name: E2E - 🧪 Run Playwright leg 1 🧪
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.e2e-plan.outcome == 'success' && fromJSON(steps.e2e-plan.outputs.count) > 0 }}
        continue-on-error: ${{ steps.e2e-plan.outputs.blocking != '' && !fromJSON(steps.e2e-plan.outputs.blocking)[0] }}
        env:
          CAMUNDA_HELM_DIR: ${{ inputs.camunda-helm-dir }}
          E2E_STAGE: ${{ inputs.flow == 'install' && 'after-install' || 'after-upgrade' }}
          # install runs the registry's legs; upgrade flows run one blocking smoke leg.
          # A topology scenario runs its per-release legs instead.
          E2E_SUITE_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && !(inputs.flow == 'install' && inputs.is-topology))
              && (inputs.flow == 'install' && inputs.e2e-matrix || '[{"suite":"smoke","blocking":true,"shard_index":1,"shard_total":1}]')
              || '[]'
            }}
          E2E_TOPOLOGY_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && inputs.flow == 'install' && inputs.is-topology)
              && inputs.topology-smoke-matrix
              || '[]'
            }}
          E2E_TOPOLOGY_HUB_SUFFIX: ${{ inputs.topology-hub-suffix }}
          E2E_SHADOW: ${{ inputs.scenario == 'shadow-e2e' && inputs.flow == 'install' }}
          E2E_SCENARIO: ${{ inputs.scenario }}
          E2E_AUTH: ${{ inputs.auth }}
          E2E_EXCLUDE: ${{ inputs.exclude }}
          E2E_SCRUB_VAULT_MAPPING: ${{ inputs.vault-secret-mapping }}
        run: |
          deploy-camunda ci e2e-run \
            --repo-root "${GITHUB_WORKSPACE}" \
            --chart-dir "${CAMUNDA_HELM_DIR}" \
            --namespace "${TEST_NAMESPACE}" \
            --stage "${E2E_STAGE}" \
            --legs "${E2E_SUITE_LEGS}" \
            --topology-legs "${E2E_TOPOLOGY_LEGS}" \
            --topology-hub-suffix "${E2E_TOPOLOGY_HUB_SUFFIX}" \
            --shadow="${E2E_SHADOW}" \
            --scenario "${E2E_SCENARIO}" \
            --auth "${E2E_AUTH}" \
            --exclude "${E2E_EXCLUDE}" \
            --scrub-vault-mapping "${E2E_SCRUB_VAULT_MAPPING}" \
            --artifacts-dir "${GITHUB_WORKSPACE}/e2e-artifacts" \
            --leg-index 0

      - name: E2E - Refresh cluster auth before leg 2
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.e2e-plan.outcome == 'success' && fromJSON(steps.e2e-plan.outputs.count) > 1 && inputs.auth-data == '' }}
        continue-on-error: true
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.setup.outputs.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.setup.outputs.GKE_CLUSTER_LOC }}
          GKE_WIP:          ${{ steps.setup.outputs.GKE_WIP }}
          GKE_SA:           ${{ steps.setup.outputs.GKE_SA }}
          ROSA_URL:         ${{ secrets[inputs.server-url] }}
          ROSA_USER:        ${{ secrets[inputs.username] }}
          ROSA_PASS:        ${{ secrets[inputs.password] }}
          CLUSTER_NAME:     ${{ env.INFRA_CLUSTER_NAME }}

      - name: E2E - 🧪 Run Playwright leg 2 🧪
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.e2e-plan.outcome == 'success' && fromJSON(steps.e2e-plan.outputs.count) > 1 }}
        continue-on-error: ${{ steps.e2e-plan.outputs.blocking != '' && !fromJSON(steps.e2e-plan.outputs.blocking)[1] }}
        env:
          CAMUNDA_HELM_DIR: ${{ inputs.camunda-helm-dir }}
          E2E_STAGE: ${{ inputs.flow == 'install' && 'after-install' || 'after-upgrade' }}
          # install runs the registry's legs; upgrade flows run one blocking smoke leg.
          # A topology scenario runs its per-release legs instead.
          E2E_SUITE_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && !(inputs.flow == 'install' && inputs.is-topology))
              && (inputs.flow == 'install' && inputs.e2e-matrix || '[{"suite":"smoke","blocking":true,"shard_index":1,"shard_total":1}]')
              || '[]'
            }}
          E2E_TOPOLOGY_LEGS: >-
            ${{
              (inputs.e2e-enabled && !inputs.skip-e2e && inputs.flow == 'install' && inputs.is-topology)
              && inputs.topology-smoke-matrix
              || '[]'
            }}
          E2E_TOPOLOGY_HUB_SUFFIX: ${{ inputs.topology-hub-suffix }}
          E2E_SHADOW: ${{ inputs.scenario == 'shadow-e2e' && inputs.flow == 'install' }}
          E2E_SCENARIO: ${{ inputs.scenario }}
          E2E_AUTH: ${{ inputs.auth }}
          E2E_EXCLUDE: ${{ inputs.exclude }}
          E2E_SCRUB_VAULT_MAPPING: ${{ inputs.vault-secret-mapping }}
        run: |
          deploy-camunda ci e2e-run \
            --repo-root "${GITHUB_WORKSPACE}" \
            --chart-dir "${CAMUNDA_HELM_DIR}" \
            --namespace "${TEST_NAMESPACE}" \
            --stage "${E2E_STAGE}" \
            --legs "${E2E_SUITE_LEGS}" \
            --topology-legs "${E2E_TOPOLOGY_LEGS}" \
            --topology-hub-suffix "${E2E_TOPOLOGY_HUB_SUFFIX}" \
            --shadow="${E2E_SHADOW}" \
            --scenario "${E2E_SCENARIO}" \
            --auth "${E2E_AUTH}" \
            --exclude "${E2E_EXCLUDE}" \
            --scrub-vault-mapping "${E2E_SCRUB_VAULT_MAPPING}" \
            --artifacts-dir "${GITHUB_WORKSPACE}/e2e-artifacts" \
            --leg-index 1

      - name: E2E - Refresh cluster auth before leg 3
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.e2e-plan.outcome == 'success' && fromJSON(steps.e2e-plan.outputs.count) > 2 && inputs.auth-data == '' }}
        continue-on-error: true
        uses: ./.github/actions/cluster-auth
        with:
          platform: ${{ inputs.distro-platform }}
          auth-data: ${{ inputs.auth-data }}
        env:
          GH_APP_ID:        ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY:       ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.setup.outputs.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC:  ${{ steps.setup.outputs.GKE_CLUSTER_LOC }}
          GKE_WIP:          ${{ steps.setup.outputs.GKE_WIP }}
