name: Renovate - Config Check

on:
  push:
    paths:
      - '.github/renovate.json5'
      - 'charts/camunda-platform-*/Chart.yaml'
      - 'charts/chart-versions.yaml'
      - 'scripts/renovate-config-check/**'
  pull_request:
    paths:
      - '.github/renovate.json5'
      - 'charts/camunda-platform-*/Chart.yaml'
      - 'charts/chart-versions.yaml'
      - 'scripts/renovate-config-check/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check renovate config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # start-build-monitor-1.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Validate renovate config syntax
      uses: docker://renovate/renovate
      with:
        args: renovate-config-validator

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: scripts/renovate-config-check/go.mod
        cache: true
        cache-dependency-path: scripts/renovate-config-check/go.sum

    - name: Validate alpha versioning consistency
      working-directory: scripts/renovate-config-check
      run: go test ./... -v

    - name: Observe build status
      if: always()
      continue-on-error: true
      uses: ./.github/actions/observe-build-status
      with:
        build_status: ${{ job.status }}
        secret_vault_address: ${{ secrets.VAULT_ADDR }}
        secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
        secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
        secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
