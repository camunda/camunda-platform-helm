name: Integration Tests Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      sha:
        description: Override head SHA for testing
        required: true
        type: string
      event:
        description: Event the matrix run was triggered by
        required: true
        type: choice
        default: pull_request
        options:
          - pull_request
          - merge_group

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-changes:
    name: Detect MCP changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            mcp:
              - 'helm-values-mcp/**'
              - '.github/workflows/integration-tests-gate.yaml'
              - '.github/actions/install-tool-versions/**'
              - '.tool-versions'
              - 'charts/camunda-platform-*/Chart.yaml'
              - 'charts/camunda-platform-*/values*.yaml'
              - 'charts/camunda-platform-*/values.schema.json'

  mcp-test:
    name: Test helm-values-mcp
    needs: mcp-changes
    if: >-
      needs.mcp-changes.outputs.relevant == 'true' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      - name: Install Node (from .tool-versions)
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            nodejs
      - name: Install dependencies
        run: make mcp.deps
      - name: Build
        run: make mcp.build
      - name: Test
        run: make mcp.test

  gate:
    name: gate
    needs: [mcp-changes, mcp-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 420
    steps:
      - name: Verify MCP tests passed or were correctly skipped
        env:
          MCP_CHANGES_RESULT: ${{ needs.mcp-changes.result }}
          MCP_TEST_RESULT: ${{ needs.mcp-test.result }}
        run: |
          if [[ "$MCP_CHANGES_RESULT" != "success" ]]; then
            echo "::error::MCP change detection did not succeed ($MCP_CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$MCP_TEST_RESULT" != "success" && "$MCP_TEST_RESULT" != "skipped" ]]; then
            echo "::error::MCP tests did not pass or skip correctly ($MCP_TEST_RESULT)"
            exit 1
          fi
          echo "MCP gate OK (changes: $MCP_CHANGES_RESULT, test: $MCP_TEST_RESULT)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/integration-tests-gate
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/integration-tests-gate/go.mod
          cache: false

      - name: Run gate
        working-directory: scripts/integration-tests-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MATRIX_WORKFLOW: test-chart-version.yaml
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          OVERRIDE_SHA: ${{ inputs.sha }}
          OVERRIDE_EVENT: ${{ inputs.event }}
          IS_FORK: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name
                != github.repository }}
        run: go run .
