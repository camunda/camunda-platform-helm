name: "Chart - Chores"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chart-chores.yaml"
      - "charts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chores:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !startsWith(github.head_ref || github.ref_name, 'renovate/') &&
      !startsWith(github.head_ref || github.ref_name, 'release-please--') &&
      (github.head_ref || github.ref_name) != 'main'
    name: Chart chores
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure curl and wget
        uses: ./.github/actions/setup-curl
      #
      # Dependencies.
      #
      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm
            helm-ct
            yq
      - name: Install readme-generator-for-helm
        run: |
          # renovate: datasource=npm depName=@bitnami/readme-generator-for-helm
          npm install -g @bitnami/readme-generator-for-helm@2.7.2
      - name: Add Helm repos
        run: |
          make helm.repos-add
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.asdf/installs/golang/*/packages/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      #
      # Update
      #
      - name: Set vars
        run: |
          echo "CHANGED_CHARTS=$(ct list-changed | tr '\n' ' ')" | tee -a "$GITHUB_ENV"
      # An empty chartPath is indistinguishable from an unset one in the Makefile, which
      # then falls back to charts/camunda-platform-* and rewrites every chart version.
      - name: Update golden files
        run: |
          if [ -n "${CHANGED_CHARTS}" ]; then
            chartPath="${CHANGED_CHARTS}" make go.update-golden-only
          else
            echo "No chart changes, skipping golden file update."
          fi
      - name: Update README
        run: |
          if [ -n "${CHANGED_CHARTS}" ]; then
            chartPath="${CHANGED_CHARTS}" make helm.readme-update
          else
            echo "No chart changes, skipping README update."
          fi
      - name: Update Schema
        run: |
          if [ -n "${CHANGED_CHARTS}" ]; then
            chartPath="${CHANGED_CHARTS}" make helm.schema-update
          else
            echo "No chart changes, skipping schema update."
          fi
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        id: commit
        with:
          author_name: "distro-ci[bot]"
          author_email: "122795778+distro-ci[bot]@users.noreply.github.com"
          message: "chore: chart chores"
          fetch: false
          push: false
      - name: Export generated commit
        if: steps.commit.outputs.committed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git bundle create "$RUNNER_TEMP/changes.bundle" HEAD "^${BASE_SHA}"
      - name: Upload generated commit
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-chores-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/changes.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: chores
    if: needs.chores.outputs.committed == 'true'
    permissions: {}
    uses: ./.github/workflows/commit-generated-template.yaml
    with:
      artifact-name: chart-chores-${{ github.run_id }}-${{ github.run_attempt }}
      base-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      target-ref: ${{ github.head_ref || github.ref_name }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
