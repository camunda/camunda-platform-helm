name: "Chart - Chores"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chart-chores.yaml"
      - "charts/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  chores:
    if: ${{ !startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref, 'release-please--') }}
    name: Chart chores
    runs-on: ubuntu-latest
    steps:
      - name: Import Vault secrets for Harbor
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault-harbor
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: false
      #
      # Checkout.
      #
      - name: Generate GitHub token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        id: generate-github-token
        with:
          app_id: ${{ steps.vault-harbor.outputs.GH_APP_ID_DISTRO_CI }}
          private_key: ${{ steps.vault-harbor.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: "${{ steps.generate-github-token.outputs.token }}"
          # Credentials are re-introduced only in the final push step.
          persist-credentials: false
      - name: Configure curl and wget
        uses: ./.github/actions/setup-curl
      #
      # Dependencies.
      #
      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm
            helm-ct
            yq
      - name: Install readme-generator-for-helm
        run: |
          # renovate: datasource=npm depName=@bitnami/readme-generator-for-helm
          npm install -g @bitnami/readme-generator-for-helm@2.7.2
      - name: Add Helm repos
        run: |
          make helm.repos-add
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.asdf/installs/golang/*/packages/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      #
      # Update
      #
      - name: Set vars
        run: |
          echo "CHANGED_CHARTS=$(ct list-changed | tr '\n' ' ')" | tee -a $GITHUB_ENV
      - name: Update golden files
        run: |
          chartPath="${CHANGED_CHARTS}" \
            make go.update-golden-only
      - name: Update README
        run: |
          chartPath="${CHANGED_CHARTS}" \
            make helm.readme-update
      - name: Update Schema
        run: |
          chartPath="${CHANGED_CHARTS}" \
            make helm.schema-update
      - name: Git pull
        run: git pull --rebase --autostash .
      - uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        id: commit
        with:
          author_name: "distro-ci[bot]"
          author_email: "122795778+distro-ci[bot]@users.noreply.github.com"
          message: "chore: chart chores"
          # Pushing is done by the next step; checkout does not persist credentials.
          push: false
      - name: Push changes
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          TARGET_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Credential is supplied per-command via a helper reading the step env, so the token is
          # neither written to .git/config nor visible in the process arguments.
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f' \
              push origin "HEAD:refs/heads/${TARGET_REF}"
