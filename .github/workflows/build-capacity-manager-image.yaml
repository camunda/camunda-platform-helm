name: "Build - Capacity Manager Image"

on:
  push:
    branches:
      - main
    paths:
      - "scripts/capacity-manager/**"
      - ".github/workflows/build-capacity-manager-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Harbor credentials
        id: harbor
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/distribution/ci HARBOR_REGISTRY_USER;
            secret/data/products/distribution/ci HARBOR_REGISTRY_PASSWORD;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Harbor
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.harbor.outputs.HARBOR_REGISTRY_USER }}
          password: ${{ steps.harbor.outputs.HARBOR_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: scripts/capacity-manager
          file: scripts/capacity-manager/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            registry.camunda.cloud/team-distribution/capacity-manager:sha-${{ github.sha }}
          cache-from: type=gha,scope=capacity-manager
          cache-to: type=gha,mode=max,scope=capacity-manager
