# Mimic postUpgradeTasks which is only available for self-hosted Renovate instances.
# https://docs.renovatebot.com/configuration-options/#postupgradetasks
name: Renovate - Post Upgrade Tasks

on:
  workflow_dispatch:
  push:
    branches:
      - 'renovate/*'
    paths:
      - 'charts/camunda-platform*/Chart.yaml'
      - 'charts/camunda-platform*/values.yaml'
      - 'charts/camunda-platform*/templates/**'
      - 'charts/camunda-platform*/charts/**'
      - '**/go.mod'
      - '**/go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: startsWith(github.ref_name, 'renovate/')
    name: Update golden files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure curl and wget
        uses: ./.github/actions/setup-curl
      #
      # Dependencies.
      #
      - name: Install readme-generator-for-helm
        run: |
          # renovate: datasource=npm depName=@bitnami/readme-generator-for-helm
          npm install -g @bitnami/readme-generator-for-helm@2.7.2
      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang
            helm
            helm-ct
            yq
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.asdf/installs/golang/*/packages/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      #
      # Post Upgrade Tasks.
      #
      # SUPPORTED_CHANGED = CHANGED_CHARTS minus out-of-support chart versions.
      # The exclusion list is derived dynamically from charts/chart-versions.yaml
      # (supportExtended + endOfLife), so updating that file is the only thing
      # needed when a version transitions to end-of-support — no changes here.
      - name: Set vars
        run: |
          CHANGED_CHARTS=$(ct list-changed | tr '\n' ' ')
          echo "CHANGED_CHARTS=${CHANGED_CHARTS}" | tee -a "$GITHUB_ENV"
          # Build exclude pattern from supportExtended + endOfLife in charts/chart-versions.yaml.
          # Dots are escaped (8\.6 not 8.6) so the regex matches literal version strings only.
          EXCLUDED_VERSIONS=$(yq '.camundaVersions.supportExtended + .camundaVersions.endOfLife | map(. | sub("\.", "\\.")) | join("|")' charts/chart-versions.yaml)
          SUPPORTED_CHANGED=$(echo "${CHANGED_CHARTS}" | tr ' ' '\n' | grep -Ev "camunda-platform-(${EXCLUDED_VERSIONS})([^0-9]|$)" | tr '\n' ' ' | xargs || true)
          echo "SUPPORTED_CHANGED=${SUPPORTED_CHANGED}" | tee -a "$GITHUB_ENV"
      - name: Run go mod tidy
        run: |
          set -euo pipefail
          echo "Running 'go mod tidy' on all go.mod files..."
          while IFS= read -r -d '' go_mod_file; do
            module_dir="$(dirname "${go_mod_file}")"
            (
              cd "${module_dir}"
              echo "Processing $(pwd)/go.mod"
              go mod tidy
            )
          done < <(find . -name 'go.mod' -print0)
          echo "✅ 'go mod tidy' completed successfully"
      - name: Update golden files
        run: |
          if [ -n "${SUPPORTED_CHANGED}" ]; then
            chartPath="${SUPPORTED_CHANGED}" make go.update-golden-only
          else
            echo "No supported chart changes, skipping golden file update."
          fi
      - name: Update README
        run: |
          if [ -n "${SUPPORTED_CHANGED}" ]; then
            chartPath="${SUPPORTED_CHANGED}" make helm.readme-update
          else
            echo "No supported chart changes, skipping README update."
          fi
      - name: Update Schema
        run: |
          if [ -n "${SUPPORTED_CHANGED}" ]; then
            chartPath="${SUPPORTED_CHANGED}" make helm.schema-update
          else
            echo "No supported chart changes, skipping schema update."
          fi
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        id: commit
        with:
          author_name: "renovate[bot]"
          author_email: "29139614+renovate[bot]@users.noreply.github.com"
          message: "chore(deps): post upgrade tasks - go mod tidy, update golden files, readme, and schema"
          fetch: false
          push: false
      - name: Export generated commit
        if: steps.commit.outputs.committed == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git bundle create "$RUNNER_TEMP/changes.bundle" HEAD "^${BASE_SHA}"
      - name: Upload generated commit
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renovate-chores-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/changes.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: run
    if: needs.run.outputs.committed == 'true'
    permissions: {}
    uses: ./.github/workflows/commit-generated-template.yaml
    with:
      artifact-name: renovate-chores-${{ github.run_id }}-${{ github.run_attempt }}
      base-sha: ${{ github.sha }}
      target-ref: ${{ github.ref_name }}
      update-modules: true
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
