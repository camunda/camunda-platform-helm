# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: "Chart - Release - Pipeline - 3 - Public"

on:
  workflow_dispatch:
    inputs:
      rc-tag:
        description: |
          RC package tag to release.
          Format: {version}-rc (e.g., "13.4.0-rc")
          Or rolling tag: {chart-major}-rc-latest (e.g., "13-rc-latest")
        required: true
        type: string
      dry-run:
        description: |
          Dry run: pull and validate the RC package from Harbor, extract
          metadata, then LOG (not execute) the GitHub release, index push,
          cosign signing, and post-release PR automation. Accepts dry-run RC
          tags ({version}-rc-dryrun / {major}-rc-dryrun-latest) in addition to
          the plain rc forms. Nothing public is written.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.rc-tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

env:
  HARBOR_REGISTRY: registry.camunda.cloud
  HARBOR_PROJECT: team-distribution
  CHART_RELEASER_CONFIG_FILE: ".github/config/chart-releaser.yaml"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      app-version: ${{ steps.metadata.outputs.app_version }}
      chart-dir-id: ${{ steps.metadata.outputs.chart_dir_id }}
      release-tag: ${{ steps.metadata.outputs.release_tag }}
      package-file: ${{ steps.metadata.outputs.package_file }}
      source-commit: ${{ steps.parse.outputs.commit_sha }}
      previous-source-commit: ${{ steps.history.outputs.previous_commit_sha }}
    env:
      CHART_RELEASE_COSIGN_CERTIFICATE_IDENTITY: "https://github.com/${{ github.workflow_ref }}"
      CHART_RELEASE_COSIGN_CERTIFICATE_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # start-build-monitor-1.0.1
      - name: Import Vault secrets for Harbor
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault-harbor
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci HARBOR_REGISTRY_USER;
            secret/data/products/distribution/ci HARBOR_REGISTRY_PASSWORD;
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-github-token
        with:
          app-id: ${{ steps.vault-harbor.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault-harbor.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install tools for tooling
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            golang

      - name: Build release-tools
        run: cd scripts/release-tools && go build -o /tmp/release-tools .

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            helm
            helm-cr

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Login to Harbor
        env:
          HARBOR_REGISTRY_USER: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_USER }}
          HARBOR_REGISTRY_PASSWORD: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_PASSWORD }}
        run: |
          # Retrying registry login; harbor_helm_pull below also re-auths on 401.
          source "${GITHUB_WORKSPACE}/scripts/harbor-retry.sh"
          harbor_login

      - name: Resolve RC source
        id: parse
        env:
          HARBOR_REGISTRY_USER: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_USER }}
          HARBOR_REGISTRY_PASSWORD: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_PASSWORD }}
          RC_TAG: ${{ inputs.rc-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          source_ref=$(/tmp/release-tools harbor-tag source \
            --api "https://${HARBOR_REGISTRY}/api/v2.0" \
            --repo "projects/${HARBOR_PROJECT}/repositories/camunda-platform" \
            --ref "${RC_TAG}" --dry-run="${DRY_RUN}")
          source_sha=$(git rev-parse --verify "${source_ref}^{commit}")
          git merge-base --is-ancestor "${source_sha}" origin/main
          echo "commit_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Pull immutable RC package
        env:
          HARBOR_REGISTRY_USER: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_USER }}
          HARBOR_REGISTRY_PASSWORD: ${{ steps.vault-harbor.outputs.HARBOR_REGISTRY_PASSWORD }}
          ARTIFACT_DIGEST: ${{ steps.parse.outputs.artifact_digest }}
        run: |
          source "${GITHUB_WORKSPACE}/scripts/harbor-retry.sh"
          mkdir -p .cr-release-packages
          harbor_helm_pull "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/camunda-platform@${ARTIFACT_DIGEST}" \
            --destination .cr-release-packages

      - name: Extract metadata from package
        id: metadata
        env:
          RC_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          package_file=$(ls .cr-release-packages/*.tgz)
          package_name="camunda-platform-${RC_VERSION}.tgz"
          if [[ "${package_file}" != ".cr-release-packages/${package_name}" ]]; then
            mv "${package_file}" ".cr-release-packages/${package_name}"
          fi
          echo "package_file=${package_name}" >> "$GITHUB_OUTPUT"

          # Extract version, app_version (appVersion, .x-stripped), prerelease,
          # is_latest_stable (vs the newest released minor in chart-versions.yaml),
          # chart_dir_id, release_tag, the cosign file names and the
          # component-image-versions annotation from the package's Chart.yaml.
          tar -xzf ".cr-release-packages/${package_name}" camunda-platform/Chart.yaml -O > /tmp/Chart.yaml
          /tmp/release-tools chart-metadata \
            --chart-yaml /tmp/Chart.yaml \
            --chart-versions "$(git rev-parse --show-toplevel)/charts/chart-versions.yaml"

      - name: Resolve previous release source
        id: history
        env:
          RC_VERSION: ${{ steps.parse.outputs.version }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.parse.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ "${PACKAGE_VERSION}" != "${RC_VERSION}" ]]; then
            echo "::error::The pulled package version does not match the selected RC"
            exit 1
          fi
          previous_ref=$(/tmp/release-tools release-history --chart-yaml /tmp/Chart.yaml)
          previous_sha=$(git rev-parse --verify "${previous_ref}^{commit}")
          git merge-base --is-ancestor "${previous_sha}" "${SOURCE_SHA}"
          echo "previous_commit_sha=${previous_sha}" >> "$GITHUB_OUTPUT"

      - name: Run Chart Releaser - Tagging/Uploading
        if: ${{ !inputs.dry-run }}
        env:
          CR_TOKEN: ${{ steps.generate-github-token.outputs.token }}
        run: |
          helm-cr upload --config ${{ env.CHART_RELEASER_CONFIG_FILE }} \
            --push \
            --skip-existing=false \
            --commit "${{ steps.parse.outputs.commit_sha }}" \
            --owner "${{ github.repository_owner }}" \
            --git-repo "$(basename ${{ github.repository }})" \
            --make-release-latest "${{ steps.metadata.outputs.is_latest_stable }}" \
            --release-name-template "${{ steps.metadata.outputs.release_tag }}"

      - name: Run Chart Releaser - Indexing
        if: ${{ !inputs.dry-run }}
        env:
          CR_TOKEN: ${{ steps.generate-github-token.outputs.token }}
        run: |
          helm-cr index --config ${{ env.CHART_RELEASER_CONFIG_FILE }} \
            --push \
            --owner "${{ github.repository_owner }}" \
            --git-repo "$(basename ${{ github.repository }})" \
            --release-name-template "${{ steps.metadata.outputs.release_tag }}"

      # Cosign keyless signing is gated too: it writes a permanent entry to the
      # public Rekor transparency log, so it is a public side effect.
      - name: Sign Helm chart with Cosign
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        run: |
          source "${GITHUB_WORKSPACE}/scripts/harbor-retry.sh"
          retry_cmd "cosign sign-blob" cosign sign-blob -y "${{ steps.metadata.outputs.package_file }}" \
            --bundle "${{ steps.metadata.outputs.cosign_bundle }}"

      - name: Get Cosign Rekor log index
        id: rekor
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        run: |
          # New cosign bundle format uses .verificationMaterial.tlogEntries[0].logIndex
          rekor_log_index=$(jq -r '.verificationMaterial.tlogEntries[0].logIndex // .rekorBundle.Payload.logIndex // "unavailable"' "${{ steps.metadata.outputs.cosign_bundle }}")
          echo "log_index=${rekor_log_index}" | tee -a $GITHUB_OUTPUT

      - name: Create Cosign verify script
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        run: |
          cat << EOF > "${{ steps.metadata.outputs.cosign_verify }}"
          # Rekor record:
          echo "Rekor record:"
          echo "https://search.sigstore.dev/?logIndex=${{ steps.rekor.outputs.log_index }}"

          # Cosign verification:
          cosign verify-blob ${{ steps.metadata.outputs.package_file }} \\
            --bundle "${{ steps.metadata.outputs.cosign_bundle }}" \\
            --certificate-identity "${{ env.CHART_RELEASE_COSIGN_CERTIFICATE_IDENTITY }}" \\
            --certificate-oidc-issuer "${{ env.CHART_RELEASE_COSIGN_CERTIFICATE_OIDC_ISSUER }}"
          EOF

      - name: Verify signed Helm chart
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        run: |
          bash "${{ steps.metadata.outputs.cosign_verify }}"

      - name: Upload Cosign bundle to release
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.metadata.outputs.release_tag }}" \
            "${{ steps.metadata.outputs.cosign_bundle }}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload Cosign verify script to release
        if: ${{ !inputs.dry-run }}
        working-directory: .cr-release-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.metadata.outputs.release_tag }}" \
            "${{ steps.metadata.outputs.cosign_verify }}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Dry run - log skipped public publishes
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::[dry run] Public publishes were skipped. Plan:"
          echo "::notice::[dry run] - GitHub release '${{ steps.metadata.outputs.release_tag }}' with chart package '${{ steps.metadata.outputs.package_file }}' (make-release-latest: ${{ steps.metadata.outputs.is_latest_stable }})"
          echo "::notice::[dry run] - Push '${{ steps.metadata.outputs.package_file }}' entry to the gh-pages index.yaml (helm repo)"
          echo "::notice::[dry run] - Cosign keyless signing of the package (public Rekor transparency log entry)"
          echo "::notice::[dry run] - Upload cosign bundle + verify script to the GitHub release"
          echo "::notice::[dry run] - Post-release: version-label PRs/issues, mark release-please PR published, approve + auto-merge it"

      - name: Add release info to workflow summary
        if: ${{ !inputs.dry-run }}
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          APP_VERSION="${{ steps.metadata.outputs.app_version }}"
          RELEASE_TAG="${{ steps.metadata.outputs.release_tag }}"
          PRERELEASE="${{ steps.metadata.outputs.prerelease }}"
          IMAGE_VERSIONS="${{ steps.metadata.outputs.image_versions }}"
          REKOR_LOG_INDEX="${{ steps.rekor.outputs.log_index }}"
          DEV_TAG="${{ steps.parse.outputs.dev_tag }}"
          COMMIT_SHA="${{ steps.parse.outputs.commit_sha }}"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          ARTIFACTHUB_URL="https://artifacthub.io/packages/helm/camunda/camunda-platform/${VERSION}"
          REKOR_URL="https://search.sigstore.dev/?logIndex=${REKOR_LOG_INDEX}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Helm Chart ${VERSION} Released

          | | |
          |---|---|
          | **Chart** | [\`${VERSION}\`](${RELEASE_URL}) |
          | **Camunda** | \`${APP_VERSION}\` |
          | **Prerelease** | ${PRERELEASE} |
          | **Artifact Hub** | [camunda-platform/${VERSION}](${ARTIFACTHUB_URL}) |
          | **Rekor Log** | [#${REKOR_LOG_INDEX}](${REKOR_URL}) |
          EOF

          # Add image versions if available
          if [[ -n "${IMAGE_VERSIONS}" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Component Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Component | Version |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "${IMAGE_VERSIONS}" | while IFS=': ' read -r component version; do
              [[ -n "${component}" && -n "${version}" ]] && echo "| ${component} | \`${version}\` |" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Add traceability if we have source info
          if [[ -n "${DEV_TAG}" && -n "${COMMIT_SHA}" ]]; then
            SHORT_SHA="${COMMIT_SHA:0:7}"
            COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"

            cat >> $GITHUB_STEP_SUMMARY << EOF

          ### Traceability

          | | |
          |---|---|
          | **Source** | [\`${SHORT_SHA}\`](${COMMIT_URL}) |
          | **Dev Tag** | \`${DEV_TAG}\` |
          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### Install

          \`\`\`bash
          helm repo add camunda https://helm.camunda.io
          helm repo update
          helm install camunda camunda/camunda-platform --version ${VERSION}
          \`\`\`
          EOF

      - name: Add dry-run info to workflow summary
        if: ${{ inputs.dry-run }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 DRY RUN 🧪 Helm Chart ${{ steps.metadata.outputs.version }} Release Rehearsal

          | | |
          |---|---|
          | **RC Tag** | \`${{ steps.parse.outputs.resolved_tag }}\` |
          | **Would release** | \`${{ steps.metadata.outputs.release_tag }}\` |
          | **Camunda** | \`${{ steps.metadata.outputs.app_version }}\` |
          | **Latest stable** | ${{ steps.metadata.outputs.is_latest_stable }} |

          Validated: immutable Harbor pull, package metadata, and current/previous artifact source commits.
          Skipped (logged above): GitHub release, index.yaml push, cosign signing + uploads, post-release PR automation.
          EOF

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  post-release:
    name: Post-Release
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.mark-published.outputs.pr_number }}
      auto-merge-enabled: ${{ steps.auto-merge.outputs.enabled }}
    steps:
      - name: Import Vault secrets for Harbor
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault-harbor
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-github-token
        with:
          app-id: ${{ steps.vault-harbor.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault-harbor.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-github-token.outputs.token }}

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            git-cliff
            golang
            helm
            helm-ct
            yq

      - name: Build release-tools
        run: cd scripts/release-tools && go build -o /tmp/release-tools .

      - name: Label PRs with version
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
        run: |
          make release.set-prs-version-label \
            chartPath="charts/camunda-platform-${{ needs.release.outputs.chart-dir-id }}" \
            chartVersion="${{ needs.release.outputs.version }}" \
            sourceSHA="${{ needs.release.outputs.source-commit }}" \
            previousSourceSHA="${{ needs.release.outputs.previous-source-commit }}"

      - name: Stamp release date on the release-please PR
        id: stamp
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          APP_VERSION: "${{ needs.release.outputs.chart-dir-id }}"
          CHART_VERSION: "${{ needs.release.outputs.version }}"
        run: |
          set -euo pipefail

          head_ref="release-please--branches--main--components--camunda-platform-${APP_VERSION}"
          git fetch origin "${head_ref}" --tags
          git checkout "${head_ref}"

          /tmp/release-tools stamp-release --app "${APP_VERSION}" --chart-version "${CHART_VERSION}"
          /tmp/release-tools version-matrix --readme "${APP_VERSION}"
          /tmp/release-tools version-matrix --index

          git config user.name "distro-ci[bot]"
          git config user.email "122795778+distro-ci[bot]@users.noreply.github.com"
          git add "version-matrix/camunda-${APP_VERSION}/version-matrix.json" \
            "version-matrix/camunda-${APP_VERSION}/README.md" \
            "version-matrix/README.md"
          if git diff --cached --quiet; then
            echo "::notice::Release date already stamped"
          else
            git commit -m "chore: stamp release date for ${CHART_VERSION}"
            git push origin "${head_ref}"
            echo "::notice::Stamped release date on ${head_ref}"
          fi
          git checkout -

      # Gated on the stamp: a release must not merge to main with its
      # release_date unstamped (the page would permanently show _pending_).
      - name: Mark release-please PR as published
        id: mark-published
        if: ${{ !cancelled() && steps.stamp.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          CHART_DIR_ID: "${{ needs.release.outputs.chart-dir-id }}"
        run: |
          set -euo pipefail

          head_ref="release-please--branches--main--components--camunda-platform-${CHART_DIR_ID}"
          pr_number="$(gh pr list --state open --head "${head_ref}" --json number --jq '.[0].number // empty')"

          if [[ -z "${pr_number}" ]]; then
            echo "::error::Could not find open release-please PR with head '${head_ref}'."
            echo "::error::Cannot update autorelease labels; refusing to continue."
            exit 1
          fi

          echo "pr_number=${pr_number}" >> $GITHUB_OUTPUT

          current_labels="$(gh pr view "${pr_number}" --json labels --jq '.labels[].name')"
          if echo "${current_labels}" | grep -qx "autorelease: pending"; then
            gh pr edit "${pr_number}" --remove-label "autorelease: pending"
          fi
          if ! echo "${current_labels}" | grep -qx "autorelease: published"; then
            gh pr edit "${pr_number}" --add-label "autorelease: published"
          fi

      - name: Approve and auto-merge release-please PR
        id: auto-merge
        if: ${{ !cancelled() && steps.mark-published.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
        run: |
          pr_number="${{ steps.mark-published.outputs.pr_number }}"
          head_ref="release-please--branches--main--components--camunda-platform-${{ needs.release.outputs.chart-dir-id }}"

          # Rebase onto main so the branch is not behind (strict status checks).
          git config user.name "distro-ci[bot]"
          git config user.email "122795778+distro-ci[bot]@users.noreply.github.com"
          git fetch origin main "${head_ref}"
          if ! git merge-base --is-ancestor origin/main "origin/${head_ref}"; then
            git checkout -B "${head_ref}" "origin/${head_ref}"
            git rebase origin/main
            git push --force-with-lease origin "${head_ref}"
          else
            echo "::notice::Branch already up to date"
          fi

          # Use GITHUB_TOKEN for approval (different identity from PR author).
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr review "${pr_number}" --approve

          gh pr merge "${pr_number}" --auto --squash
          echo "enabled=true" >> $GITHUB_OUTPUT

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
        run: |
          PR_URL=$(gh pr view "${{ steps.mark-published.outputs.pr_number }}" --json url --jq '.url' 2>/dev/null || echo "")

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## Post-Release Complete

          ✅ PRs labeled with version \`${{ needs.release.outputs.version }}\`
          ✅ Release-please PR labeled with \`autorelease: published\`
          EOF

          if [[ "${{ steps.auto-merge.outputs.enabled }}" == "true" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ✅ Auto-merge enabled for release-please PR
          ${PR_URL:+**PR:** ${PR_URL}}
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << EOF

          ### Manual Step Required
          Merge the release-please PR to complete the release process.
          ${PR_URL:+**PR:** ${PR_URL}}
          EOF
          fi

      - name: Import Vault secrets for notification
        id: vault-notification
        if: steps.auto-merge.outputs.enabled == 'true'
        continue-on-error: true
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci SLACK_DISTRO_BOT_WEBHOOK;
          exportEnv: false

      - name: Notify Slack of release completion
        if: steps.auto-merge.outputs.enabled == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ steps.vault-notification.outputs.SLACK_DISTRO_BOT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :white_check_mark: *Helm Chart ${{ needs.release.outputs.version }}* released and auto-merge enabled for the release-please PR.
                    <${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.mark-published.outputs.pr_number }}|View PR> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>

  ensure-release-pr-merged:
    name: Ensure release-please PR merges
    needs: [release, post-release]
    # The artifact is already published; this job only shepherds the release-please PR
    # through the merge queue. A PR that does not merge is a `main`-sync gap, NOT a release
    # failure: this job raises its own distinct alert and is deliberately excluded from
    # `notify-on-failure` (below) so it never fires the "Chart Public Release Failed" alert.
    if: ${{ !cancelled() && needs.post-release.outputs.auto-merge-enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # start-build-monitor-1.0.1
      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
            secret/data/products/distribution/ci SLACK_DISTRO_BOT_WEBHOOK;
          exportEnv: false

      - name: Shepherd release-please PR through merge queue
        id: merge-queue
        continue-on-error: true
        uses: camunda/infra-global-github-actions/ensure-pr-passes-merge-queue@95c6f97de08ce6befa8e1b222140676204d792fb # main
        with:
          pr-number: ${{ needs.post-release.outputs.pr-number }}
          app-id: ${{ steps.secrets.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.secrets.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
          repository-owner: ${{ github.repository_owner }}
          repository-name: ${{ github.event.repository.name }}
          merge-method: squash
          timeout-minutes: "120"
          max-evictions: "3"

      - name: Notice if monitor ended with PR still queued
        if: >-
          ${{ steps.merge-queue.outputs.result == 'timeout' &&
              steps.merge-queue.outputs.queue-state != 'NOT_IN_QUEUE' &&
              steps.merge-queue.outputs.queue-state != 'UNKNOWN' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ steps.secrets.outputs.SLACK_DISTRO_BOT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :hourglass_flowing_sand: *Helm Chart ${{ needs.release.outputs.version }}* was published; its release-please PR was still in the merge queue (state: `${{ steps.merge-queue.outputs.queue-state }}`, position: `${{ steps.merge-queue.outputs.queue-position }}`) when the 120-minute monitor window ended. It should merge on its own — verify it landed so `main` syncs with the released artifact.
                    <${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.post-release.outputs.pr-number }}|View PR> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>

      - name: Alert if release-please PR did not merge
        if: >-
          ${{ steps.merge-queue.outputs.result != 'merged' &&
              (steps.merge-queue.outputs.result != 'timeout' ||
               steps.merge-queue.outputs.queue-state == 'NOT_IN_QUEUE' ||
               steps.merge-queue.outputs.queue-state == 'UNKNOWN') }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ steps.secrets.outputs.SLACK_DISTRO_BOT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    <!subteam^S05K9BK6RTK> :rotating_light:
                    *Helm Chart ${{ needs.release.outputs.version }}* was published, but its release-please PR did *not* merge (result: `${{ steps.merge-queue.outputs.result || 'unknown' }}`, last queue state: `${{ steps.merge-queue.outputs.queue-state || 'unknown' }}`).
                    Please merge it so `main` syncs with the released artifact.
                    <${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.post-release.outputs.pr-number }}|View PR> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>

      - name: Import build status secrets
        id: build-status-secrets
        if: always()
        continue-on-error: true
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/distribution/ci/ci-analytics gcloud_sa_key;

      - uses: camunda/infra-global-github-actions/submit-build-status@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # submit-build-status-1.3.3
        if: ${{ always() && steps.build-status-secrets.outputs.gcloud_sa_key != '' }}
        continue-on-error: true
        with:
          build_status: "${{ job.status }}"
          gcp_credentials_json: "${{ steps.build-status-secrets.outputs.gcloud_sa_key }}"

  notify-on-failure:
    name: Notify on Failure
    needs: [release, post-release]
    if: ${{ failure() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci SLACK_DISTRO_BOT_WEBHOOK;
          exportEnv: false
      - name: Send Slack notification
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ steps.secrets.outputs.SLACK_DISTRO_BOT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "Chart Public Release Failed"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    <!subteam^S05K9BK6RTK> :rotating_light:
                    The *Chart Public Release* pipeline has failed.

                    *RC tag:* ${{ inputs.rc-tag }}

                    <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed workflow>
