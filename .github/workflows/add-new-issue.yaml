name: Add new Issue

on:
  issues:
    types: [opened, reopened, transferred, labeled]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add new issue
    if: "!startsWith(github.event.label.name, 'triage:slack-')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Go
        uses: ./.github/actions/install-tool-versions
        with:
          tools: golang
      - name: Create URL to the run output
        id: vars
        run: |
          echo "project_id=33" >> "$GITHUB_OUTPUT"
          echo "now=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Import Vault secrets for Harbor
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: vault-harbor
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-github-token
        with:
          app-id: ${{ steps.vault-harbor.outputs.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ steps.vault-harbor.outputs.GH_APP_PRIVATE_KEY_DISTRO_CI }}
          permission-members: read
          permission-issues: read
          permission-organization-projects: write

      - name: Classify issue creator
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: make run.issue-triage command=classify
      
      - name: Add to Distribution Team project
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/camunda/projects/33
          github-token: '${{ steps.generate-github-token.outputs.token }}'

      - name: Route new internal issue to Backlog
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: make run.issue-triage command=route

      - name: Update Created At field
        uses: github/update-project-action@d0031a4f8081c4bf4438d7ce2fa5cf1136610c7a # main
        id: update-created-at
        with:
          github_token: ${{ steps.generate-github-token.outputs.token }}
          organization: ${{ github.repository_owner }}
          project_number: ${{ steps.vars.outputs.project_id }}
          content_id: ${{ github.event.issue.node_id }}
          field: Created At
          value: ${{ steps.vars.outputs.now }}

      - name: Add issue to Quality Board
        # https://github.com/orgs/camunda/projects/187/views/15
        id: add-bug-to-quality-board
        uses: camunda/infra-global-github-actions/add-bug-to-quality-board@95c6f97de08ce6befa8e1b222140676204d792fb # main
        with:
          github-token: ${{ steps.generate-github-token.outputs.token }}
          project-number: "187"
          labels: "component/helm"
        # Only run this job for issues labeled as 'kind/bug' and
        # for the relevant GitHub issue events that indicate a new or updated issue.
        if: >
          contains(github.event.issue.labels.*.name, 'kind/bug') &&
          (
              github.event.action == 'opened' ||
              github.event.action == 'reopened' ||
              github.event.action == 'transferred' ||
              (github.event.action == 'labeled' && github.event.label.name == 'kind/bug')
          )

  reconcile-urgency:
    needs: add-to-project
    uses: ./.github/workflows/triage-assign-urgency-to-issue.yml
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
