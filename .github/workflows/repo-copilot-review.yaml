name: Repo - Copilot Review

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, ready_for_review, labeled]

permissions: {}

jobs:
  copilot-review:
    permissions:
      pull-requests: write
    uses: camunda/infraex-common-config/.github/workflows/copilot-review-global.yml@0b61f2d2aff816cd7527ae859bae5450a47b27c6
    with:
      skip-authors: '["renovate[bot]", "distro-ci[bot]"]'
