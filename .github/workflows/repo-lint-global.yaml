name: Repo - Lint Global

on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Git ref for the Helm template complexity baseline
        required: true
        default: origin/main
        type: string
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  template-complexity:
    name: Template complexity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: ./.github/actions/install-tool-versions
        with:
          tools: golang
      - name: Check template complexity
        env:
          HELM_TEMPLATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base-ref || 'origin/main' }}
        run: make helm.template-complexity
  lint:
    permissions:
      contents: read
      id-token: write
    uses: camunda/infraex-common-config/.github/workflows/lint-global.yml@e2923304b40dfc031b3f595bcc1445e90c981adb # 3.0.0
    with:
      vault-secret-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
      vault-github-app-private-key-key: GITHUB_APP_SECRET
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
      VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
      VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
