name: Repo - Lint Global

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      id-token: write
    uses: camunda/infraex-common-config/.github/workflows/lint-global.yml@e2923304b40dfc031b3f595bcc1445e90c981adb # 3.0.0
    with:
      vault-secret-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
      vault-github-app-private-key-key: GITHUB_APP_SECRET
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
      VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
      VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
