name: Test - Issue triage

on:
  pull_request:
    paths:
      - scripts/issue-triage/**
      - .github/workflows/triage-*.yml
      - .github/workflows/add-new-issue.yaml
      - .github/workflows/test-issue-triage.yaml
      - Makefile
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-issue-triage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool-versions
        with:
          tools: golang
      - run: make test.issue-triage
