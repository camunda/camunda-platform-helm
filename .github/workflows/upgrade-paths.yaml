name: "Upgrade Paths - Render"

# Renders each upgrade-path archetype against the target chart twice: once with
# the source chart's values unchanged (Run A) and once with the transition's
# delta applied (Run B). Cluster-stage checks (data survival, orphaned
# resources, migration duration) are out of scope here.

on:
  pull_request:
    paths:
      - "charts/camunda-platform-*/values.yaml"
      - "charts/camunda-platform-*/templates/common/constraints.tpl"
      - "charts/camunda-platform-*/test/integration/scenarios/chart-full-setup/values/**"
      - "test/upgrade-paths/**"
      - "scripts/upgrade-paths/**"
      - ".github/workflows/upgrade-paths.yaml"
  merge_group: {}
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      transitions:
        description: "Space-separated from:to pairs, e.g. '8.9:8.10 8.8:8.9'. Empty runs all."
        type: string
        default: ""
      cluster-stage:
        description: "Also run the cluster stage (deploys to GKE; ~8 min per run)"
        type: boolean
        default: false
      cluster-run:
        description: "Which cluster run to perform"
        type: choice
        options: [both, naive, remediated]
        default: both
      cluster-shortname:
        description: "Scenario shortname for the cluster stage"
        type: string
        default: upclas

permissions:
  contents: read

concurrency:
  group: upgrade-paths-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve transitions
    runs-on: ubuntu-latest
    outputs:
      transitions: ${{ steps.resolve.outputs.transitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Resolve transitions
        id: resolve
        env:
          REQUESTED: ${{ inputs.transitions }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            items=$(for p in ${REQUESTED}; do
              printf '{"from":"%s","to":"%s"}\n' "${p%%:*}" "${p##*:}"
            done | jq -sc .)
          else
            # Each transitions/<from>-to-<to> directory is one runnable pair.
            items=$(find test/upgrade-paths/transitions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sed -E 's/^(.+)-to-(.+)$/{"from":"\1","to":"\2"}/' \
              | jq -sc .)
          fi
          echo "transitions=${items}" >>"$GITHUB_OUTPUT"
          echo "Resolved: ${items}"

  render:
    name: ${{ matrix.transition.from }} to ${{ matrix.transition.to }}
    needs: matrix
    if: needs.matrix.outputs.transitions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transition: ${{ fromJson(needs.matrix.outputs.transitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Doc coverage compares each discovered key against the published upgrade
      # guide. Without this checkout the column renders as "not checked".
      - name: Checkout camunda-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        continue-on-error: true
        with:
          repository: camunda/camunda-docs
          path: .camunda-docs
          fetch-depth: 1

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            helm
            golang

      - name: Build upgrade-paths
        run: cd scripts/upgrade-paths && go build -o "${RUNNER_TEMP}/upgrade-paths" .

      - name: Render upgrade paths
        id: render
        env:
          FROM: ${{ matrix.transition.from }}
          TO: ${{ matrix.transition.to }}
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/upgrade-paths" \
            --from "${FROM}" --to "${TO}" \
            --discover \
            --docs-root "${GITHUB_WORKSPACE}/.camunda-docs" \
            --quiet \
            --markdown "${RUNNER_TEMP}/report-${FROM}-to-${TO}.md" \
            --json "${RUNNER_TEMP}/report-${FROM}-to-${TO}.json"
          echo "exit_code=$?" >>"$GITHUB_OUTPUT"

      - name: Publish report
        if: always()
        env:
          FROM: ${{ matrix.transition.from }}
          TO: ${{ matrix.transition.to }}
        run: cat "${RUNNER_TEMP}/report-${FROM}-to-${TO}.md" >>"$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: upgrade-path-report-${{ matrix.transition.from }}-to-${{ matrix.transition.to }}
          path: ${{ runner.temp }}/report-*
          if-no-files-found: warn

      # UNREMEDIATED (no known remedy) and STALE_DELTA (fixture lies) fail.
      # REMEDIATED does not: a break with a tested delta is the expected
      # mid-cycle state, and the report is the deliverable.
      - name: Enforce outcome
        if: steps.render.outputs.exit_code != '0'
        run: |
          echo "::error::Upgrade path check failed - see the job summary for the outcome matrix."
          exit 1

  helm-v3-gate:
    name: Helm v3 rejection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install pinned Helm v3
        env:
          HELM_V3_VERSION: v3.20.2
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_V3_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" --strip-components=1 linux-amd64/helm
          "${RUNNER_TEMP}/helm" version --short

      # The guard is asserted on the message, not the exit code: a chart can
      # fail a bare render for unrelated reasons, such as required values that
      # a scenario would normally supply.
      - name: Charts requiring v4 must reject a v3 client
        env:
          MARKER: requires Helm CLI v4 or later
        run: |
          set -uo pipefail
          status=0
          for chart in charts/camunda-platform-*/; do
            requires=$(grep -oE 'camunda\.io/helmCLIVersion: *"[^"]*"' "${chart}Chart.yaml" | head -1) || true
            out=$("${RUNNER_TEMP}/helm" template t "${chart}" 2>&1) || true

            if echo "${requires}" | grep -q '"4'  && ! echo "${requires}" | grep -q '3\.'; then
              if echo "${out}" | grep -qF "${MARKER}"; then
                echo "✓ ${chart} rejects Helm v3"
              else
                echo "::error::${chart} declares v4-only but a v3 render did not report it"
                status=1
              fi
            else
              if echo "${out}" | grep -qF "${MARKER}"; then
                echo "::error::${chart} still supports v3 but a v3 render reported the v4 constraint"
                status=1
              else
                echo "✓ ${chart} does not reject Helm v3"
              fi
            fi
          done
          exit $status

  # The cluster stage deploys a full previous-version release and upgrades it,
  # so it is nightly and on-demand only, never on a pull request.
  cluster:
    name: Cluster stage
    needs: render
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.cluster-stage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        run: ${{ (github.event_name == 'workflow_dispatch' && inputs.cluster-run != 'both')
          && fromJson(format('["{0}"]', inputs.cluster-run))
          || fromJson('["naive","remediated"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install tools
        uses: ./.github/actions/install-tool-versions
        with:
          tools: |
            helm
            golang
            kubectl

      - name: Import Vault secrets
        id: test-credentials-secret
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_NAME;
            secret/data/products/distribution/ci DISTRO_CI_GCP_GKE_CLUSTER_LOCATION;
            secret/data/products/distribution/ci DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER;
            secret/data/products/distribution/ci DISTRO_CI_GCP_SERVICE_ACCOUNT;
            secret/data/products/distribution/ci RDBMS_POSTGRESQL_USERNAME;
            secret/data/products/distribution/ci RDBMS_POSTGRESQL_PASSWORD;
          exportEnv: false

      - name: Authenticate to cluster
        uses: ./.github/actions/cluster-auth
        with:
          platform: gke
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID_DISTRO_CI_MANAGE_GH_ENVS }}
          GH_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY_DISTRO_CI_MANAGE_GH_ENVS }}
          GKE_CLUSTER_NAME: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOC: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_GKE_CLUSTER_LOCATION }}
          GKE_WIP: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GKE_SA: ${{ steps.test-credentials-secret.outputs.DISTRO_CI_GCP_SERVICE_ACCOUNT }}

      # Built from source every run. A stale binary silently exercises code that
      # is no longer on disk, which is not detectable from the run's output.
      - name: Build deploy-camunda
        run: cd scripts/deploy-camunda && go build -o "${RUNNER_TEMP}/deploy-camunda" .

      - name: Resolve delta for this run
        id: delta
        env:
          SHORTNAME: ${{ inputs.cluster-shortname || 'upclas' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.run }}" = "naive" ]; then
            echo "args=--suppress-upgrade-hooks" >>"$GITHUB_OUTPUT"
          else
            delta=test/upgrade-paths/transitions/8.9-to-8.10/classic-bundled/delta.values.yaml
            test -f "$delta" || { echo "::error::delta not found: $delta"; exit 1; }
            echo "args=--upgrade-delta $delta" >>"$GITHUB_OUTPUT"
          fi

      # Run A is expected to fail: that is the finding, not a broken job. Run B
      # must pass. Both outcomes are reported either way.
      - name: Run upgrade path on cluster
        id: run
        env:
          RDBMS_POSTGRESQL_USERNAME: ${{ steps.test-credentials-secret.outputs.RDBMS_POSTGRESQL_USERNAME }}
          RDBMS_POSTGRESQL_PASSWORD: ${{ steps.test-credentials-secret.outputs.RDBMS_POSTGRESQL_PASSWORD }}
          SHORTNAME: ${{ inputs.cluster-shortname || 'upclas' }}
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/deploy-camunda" matrix run \
            --repo-root . --versions 8.10 \
            --shortname-filter "${SHORTNAME}" --include-disabled \
            --platform gke --ingress-base-domain-gke ci.distro.ultrawombat.com \
            --values-source carryover \
            ${{ steps.delta.outputs.args }} \
            --ensure-docker-registry \
            --delete-namespace --timeout 15 --yes 2>&1 | tee "${RUNNER_TEMP}/run.log"
          echo "exit=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"

      - name: Report outcome
        if: always()
        run: |
          {
            echo "### Cluster stage — ${{ matrix.run }}"
            echo
            grep -E "Step 1 complete|Applied upgrade delta|Suppressed .*hook|Step 2 complete|camunda\]\[error\]|Matrix entry failed|\[PASS\]|\[FAIL\]" \
              "${RUNNER_TEMP}/run.log" | tail -20 | sed 's/^/    /'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce expected outcome
        if: always()
        run: |
          actual="${{ steps.run.outputs.exit }}"
          if [ "${{ matrix.run }}" = "naive" ]; then
            [ "$actual" != "0" ] && echo "Run A failed as expected" && exit 0
            echo "::error::Run A succeeded. Either the carried-over values no longer break, or carryover is not in effect."
            exit 1
          fi
          [ "$actual" = "0" ] && echo "Run B passed" && exit 0
          echo "::error::Run B failed: the documented delta no longer remediates this path."
          exit 1
