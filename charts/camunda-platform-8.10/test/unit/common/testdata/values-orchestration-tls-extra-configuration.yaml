orchestration:
  data:
    secondaryStorage:
      type: elasticsearch
  extraConfiguration:
    - file: tls.yaml
      content: |
        server:
          ssl:
            enabled: true
            certificate: /certs/rest/tls.crt
            certificate-private-key: /certs/rest/tls.key
        camunda:
          api:
            grpc:
              ssl:
                enabled: true
                certificate: /certs/grpc/tls.crt
                certificate-private-key: /certs/grpc/tls.key
