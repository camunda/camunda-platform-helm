orchestration:
  ingress:
    grpc:
      enabled: true
      className: contour
      host: zeebe.example.com
      annotations:
        '{{ "nginx.ingress.kubernetes.io/ssl-redirect" }}': "false"
        '{{ "nginx.ingress.kubernetes.io/backend-protocol" }}': "GRPC"
        '{{ "nginx.ingress.kubernetes.io/proxy-buffer-size" }}': "128k"
