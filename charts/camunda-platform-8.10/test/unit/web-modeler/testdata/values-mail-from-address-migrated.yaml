# from-address migrated to restapi.extraConfiguration (camunda.hub.mail.from-address);
# the deprecated webModeler.restapi.mail.fromAddress is left unset. The chart-rendered
# from-address must be omitted (so the imported file wins) and helm install must not fail.
identity:
  enabled: true
orchestration:
  data:
    secondaryStorage:
      type: elasticsearch
webModeler:
  enabled: true
  restapi:
    extraConfiguration:
      - file: mail.yaml
        content: |
          camunda:
            hub:
              mail:
                from-address: migrated@example.com
