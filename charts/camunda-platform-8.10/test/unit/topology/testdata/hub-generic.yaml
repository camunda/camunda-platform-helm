global:
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: GENERIC
      issuer: https://issuer.example.com
  topology:
    mode: hub
    clusters:
      - id: east
        name: East
        namespace: camunda-east
        releaseName: camunda
        host: east.example.com
        version: 8.10.0
        components:
          orchestration:
            enabled: true
            clientId: orchestration-east
            audience: orchestration-east-api
            redirectUrl: https://east.example.com/orchestration
            secret:
              existingSecret: east-oidc
              existingSecretKey: orchestration-secret
          optimize:
            enabled: true
            clientId: optimize-east
            audience: optimize-east-api
            redirectUrl: https://east.example.com/optimize
            secret:
              existingSecret: east-oidc
              existingSecretKey: optimize-secret
          connectors:
            enabled: true
            clientId: connectors-east
            secret:
              existingSecret: east-oidc
              existingSecretKey: connectors-secret
      - id: west
        name: West
        namespace: camunda-west
        releaseName: camunda-west
        host: west.example.com
        version: 8.10.0
        components:
          orchestration:
            enabled: true
            clientId: orchestration-west
            audience: orchestration-west-api
            redirectUrl: https://west.example.com/orchestration
            secret:
              existingSecret: west-oidc
              existingSecretKey: orchestration-secret

identity:
  enabled: true

camundaHub:
  enabled: true
  restapi:
    mail:
      fromAddress: noreply@example.com
    externalDatabase:
      url: jdbc:postgresql://postgres.example.com/hub
      username: hub
      secret:
        inlineSecret: test
