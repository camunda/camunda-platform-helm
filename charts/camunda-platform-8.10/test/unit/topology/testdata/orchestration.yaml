global:
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: GENERIC
      issuer: https://issuer.example.com
  topology:
    mode: orchestration
    management:
      namespace: camunda-management
      releaseName: camunda
      identityContextPath: /identity
    cluster:
      id: east
      components:
        orchestration:
          enabled: true
          clientId: orchestration-east
          audience: orchestration-east-api
          redirectUrl: https://east.example.com/orchestration
          secret:
            existingSecret: east-oidc
            existingSecretKey: orchestration-secret
        optimize:
          enabled: true
          clientId: optimize-east
          audience: optimize-east-api
          redirectUrl: https://east.example.com/optimize
          secret:
            existingSecret: east-oidc
            existingSecretKey: optimize-secret
        connectors:
          enabled: true
          clientId: connectors-east
          secret:
            existingSecret: east-oidc
            existingSecretKey: connectors-secret

orchestration:
  data:
    secondaryStorage:
      type: elasticsearch
      elasticsearch:
        url: http://elasticsearch.example.com:9200
