---
# Source: internal-postgresql/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: camunda-platform-test-internal-postgresql
  labels:
    app.kubernetes.io/name: internal-postgresql
    app.kubernetes.io/instance: camunda-platform-test
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/version: "16"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: camunda-platform-test-internal-postgresql
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-postgresql
      app.kubernetes.io/instance: camunda-platform-test
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-postgresql
        app.kubernetes.io/instance: camunda-platform-test
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: docker.io/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "identity"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda-platform-test-internal-postgresql
                  key: postgresql-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "app"
                - -d
                - "identity"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "app"
                - -d
                - "identity"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: camunda-platform-test-internal-postgresql-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: internal-postgresql
          app.kubernetes.io/instance: camunda-platform-test
          app.kubernetes.io/component: postgresql
          app.kubernetes.io/version: "16"
          app.kubernetes.io/managed-by: Helm
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "1Gi"
