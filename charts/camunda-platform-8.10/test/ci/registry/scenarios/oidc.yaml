name: oidc
auth: oidc
flows:
  - install
identity: oidc
persistence: elasticsearch
features:
  - postgresql-companion
  - hub-ping
platforms:
  - gke
exclude:
  - identity
  - console
  - orchestration-grpc
infra-type:
  eks: preemptible
  gke: distroci
skip-e2e: true
post-deploy: hub-ping
dependencies:
  - postgresql
  - elasticsearch
