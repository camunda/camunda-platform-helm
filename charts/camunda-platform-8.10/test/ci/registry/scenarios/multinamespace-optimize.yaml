name: multinamespace-optimize
auth: keycloak
flows:
  - install
platforms:
  - gke
infra-type:
  gke: distroci
topology:
  name: hub-2orch-2optimize
  shared-storage: elasticsearch
  shared-storage-service: elasticsearch-master
  releases:
    - role: hub
      namespace-suffix: hub
      identity: keycloak
      dependencies:
        - keycloak
        - postgresql
        - elasticsearch
      features:
        - multinamespace-reset-clients
        - multinamespace-optimize-hub
    - role: orchestration
      namespace-suffix: orcha
      modeler-cluster-id: orcha
      modeler-cluster-name: Orchestration A
      identity: keycloak-external
      persistence: elasticsearch-external
      dependencies: []
      features:
        - multinamespace-optimize-orchestration
      depends-on: hub
      env:
        ORCH_ORCHESTRATION_CLIENT_ID: orchestration-orcha
        ORCH_ORCHESTRATION_AUDIENCE: orchestration-orcha-api
        ORCH_CONNECTORS_CLIENT_ID: connectors-orcha
    - role: orchestration
      namespace-suffix: orchb
      modeler-cluster-id: orchb
      modeler-cluster-name: Orchestration B
      identity: keycloak-external
      persistence: elasticsearch-external
      dependencies: []
      features:
        - multinamespace-optimize-orchestration
      depends-on: hub
      env:
        ORCH_ORCHESTRATION_CLIENT_ID: orchestration-orchb
        ORCH_ORCHESTRATION_AUDIENCE: orchestration-orchb-api
        ORCH_CONNECTORS_CLIENT_ID: connectors-orchb
    - role: optimize
      namespace-suffix: opta
      serves: orcha
      optimize-context-path: /optimize-orcha
      identity: keycloak-external-optimize
      persistence: elasticsearch-external
      dependencies: []
      features:
        - multinamespace-optimize-a
      depends-on: hub
    - role: optimize
      namespace-suffix: optb
      serves: orchb
      optimize-context-path: /optimize-orchb
      identity: keycloak-external-optimize
      persistence: elasticsearch-external
      dependencies: []
      features:
        - multinamespace-optimize-b
      depends-on: hub
