# Orchestration namespace layer for the multinamespace topology (8.10)
# Selected as a Feature layer (values/features/multinamespace-orchestration.yaml)
# rather than an ExtraValues file so its EXTERNAL_ELASTICSEARCH_* placeholders
# go through the normal per-layer env var substitution pipeline — ExtraValues
# files are NOT substituted (see
# scripts/deploy-camunda/deploy/values.go's BuildValuesChain). Feeding this
# through ExtraValues was the root cause of the "EXTERNAL_ELASTICSEARCH_HOST
# does not exist" live-GKE failure this fix addresses.
#
# NOTE: avoid writing literal dollar-brace placeholder syntax in prose
# comments in this file — the env var scanner (os.Expand-based) matches it
# anywhere in the raw file content, including comments, and a malformed
# match will be reported as a "missing required environment variable" at
# prepare-values / deploy time. Reference placeholder names in plain text
# instead (as above); the real placeholder syntax appears only in actual
# values below.
#
# Orchestration release — Zeebe/Operate/Tasklist,
# Connectors, and Optimize only. The Identity/Keycloak wiring pointed at the
# Hub namespace is owned by identity/keycloak-external.yaml (this release's
# `identity` layer selection — see the scenario's topology block) so it is not
# duplicated here.
#
# Optimize's own client and the topology mode DO live here rather than in that
# auth layer, because this topology runs Optimize inside the orchestration
# release while multinamespace-optimize and physicaltenants give each Optimize
# its own release. The shared auth layer cannot express both.
#
# The secondary storage backend is the Elasticsearch companion deployed once
# into the Hub namespace (shared-storage: elasticsearch in the
# scenario's topology block), referenced here by FQDN via the
# EXTERNAL_ELASTICSEARCH_* env vars, resolved the same way persistence/
# elasticsearch-external.yaml resolves them for a single-namespace scenario.

global:
  topology:
    mode: orchestration
  identity:
    auth:
      optimize:
        clientId: "${ORCH_OPTIMIZE_CLIENT_ID}"
        audience: "${ORCH_OPTIMIZE_AUDIENCE}"
        redirectUrl: "https://${ORCH_HOST}/optimize"
        secret:
          existingSecret: integration-test-credentials
          existingSecretKey: identity-optimize-client-token

orchestration:
  env:
    - name: CAMUNDA_HUB_PING_CLUSTERNAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  hub:
    ping:
      endpoint: "http://integration-web-modeler-restapi.${HUB_NAMESPACE}/modeler/api/v1/clusters"
      credentials:
        tokenEndpoint: "https://${HUB_HOST}/auth/realms/camunda-platform/protocol/openid-connect/token"
  extraConfiguration:
    - file: hub-ping.yaml
      content: |
        camunda:
          hub:
            ping:
              enabled: true
              pingPeriod: 5s
              properties:
                verification: inherited-oidc-credentials
  data:
    secondaryStorage:
      type: elasticsearch
      elasticsearch:
        url: "${EXTERNAL_ELASTICSEARCH_SCHEME}://${EXTERNAL_ELASTICSEARCH_HOST}:${EXTERNAL_ELASTICSEARCH_PORT}"
  index:
    prefix: $ORCHESTRATION_INDEX_PREFIX
  exporters:
    zeebe:
      # Writer side: the indices the legacy exporter creates. Optimize runs in
      # this same release, so it reads them back via the matching
      # optimize.database.elasticsearch.prefix below.
      index:
        prefix: $ORCHESTRATION_INDEX_PREFIX

optimize:
  # base.yaml already enables Optimize and sets its contextPath and probes; this
  # release keeps it in-release, so only the storage and reader prefix are added.
  enabled: true
  database:
    elasticsearch:
      enabled: true
      prefix: $ORCHESTRATION_INDEX_PREFIX
  env:
    - name: CAMUNDA_OPTIMIZE_ELASTICSEARCH_SETTINGS_INDEX_PREFIX
      value: $OPTIMIZE_INDEX_PREFIX

connectors:
  enabled: true
