# Hub namespace layer for the physicaltenants topology (8.10).
#
# One Orchestration Cluster whose default tenant and two named Physical Tenants
# each run their own Optimize release.
#
# NOTE: avoid writing literal dollar-brace placeholder syntax in prose comments
# in this file — the env var scanner (os.Expand-based) matches it anywhere in the
# raw file content, including comments. Reference placeholder names in plain text
# instead; the real placeholder syntax appears only in actual values below.

global:
  elasticsearch:
    enabled: false
  identity:
    auth:
      orchestration:
        hubPingAuthorizationEnabled: true
  topology:
    mode: hub
    clusters:
      - id: orcha
        name: Orchestration A
        namespace: "${ORCHA_NAMESPACE}"
        releaseName: integration
        host: "${ORCHA_HOST}"
        version: "8.10.0-alpha3"
        contextPaths:
          orchestration: /orchestration
          optimize: "${OPTDEFAULT_OPTIMIZE_CONTEXT_PATH}"
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orcha
            audience: orchestration-orcha-api
            redirectUrl: "https://${ORCHA_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orcha-default
            audience: optimize-orcha-default-api
            redirectUrl: "https://${HUB_HOST}${OPTDEFAULT_OPTIMIZE_CONTEXT_PATH}"
            roleName: Optimize Orchestration A default
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-default-client-token
          connectors:
            enabled: true
            clientId: connectors-orcha
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
        physicalTenants:
          - id: tenanta
            components:
              optimize:
                enabled: true
                clientId: optimize-orcha-tenanta
                audience: optimize-orcha-tenanta-api
                redirectUrl: "https://${HUB_HOST}${OPTTA_OPTIMIZE_CONTEXT_PATH}"
                roleName: Optimize Orchestration A tenanta
                secret:
                  existingSecret: integration-test-credentials
                  existingSecretKey: identity-optimize-tenanta-client-token
          - id: tenantb
            components:
              optimize:
                enabled: true
                clientId: optimize-orcha-tenantb
                audience: optimize-orcha-tenantb-api
                redirectUrl: "https://${HUB_HOST}${OPTTB_OPTIMIZE_CONTEXT_PATH}"
                roleName: Optimize Orchestration A tenantb
                secret:
                  existingSecret: integration-test-credentials
                  existingSecretKey: identity-optimize-tenantb-client-token

identity:
  clients:
    - id: venom
      name: Venom
      secret:
        existingSecret: integration-test-credentials
        existingSecretKey: identity-admin-client-password
      redirectUris: /dummy
      rootUrl: http://dummy
      type: confidential
      permissions:
        - resourceServerId: camunda-identity-resource-server
          definition: read
        - resourceServerId: camunda-identity-resource-server
          definition: write
        - resourceServerId: orchestration-orcha-api
          definition: read:*
        - resourceServerId: orchestration-orcha-api
          definition: write:*
        - resourceServerId: optimize-orcha-default-api
          definition: write:*
        - resourceServerId: optimize-orcha-tenanta-api
          definition: write:*
        - resourceServerId: optimize-orcha-tenantb-api
          definition: write:*
        - resourceServerId: web-modeler-api
          definition: write:*
