# Orchestration namespace layer for the dogfood topology's "pt" cluster (8.10).
#
# Two Physical Tenants beside the always-present default tenant, each with its
# own Optimize release (features/dogfood-optimize-pt-*.yaml). Logical
# multi-tenancy is set at the cluster root and applies to every Physical
# Tenant: the orchestration cluster rejects per-tenant security.multiTenancy.
#
# NOTE: avoid writing literal dollar-brace placeholder syntax in prose comments
# in this file — the env var scanner (os.Expand-based) matches it anywhere in
# the raw file content, including comments. Reference placeholder names in plain
# text instead; the real placeholder syntax appears only in actual values below.
#
# Tenant index prefixes are derived from this release's own
# ORCHESTRATION_INDEX_PREFIX so each Optimize release can reconstruct them from
# the topology driver's PT_ORCHESTRATION_INDEX_PREFIX cross-ref env without a
# second source of truth.

global:
  topology:
    mode: orchestration
  identity:
    auth:
      # The exact "iss" the Hub's Keycloak mints. Required once Physical Tenants
      # are configured: the cluster then validates "iss" on every token, and the
      # chart deliberately does not infer this from publicIssuerUrl. The
      # keycloak-fixed-issuer dependency pins KC_HOSTNAME to this same value.
      issuer: "https://${HUB_HOST}/auth/realms/camunda-platform"

orchestration:
  multitenancy:
    checks:
      enabled: true
    api:
      enabled: true
  hub:
    ping:
      endpoint: "http://integration-web-modeler-restapi.${HUB_NAMESPACE}/modeler/api/v1/clusters"
      credentials:
        tokenEndpoint: "https://${HUB_HOST}/auth/realms/camunda-platform/protocol/openid-connect/token"
  data:
    secondaryStorage:
      type: elasticsearch
      elasticsearch:
        url: "${EXTERNAL_ELASTICSEARCH_SCHEME}://${EXTERNAL_ELASTICSEARCH_HOST}:${EXTERNAL_ELASTICSEARCH_PORT}"
  index:
    prefix: $ORCHESTRATION_INDEX_PREFIX
  exporters:
    zeebe:
      enabled: true
      # Serves the default Physical Tenant. Each declared tenant carries its own
      # exporter prefix in the extraConfiguration file below.
      index:
        prefix: $ORCHESTRATION_INDEX_PREFIX
  extraConfiguration:
    - file: hub-ping.yaml
      content: |
        camunda:
          hub:
            ping:
              enabled: true
              pingPeriod: 30s
              properties:
                verification: inherited-oidc-credentials
    - file: physical-tenants.yaml
      content: |
        camunda:
          physical-tenants:
            # The default tenant needs an explicit exporter: declaring any
            # tenant stops it inheriting zeebe.broker.exporters from the root,
            # and it would then silently stop exporting the records its own
            # Optimize reads. Its prefix is the root prefix, distinct from every
            # tenant's.
            default:
              data:
                exporters-assigned:
                  - elasticsearch
                exporters:
                  elasticsearch:
                    className: "io.camunda.zeebe.exporter.ElasticsearchExporter"
                    args:
                      url: "${EXTERNAL_ELASTICSEARCH_SCHEME}://${EXTERNAL_ELASTICSEARCH_HOST}:${EXTERNAL_ELASTICSEARCH_PORT}"
                      index:
                        prefix: "${ORCHESTRATION_INDEX_PREFIX}"
                        numberOfReplicas: "1"
              security:
                authentication:
                  providers:
                    assigned:
                      - oidc
                initialization:
                  default-roles:
                    admin:
                      clients:
                        - venom
                      users:
                        - demo
            tenanta:
              data:
                secondary-storage:
                  elasticsearch:
                    index-prefix: "${ORCHESTRATION_INDEX_PREFIX}-ta"
                exporters-assigned:
                  - elasticsearch
                exporters:
                  elasticsearch:
                    className: "io.camunda.zeebe.exporter.ElasticsearchExporter"
                    args:
                      url: "${EXTERNAL_ELASTICSEARCH_SCHEME}://${EXTERNAL_ELASTICSEARCH_HOST}:${EXTERNAL_ELASTICSEARCH_PORT}"
                      index:
                        prefix: "${ORCHESTRATION_INDEX_PREFIX}-ta"
                        numberOfReplicas: "1"
              security:
                authorizations:
                  enabled: true
                authentication:
                  providers:
                    assigned:
                      - oidc
                initialization:
                  default-roles:
                    admin:
                      clients:
                        - venom
                      users:
                        - demo
            tenantb:
              data:
                secondary-storage:
                  elasticsearch:
                    index-prefix: "${ORCHESTRATION_INDEX_PREFIX}-tb"
                exporters-assigned:
                  - elasticsearch
                exporters:
                  elasticsearch:
                    className: "io.camunda.zeebe.exporter.ElasticsearchExporter"
                    args:
                      url: "${EXTERNAL_ELASTICSEARCH_SCHEME}://${EXTERNAL_ELASTICSEARCH_HOST}:${EXTERNAL_ELASTICSEARCH_PORT}"
                      index:
                        prefix: "${ORCHESTRATION_INDEX_PREFIX}-tb"
                        numberOfReplicas: "1"
              security:
                authentication:
                  providers:
                    assigned:
                      - oidc
                initialization:
                  default-roles:
                    admin:
                      clients:
                        - venom
                      users:
                        - demo

optimize:
  enabled: false

connectors:
  enabled: true
