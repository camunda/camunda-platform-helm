# Contour: the split Ingress forces HTTPS to the backend only through an nginx annotation.
optimize:
  service:
    annotations:
      projectcontour.io/upstream-protocol.tls: "80"
global:
  tls:
    optimize:
      enabled: true
      type: pkcs12
      cert:
        secret:
          existingSecret: optimize-tls-keystore
          existingSecretKey: keystore.p12
      keystorePassword:
        secret:
          existingSecretKey: keystore-password
