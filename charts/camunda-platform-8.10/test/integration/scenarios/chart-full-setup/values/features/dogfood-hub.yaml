# Hub namespace layer for the dogfood topology (8.10).
#
# One shared Hub plane (Management Identity, Camunda Hub, Web Modeler, Keycloak,
# Elasticsearch) fronting three Orchestration Clusters:
#   plain - no Physical Tenants, no logical multi-tenancy
#   mt    - no Physical Tenants, logical multi-tenancy enabled
#   pt    - two Physical Tenants beside default, logical multi-tenancy cluster-wide
#
# Every Optimize runs as its own release on the Hub ingress host, so each
# cluster record's optimize entry describes only that cluster's default tenant
# and each Physical Tenant registers its own Optimize under physicalTenants.
# The chart defaults an optimize entry's webapp and readiness URLs to the
# cluster's own host and namespace, so each entry sets both explicitly.
#
# NOTE: avoid writing literal dollar-brace placeholder syntax in prose comments
# in this file — the env var scanner (os.Expand-based) matches it anywhere in the
# raw file content, including comments. Reference placeholder names in plain text
# instead; the real placeholder syntax appears only in actual values below.

global:
  # Hub hardening objects. Shell in these manifests avoids the dollar sign: the
  # values pipeline substitutes every dollar placeholder before Helm sees it.
  extraManifests:
    # Keycloak's admin console, admin REST API and master realm are not
    # reachable from the internet. More specific than the chart's /auth/ path,
    # these routes go to a Service with no endpoints, so ingress-nginx answers
    # 503 itself; unlike a source-IP allowlist, no forwarded header can bypass it.
    # Operators reach the console with kubectl port-forward svc/keycloak.
    - |
      apiVersion: v1
      kind: Service
      metadata:
        name: keycloak-admin-blocked
      spec:
        ports:
          - name: http
            port: 80
    - |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: keycloak-admin-blocked
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        ingressClassName: nginx
        tls:
          - hosts: ["${HUB_HOST}"]
            secretName: camunda-platform
        rules:
          - host: "${HUB_HOST}"
            http:
              paths:
                - path: /auth/admin
                  pathType: Prefix
                  backend:
                    service: {name: keycloak-admin-blocked, port: {name: http}}
                - path: /auth/realms/master
                  pathType: Prefix
                  backend:
                    service: {name: keycloak-admin-blocked, port: {name: http}}
    # Single-replica stateful pods: a budget of one keeps the cluster autoscaler
    # from evicting them to scale a node down. Elasticsearch has its own, from
    # its chart.
    - |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: keycloak
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: internal-keycloak
            app.kubernetes.io/component: keycloak
    - |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: keycloak-postgresql
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: internal-keycloak
            app.kubernetes.io/component: postgresql
    - |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: postgresql
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: internal-postgresql
    # Keycloak realm hardening, re-applied after every install and upgrade:
    # brute-force lockout and a minimum password length on both realms. Keycloak
    # stores these in its database, so no chart value can set them.
    - |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: keycloak-realm-hardening
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 900
        ttlSecondsAfterFinished: 86400
        template:
          spec:
            restartPolicy: Never
            nodeSelector:
              workload: distroci
            tolerations:
              - {key: workload, operator: Equal, value: distroci, effect: NoSchedule}
            securityContext:
              runAsNonRoot: true
            containers:
              - name: kcadm
                image: quay.io/keycloak/keycloak:26.3.3
                env:
                  - {name: HOME, value: /tmp}
                command: ["/bin/bash", "-ec"]
                args:
                  - |
                    until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak/auth --realm master --user admin --password "`cat /credentials/keycloak-admin-password`"; do sleep 10; done
                    until /opt/keycloak/bin/kcadm.sh get realms/camunda-platform --fields realm >/dev/null; do sleep 10; done
                    /opt/keycloak/bin/kcadm.sh update realms/master -s bruteForceProtected=true -s permanentLockout=false -s failureFactor=10 -s waitIncrementSeconds=60 -s maxFailureWaitSeconds=900 -s maxDeltaTimeSeconds=43200 -s 'passwordPolicy=length(12) and notUsername'
                    /opt/keycloak/bin/kcadm.sh update realms/camunda-platform -s bruteForceProtected=true -s permanentLockout=false -s failureFactor=10 -s waitIncrementSeconds=60 -s maxFailureWaitSeconds=900 -s maxDeltaTimeSeconds=43200 -s 'passwordPolicy=length(12) and notUsername'
                    echo "realms hardened"
                volumeMounts:
                  - name: credentials
                    mountPath: /credentials
                    readOnly: true
            volumes:
              - name: credentials
                secret:
                  secretName: integration-test-credentials
                  items:
                    - key: identity-keycloak-admin-password
                      path: keycloak-admin-password
  identity:
    auth:
      orchestration:
        hubPingAuthorizationEnabled: true
  topology:
    mode: hub
    clusters:
      - id: plain
        name: Dogfood Plain
        namespace: "${PLAIN_NAMESPACE}"
        releaseName: integration
        host: "${PLAIN_HOST}"
        version: "8.10-SNAPSHOT"
        contextPaths:
          orchestration: /orchestration
          optimize: "${OPTPLAIN_OPTIMIZE_CONTEXT_PATH}"
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-plain
            audience: orchestration-plain-api
            redirectUrl: "https://${PLAIN_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            webappUrl: "https://${HUB_HOST}${OPTPLAIN_OPTIMIZE_CONTEXT_PATH}"
            readinessUrl: "http://integration-optimize.${OPTPLAIN_NAMESPACE}.svc.cluster.local:80${OPTPLAIN_OPTIMIZE_CONTEXT_PATH}/api/readyz"
            clientId: optimize-plain
            audience: optimize-plain-api
            roleName: Optimize Dogfood Plain
            redirectUrl: "https://${HUB_HOST}${OPTPLAIN_OPTIMIZE_CONTEXT_PATH}"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-plain
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: mt
        name: Dogfood Multitenancy
        namespace: "${MT_NAMESPACE}"
        releaseName: integration
        host: "${MT_HOST}"
        version: "8.10-SNAPSHOT"
        contextPaths:
          orchestration: /orchestration
          optimize: "${OPTMT_OPTIMIZE_CONTEXT_PATH}"
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-mt
            audience: orchestration-mt-api
            redirectUrl: "https://${MT_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            webappUrl: "https://${HUB_HOST}${OPTMT_OPTIMIZE_CONTEXT_PATH}"
            readinessUrl: "http://integration-optimize.${OPTMT_NAMESPACE}.svc.cluster.local:80${OPTMT_OPTIMIZE_CONTEXT_PATH}/api/readyz"
            clientId: optimize-mt
            audience: optimize-mt-api
            roleName: Optimize Dogfood Multitenancy
            redirectUrl: "https://${HUB_HOST}${OPTMT_OPTIMIZE_CONTEXT_PATH}"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-mt
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: pt
        name: Dogfood Physical Tenants
        namespace: "${PT_NAMESPACE}"
        releaseName: integration
        host: "${PT_HOST}"
        version: "8.10-SNAPSHOT"
        contextPaths:
          orchestration: /orchestration
          optimize: "${OPTPTDEF_OPTIMIZE_CONTEXT_PATH}"
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-pt
            audience: orchestration-pt-api
            redirectUrl: "https://${PT_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            webappUrl: "https://${HUB_HOST}${OPTPTDEF_OPTIMIZE_CONTEXT_PATH}"
            readinessUrl: "http://integration-optimize.${OPTPTDEF_NAMESPACE}.svc.cluster.local:80${OPTPTDEF_OPTIMIZE_CONTEXT_PATH}/api/readyz"
            clientId: optimize-pt-default
            audience: optimize-pt-default-api
            roleName: Optimize Dogfood pt default
            redirectUrl: "https://${HUB_HOST}${OPTPTDEF_OPTIMIZE_CONTEXT_PATH}"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-default-client-token
          connectors:
            enabled: true
            clientId: connectors-pt
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
        physicalTenants:
          - id: tenanta
            components:
              optimize:
                enabled: true
                clientId: optimize-pt-tenanta
                audience: optimize-pt-tenanta-api
                roleName: Optimize Dogfood pt tenanta
                redirectUrl: "https://${HUB_HOST}${OPTPTTA_OPTIMIZE_CONTEXT_PATH}"
                secret:
                  existingSecret: integration-test-credentials
                  existingSecretKey: identity-optimize-tenanta-client-token
          - id: tenantb
            components:
              optimize:
                enabled: true
                clientId: optimize-pt-tenantb
                audience: optimize-pt-tenantb-api
                roleName: Optimize Dogfood pt tenantb
                redirectUrl: "https://${HUB_HOST}${OPTPTTB_OPTIMIZE_CONTEXT_PATH}"
                secret:
                  existingSecret: integration-test-credentials
                  existingSecretKey: identity-optimize-tenantb-client-token

identity:
  # identity/keycloak.yaml waits on /auth/, which Keycloak redirects to the admin
  # console on its public hostname; that path is blocked here, so wait on the
  # master realm over the internal Service instead, which answers without a
  # redirect.
  initContainers:
    - name: wait-for-keycloak
      image: busybox:1.36
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak at keycloak:80/auth/realms/master ..."
          until wget -q --spider --timeout=2 "http://keycloak:80/auth/realms/master"; do
            sleep 2
          done
          echo "Keycloak is ready"
  # The hub PostgreSQL companion (postgresql-dogfood) reads this same key.
  externalDatabase:
    username: app
    secret:
      inlineSecret: ""
      existingSecret: integration-test-credentials
      existingSecretKey: identity-postgresql-user-password
  clients:
    - id: venom
      name: Venom
      secret:
        existingSecret: integration-test-credentials
        existingSecretKey: identity-admin-client-password
      redirectUris: /dummy
      rootUrl: http://dummy
      type: confidential
      permissions:
        - resourceServerId: camunda-identity-resource-server
          definition: read
        - resourceServerId: camunda-identity-resource-server
          definition: write
        - resourceServerId: orchestration-plain-api
          definition: read:*
        - resourceServerId: orchestration-plain-api
          definition: write:*
        - resourceServerId: optimize-plain-api
          definition: write:*
        - resourceServerId: orchestration-mt-api
          definition: read:*
        - resourceServerId: orchestration-mt-api
          definition: write:*
        - resourceServerId: optimize-mt-api
          definition: write:*
        - resourceServerId: orchestration-pt-api
          definition: read:*
        - resourceServerId: orchestration-pt-api
          definition: write:*
        - resourceServerId: optimize-pt-default-api
          definition: write:*
        - resourceServerId: optimize-pt-tenanta-api
          definition: write:*
        - resourceServerId: optimize-pt-tenantb-api
          definition: write:*
        - resourceServerId: web-modeler-api
          definition: write:*

webModeler:
  restapi:
    externalDatabase:
      username: app
      secret:
        inlineSecret: ""
        existingSecret: integration-test-credentials
        existingSecretKey: identity-postgresql-user-password
