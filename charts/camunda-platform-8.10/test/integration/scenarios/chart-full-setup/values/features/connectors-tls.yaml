# Contour: the split Ingress forces HTTPS to the backend only through an nginx annotation.
connectors:
  service:
    annotations:
      projectcontour.io/upstream-protocol.tls: "8080"
global:
  tls:
    connectors:
      enabled: true
      type: pkcs12
      keyAlias: connectors-rest
      cert:
        secret:
          existingSecret: connectors-tls-keystore
          existingSecretKey: keystore.p12
      keystorePassword:
        secret:
          existingSecretKey: keystore-password
