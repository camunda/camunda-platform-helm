global:
  documentStore:
    activeStoreId: aws
    type:
      aws:
        enabled: true
        storeId: aws
        bucket: documents
        region: us-east-1
        endpoint: http://documentstore-minio:9000
        forcePathStyle: true
        chunkedEncodingEnabled: false
        accessKeyId:
          secret:
            existingSecret: documentstore-minio
            existingSecretKey: access-key
        secretAccessKey:
          secret:
            existingSecret: documentstore-minio
            existingSecretKey: secret-key

identity:
  enabled: false

connectors:
  enabled: false

webModeler:
  enabled: false

camundaHub:
  enabled: false

console:
  enabled: false

optimize:
  enabled: false
