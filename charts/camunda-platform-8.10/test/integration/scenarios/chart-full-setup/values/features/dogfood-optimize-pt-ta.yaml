# Optimize-only release for Physical Tenant tenanta (dogfood topology, 8.10).
#
# global.topology.mode=optimize gates every other component off, so this file
# carries no enabled: false block.
#
# NOTE: avoid writing literal dollar-brace placeholder syntax in prose comments
# in this file — the env var scanner (os.Expand-based) matches it anywhere in the
# raw file content, including comments. Reference placeholder names in plain text
# instead; the real placeholder syntax appears only in actual values below.
#
# Two distinct index prefixes are required:
#   SERVED_ORCHESTRATION_INDEX_PREFIX - the prefix of the orchestration release
#     named by this release's topology "serves" key, whose zeebe-record indices
#     this Optimize reads.
#   OPTIMIZE_INDEX_PREFIX - this release's own Optimize indices, derived from
#     its namespace so no two Optimizes share index space.

global:
  topology:
    mode: optimize

optimize:
  enabled: true
  # This release has no local Orchestration Service to satisfy the common waiter.
  initContainers: []
  livenessProbe:
    enabled: true
  security:
    authentication:
      oidc:
        clientId: "optimize-pt-tenanta"
        audience: "optimize-pt-tenanta-api"
        redirectUrl: "https://${HUB_HOST}${RELEASE_OPTIMIZE_CONTEXT_PATH}"
        secret:
          existingSecret: integration-test-credentials
          existingSecretKey: identity-optimize-tenanta-client-token
  contextPath: "${RELEASE_OPTIMIZE_CONTEXT_PATH}"
  database:
    elasticsearch:
      enabled: true
      external: true
      url:
        protocol: "${EXTERNAL_ELASTICSEARCH_SCHEME}"
        host: "${EXTERNAL_ELASTICSEARCH_HOST}"
      prefix: "${SERVED_ORCHESTRATION_INDEX_PREFIX}-ta"
  env:
    - name: CAMUNDA_OPTIMIZE_ELASTICSEARCH_SETTINGS_INDEX_PREFIX
      value: "${OPTIMIZE_INDEX_PREFIX}-tenanta"
