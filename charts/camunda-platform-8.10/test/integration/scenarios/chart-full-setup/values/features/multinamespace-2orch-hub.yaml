# Hub namespace layer for the two-orchestration topology (8.10).
#
# The hub release owns Identity, Console, Web Modeler and the bundled
# Keycloak/PostgreSQL/Elasticsearch. Orchestration, Optimize and Connectors live
# in the orchestration releases (orcha, orchb, orchc, orchd), so they must be
# switched off here: base.yaml turns them on for every scenario, and nothing
# else in this release's layer chain disables them.
#
# Web Modeler additionally needs dynamic cluster management so the topology
# clusters are surfaced in the UI. Without it the Modeler home page never
# renders its project controls and the topology-orchestration smoke test times
# out in waitForModelerReady.
#
# NOTE: avoid writing literal dollar-sign placeholder syntax in prose comments
# in this file - the env var scanner (os.Expand-based) matches it anywhere in
# the raw file content, including comments, and an unset name is reported as a
# "missing required environment variable" at prepare-values / deploy time.

orchestration:
  enabled: false

webModeler:
  restapi:
    extraConfiguration:
      - file: dynamic-cluster-management.yaml
        content: |
          camunda:
            modeler:
              feature:
                dynamic-cluster-management-enabled: true

optimize:
  enabled: false

connectors:
  enabled: false

global:
  identity:
    auth:
      orchestration:
        hubPingAuthorizationEnabled: true
  topology:
    mode: hub
    clusters:
      - id: orcha
        name: Orchestration A
        namespace: "${ORCHA_NAMESPACE}"
        releaseName: integration
        host: "${ORCHA_HOST}"
        version: "8.10.0-alpha5"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orcha
            audience: orchestration-orcha-api
            redirectUrl: "https://${ORCHA_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orcha
            audience: optimize-orcha-api
            redirectUrl: "https://${ORCHA_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orcha
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: orchb
        name: Orchestration B
        namespace: "${ORCHB_NAMESPACE}"
        releaseName: integration
        host: "${ORCHB_HOST}"
        version: "8.9.18"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orchb
            audience: orchestration-orchb-api
            redirectUrl: "https://${ORCHB_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orchb
            audience: optimize-orchb-api
            redirectUrl: "https://${ORCHB_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orchb
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: orchc
        name: Orchestration C
        namespace: "${ORCHC_NAMESPACE}"
        releaseName: integration
        host: "${ORCHC_HOST}"
        version: "8.8.17"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orchc
            audience: orchestration-orchc-api
            redirectUrl: "https://${ORCHC_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orchc
            audience: optimize-orchc-api
            redirectUrl: "https://${ORCHC_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orchc
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token

identity:
  clients:
    - id: venom
      name: Venom
      secret:
        existingSecret: integration-test-credentials
        existingSecretKey: identity-admin-client-password
      redirectUris: /dummy
      rootUrl: http://dummy
      type: confidential
      permissions:
        - resourceServerId: camunda-identity-resource-server
          definition: read
        - resourceServerId: camunda-identity-resource-server
          definition: write
        - resourceServerId: orchestration-orcha-api
          definition: read:*
        - resourceServerId: orchestration-orcha-api
          definition: write:*
        - resourceServerId: optimize-orcha-api
          definition: write:*
        - resourceServerId: orchestration-orchb-api
          definition: read:*
        - resourceServerId: orchestration-orchb-api
          definition: write:*
        - resourceServerId: optimize-orchb-api
          definition: write:*
        - resourceServerId: orchestration-orchc-api
          definition: read:*
        - resourceServerId: orchestration-orchc-api
          definition: write:*
        - resourceServerId: optimize-orchc-api
          definition: write:*
        - resourceServerId: web-modeler-api
          definition: write:*
