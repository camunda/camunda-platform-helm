global:
  identity:
    auth:
      orchestration:
        hubPingAuthorizationEnabled: true
  topology:
    mode: hub
    clusters:
      - id: orcha
        name: Orchestration A
        namespace: "${ORCHA_NAMESPACE}"
        releaseName: integration
        host: "${ORCHA_HOST}"
        version: "8.10.0-alpha5"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orcha
            audience: orchestration-orcha-api
            redirectUrl: "https://${ORCHA_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orcha
            audience: optimize-orcha-api
            redirectUrl: "https://${ORCHA_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orcha
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: orchb
        name: Orchestration B
        namespace: "${ORCHB_NAMESPACE}"
        releaseName: integration
        host: "${ORCHB_HOST}"
        version: "8.9.18"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orchb
            audience: orchestration-orchb-api
            redirectUrl: "https://${ORCHB_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orchb
            audience: optimize-orchb-api
            redirectUrl: "https://${ORCHB_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orchb
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: orchc
        name: Orchestration C
        namespace: "${ORCHC_NAMESPACE}"
        releaseName: integration
        host: "${ORCHC_HOST}"
        version: "8.8.17"
        contextPaths:
          orchestration: /orchestration
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orchc
            audience: orchestration-orchc-api
            redirectUrl: "https://${ORCHC_HOST}/orchestration"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orchc
            audience: optimize-orchc-api
            redirectUrl: "https://${ORCHC_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orchc
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token
      - id: orchd
        name: Orchestration D
        namespace: "${ORCHD_NAMESPACE}"
        releaseName: integration
        host: "${ORCHD_HOST}"
        version: "8.7.38"
        architecture: legacy
        contextPaths:
          orchestration: ""
          optimize: /optimize
          connectors: /connectors
        components:
          orchestration:
            enabled: true
            clientId: orchestration-orchd
            audience: orchestration-orchd-api
            redirectUrl: "https://${ORCHD_HOST}"
            serviceName: integration-zeebe
            gatewayServiceName: integration-zeebe-gateway
            operateServiceName: integration-operate
            tasklistServiceName: integration-tasklist
            restUrl: "http://integration-zeebe-gateway.${ORCHD_NAMESPACE}.svc.cluster.local:8080/zeebe"
            readinessUrl: "http://integration-zeebe-gateway.${ORCHD_NAMESPACE}.svc.cluster.local:9600/zeebe/actuator/health/readiness"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-orchestration-client-token
          optimize:
            enabled: true
            clientId: optimize-orchd
            audience: optimize-orchd-api
            redirectUrl: "https://${ORCHD_HOST}/optimize"
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-optimize-client-token
          connectors:
            enabled: true
            clientId: connectors-orchd
            secret:
              existingSecret: integration-test-credentials
              existingSecretKey: identity-connectors-client-token

identity:
  clients:
    - id: venom
      name: Venom
      secret:
        existingSecret: integration-test-credentials
        existingSecretKey: identity-admin-client-password
      redirectUris: /dummy
      rootUrl: http://dummy
      type: confidential
      permissions:
        - resourceServerId: camunda-identity-resource-server
          definition: read
        - resourceServerId: camunda-identity-resource-server
          definition: write
        - resourceServerId: orchestration-orcha-api
          definition: read:*
        - resourceServerId: orchestration-orcha-api
          definition: write:*
        - resourceServerId: optimize-orcha-api
          definition: write:*
        - resourceServerId: orchestration-orchb-api
          definition: read:*
        - resourceServerId: orchestration-orchb-api
          definition: write:*
        - resourceServerId: optimize-orchb-api
          definition: write:*
        - resourceServerId: orchestration-orchc-api
          definition: read:*
        - resourceServerId: orchestration-orchc-api
          definition: write:*
        - resourceServerId: optimize-orchc-api
          definition: write:*
        - resourceServerId: orchestration-orchd-api
          definition: read:*
        - resourceServerId: orchestration-orchd-api
          definition: write:*
        - resourceServerId: optimize-orchd-api
          definition: write:*
        - resourceServerId: web-modeler-api
          definition: write:*
