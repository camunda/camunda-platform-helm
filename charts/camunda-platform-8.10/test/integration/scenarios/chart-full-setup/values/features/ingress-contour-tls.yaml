global:
  compatibility:
    nginx:
      renderAnnotations: false
  ingress:
    className: contour
    annotations:
      projectcontour.io/websocket-routes: "/modeler-ws"
      projectcontour.io/response-timeout: "300s"
orchestration:
  service:
    annotations:
      projectcontour.io/upstream-protocol.h2: "26500"
      projectcontour.io/upstream-protocol.tls: "8080"
  ingress:
    grpc:
      className: contour
      annotations:
        projectcontour.io/response-timeout: "120s"
