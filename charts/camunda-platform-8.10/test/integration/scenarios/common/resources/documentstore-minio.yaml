# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.1-standalone-strict/all.json
apiVersion: v1
kind: Secret
metadata:
  name: documentstore-minio
  namespace: $NAMESPACE
type: Opaque
stringData:
  access-key: minio-integration-test
  secret-key: minio-integration-test-secret
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.1-standalone-strict/all.json
apiVersion: v1
kind: Service
metadata:
  name: documentstore-minio
  namespace: $NAMESPACE
spec:
  selector:
    app.kubernetes.io/name: documentstore-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.1-standalone-strict/all.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentstore-minio
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: documentstore-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: documentstore-minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
          args: [server, /data]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: documentstore-minio
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: documentstore-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.1-standalone-strict/all.json
apiVersion: batch/v1
kind: Job
metadata:
  name: documentstore-minio-bucket
  namespace: $NAMESPACE
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 8
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: create-bucket
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
          args: [mb, --ignore-existing, minio/documents]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: documentstore-minio
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: documentstore-minio
                  key: secret-key
            - name: MC_HOST_minio
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@documentstore-minio:9000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
