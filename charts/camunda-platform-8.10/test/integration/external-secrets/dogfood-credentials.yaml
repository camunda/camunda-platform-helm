---
# Credentials for the long-lived dogfood topology (dogfood.yaml's credentials-manifest).
#
# Replaces external-secret-integration-test-credentials.yaml in every dogfood
# namespace. That file maps most keys onto the one CI-wide "password" property
# of the "integration-test" source, which every ephemeral CI namespace also
# receives. Here each key reads its own property of "dogfood-credentials", a
# source no CI namespace references, so no credential is shared with CI or
# between components.
#
# The source Secret lives in the ClusterSecretStore's namespace
# (distribution-team). `deploy-camunda topology ensure-credentials --manifest
# <this file>` creates it and generates any missing property; it never changes
# an existing value. The metadata.name matches the CI manifest so applying this
# file takes over the same ExternalSecret instead of adding a second writer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camunda-helm-existing-secrets-8-8
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: distribution-team
  target:
    name: integration-test-credentials
    creationPolicy: Orphan
  data:
    - secretKey: identity-user-password
      remoteRef: {key: dogfood-credentials, property: identity-user-password}
    - secretKey: identity-keycloak-admin-password
      remoteRef: {key: dogfood-credentials, property: identity-keycloak-admin-password}
    - secretKey: identity-keycloak-postgresql-user-password
      remoteRef: {key: dogfood-credentials, property: identity-keycloak-postgresql-user-password}
    - secretKey: identity-postgresql-user-password
      remoteRef: {key: dogfood-credentials, property: identity-postgresql-user-password}
    - secretKey: elasticsearch-password
      remoteRef: {key: dogfood-credentials, property: elasticsearch-password}
    - secretKey: identity-admin-client-password
      remoteRef: {key: dogfood-credentials, property: identity-admin-client-password}
    - secretKey: identity-admin-client-token
      remoteRef: {key: dogfood-credentials, property: identity-admin-client-token}
    - secretKey: identity-console-client-token
      remoteRef: {key: dogfood-credentials, property: identity-console-client-token}
    - secretKey: identity-orchestration-client-token
      remoteRef: {key: dogfood-credentials, property: identity-orchestration-client-token}
    - secretKey: identity-connectors-client-token
      remoteRef: {key: dogfood-credentials, property: identity-connectors-client-token}
    - secretKey: identity-optimize-client-token
      remoteRef: {key: dogfood-credentials, property: identity-optimize-client-token}
    - secretKey: identity-optimize-default-client-token
      remoteRef: {key: dogfood-credentials, property: identity-optimize-default-client-token}
    - secretKey: identity-optimize-tenanta-client-token
      remoteRef: {key: dogfood-credentials, property: identity-optimize-tenanta-client-token}
    - secretKey: identity-optimize-tenantb-client-token
      remoteRef: {key: dogfood-credentials, property: identity-optimize-tenantb-client-token}
    - secretKey: webmodeler-pusher-app-key
      remoteRef: {key: dogfood-credentials, property: webmodeler-pusher-app-key}
    - secretKey: webmodeler-pusher-app-secret
      remoteRef: {key: dogfood-credentials, property: webmodeler-pusher-app-secret}
