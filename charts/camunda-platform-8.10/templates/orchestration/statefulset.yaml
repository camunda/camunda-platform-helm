{{- $mr := include "camundaPlatform.multiregion" $ | fromJson -}}
{{- if eq (include "camundaPlatform.orchestrationEnabled" .) "true" -}}
{{- if eq (include "orchestration.zoned" .) "true" -}}
{{- $ctx := dict "Values" (deepCopy $.Values) "Release" $.Release "Chart" $.Chart "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files "ZoneScoped" true }}
---
{{ include "orchestration.statefulset" $ctx }}
{{- if $mr.keepUnzonedBrokers }}
{{- $unzonedCtx := dict "Values" (deepCopy $.Values) "Release" $.Release "Chart" $.Chart "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files }}
{{- $_ := set $unzonedCtx.Values.orchestration.multiregion "mode" "legacy" }}
---
{{ include "orchestration.statefulset" $unzonedCtx }}
{{ end }}
{{- else -}}
{{ include "orchestration.statefulset" . }}
{{- end -}}
{{- end -}}
