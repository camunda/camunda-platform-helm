{{- $mr := include "camundaPlatform.multiregion" $ | fromYaml -}}
{{/*
This file name should start with an underscore to avoid rendering it as a template.
It is included (imported) in the ConfigMap.
*/}}
spring:
  {{- $springImports := list }}
  {{- range .Values.orchestration.extraConfiguration }}
    {{- if not (and (hasKey . "springImport") (eq .springImport false)) }}
      {{- $springImports = append $springImports . }}
    {{- end }}
  {{- end }}
  {{- if $springImports }}
  config:
    import:
    {{- range $springImports }}
      - optional:file:/usr/local/camunda/config/{{ .file }}
    {{- end }}
  {{- end }}
  profiles:
    active: {{ include "orchestration.enabledProfilesWithAuth" . | quote }}
  servlet:
    multipart:
      max-file-size: {{ .Values.global.config.requestBodySize | quote }}
      max-request-size: {{ .Values.global.config.requestBodySize | quote }}

server:
  address: 0.0.0.0
  port: {{ .Values.orchestration.service.httpPort }}
  tomcat:
    max-http-form-post-size: {{ .Values.global.config.requestBodySize | quote }}
  {{- if .Values.orchestration.contextPath }}
  servlet:
    context-path: {{ include "camundaPlatform.joinpath" (list .Values.orchestration.contextPath) | quote }}
  {{- end }}

management:
  server:
    address: 0.0.0.0
    port: {{ .Values.orchestration.service.managementPort }}
    base-path: {{ include "camundaPlatform.joinpath" (list .Values.orchestration.contextPath) | quote }}

camunda:
  license:
    key: "${VALUES_ORCHESTRATION_LICENSE_KEY}"
  {{- if eq (include "camundaPlatform.extraConfigHasPath" (dict "extraConfiguration" .Values.orchestration.extraConfiguration "path" (list "camunda" "document"))) "true" }}
  document:
    default-store-id: {{ lower .Values.global.documentStore.activeStoreId | quote }}
    {{- if eq (include "orchestration.hasAzureDocumentStore" .) "true" }}
    azure:
      {{ lower .Values.global.documentStore.activeStoreId }}:
        connection-string: "${VALUES_DOCUMENT_STORE_AZURE_CONNECTION_STRING:}"
    {{- end }}
  {{- end }}
  {{- $secretStoreConfig := include "camundaPlatform.secretStore.renderConfig" . | trim }}
  {{- if $secretStoreConfig }}
  {{- $secretStoreConfig | nindent 2 }}
  {{- end }}

  system:
    cpu-thread-count: {{ .Values.orchestration.cpuThreadCount }}
    io-thread-count: {{ .Values.orchestration.ioThreadCount }}
    clock-controlled: false
    validate-restore-config: true
    upgrade:
    {{- if .Values.orchestration.upgrade.allowPreReleaseImages }}
      enable-version-check: false
    {{- else }}
      enable-version-check: true
    {{- end }}

  cluster:
    # The Node ID depends on the StatefulSet Pod's name so it cannot be templated in the StatefulSet level.
    # The value of "node-id" is calculated in the "startup.sh" file and exported as "VALUES_ORCHESTRATION_NODE_ID" env var.
    node-id: "${VALUES_ORCHESTRATION_NODE_ID:}"
    size: {{ include "orchestration.clusterSize" . | quote }}
    replication-factor: {{ include "orchestration.replicationFactor" . | quote }}
    partition-count: {{ .Values.orchestration.partitionCount | quote }}
    {{- if eq (include "orchestration.zoned" .) "true" }}
    partitioning:
      scheme: ZONE_AWARE
      zone-aware:
        zones:
        {{- range $mr.zones }}
          - name: {{ .name | quote }}
            number-of-brokers: {{ .numberOfBrokers }}
            number-of-replicas: {{ .numberOfReplicas }}
            priority: {{ .priority }}
        {{- end }}
    {{- end }}
    # zeebe.broker.cluster
    {{- /* NOTE: one zone or one region is one headless Service, which the chart can address
         itself. Beyond that it cannot know how brokers reach each other, so the list is the
         user's to provide. Keyed on the mode, not on the zone count, because the zone list
         is only meaningful in zoned mode. */ -}}
    {{- if or (and (eq (include "orchestration.zoned" $) "true") (le (len $mr.zones) 1)) (and (ne (include "orchestration.zoned" $) "true") (le (int $mr.regions) 1)) }}
    initial-contact-points:
    {{- range (untilStep 0 (int (include "orchestration.clusterSize" $)) 1) }}
      - {{ include "orchestration.fullname" $ }}-{{ . }}.${K8S_SERVICE_NAME}:{{ $.Values.orchestration.service.internalPort }}
    {{- end }}
    {{- else }}
    # Multi-region deployments: initial-contact-points must be provided manually via environment variable.
    # Set CAMUNDA_CLUSTER_INITIALCONTACTPOINTS with fully-qualified domain names for all brokers across regions.
    # Example: orchestration.env[0].name=CAMUNDA_CLUSTER_INITIALCONTACTPOINTS
    #          orchestration.env[0].value=<pod>.<headless-service>.<namespace-0>.svc.cluster.local:26502,<pod>.<headless-service>.<namespace-1>.svc.cluster.local:26502,...
    {{- end }}

  api:
    grpc:
      address: 0.0.0.0
      port: {{ .Values.orchestration.service.grpcPort }}

  # Database configuration - Separated syntax.
  database:

  data:
    snapshot-period: {{ .Values.orchestration.data.snapshotPeriod | quote }}
    primary-storage:
      disk:
        free-space:
          processing: {{ .Values.orchestration.data.disk.freeSpace.processing | quote }}
          replication: {{ .Values.orchestration.data.disk.freeSpace.replication | quote }}
    secondary-storage:
      autoconfigure-camunda-exporter: {{ include "orchestration.camundaExporterEnabled" . }}
      type: {{ include "orchestration.secondaryStorage" . | quote -}}
      {{- if .Values.orchestration.history.retention.enabled }}
      retention:
        enabled: true
        minimum-age: {{ .Values.orchestration.history.retention.minimumAge | quote }}
      {{- end }}
      {{- if or .Values.optimize.database.elasticsearch.enabled (eq .Values.orchestration.data.secondaryStorage.type "elasticsearch") }}
      elasticsearch:
        aws-enabled: {{ .Values.orchestration.data.secondaryStorage.elasticsearch.aws.enabled }}
        url: {{ include "camundaPlatform.elasticsearchURL" . | quote }}
        username: {{ .Values.orchestration.data.secondaryStorage.elasticsearch.auth.username | quote }}
        password: "${VALUES_ELASTICSEARCH_PASSWORD:}"
        index-prefix: {{ .Values.orchestration.index.prefix | quote }}
        number-of-replicas: {{ .Values.orchestration.index.replicas | quote }}
        history:
          els-rollover-date-format: {{ .Values.orchestration.history.elsRolloverDateFormat | quote }}
          rollover-interval: {{ .Values.orchestration.history.rolloverInterval | quote }}
          rollover-batch-size: {{ .Values.orchestration.history.rolloverBatchSize }}
          wait-period-before-archiving: {{ .Values.orchestration.history.waitPeriodBeforeArchiving | quote }}
          delay-between-runs: {{ .Values.orchestration.history.delayBetweenRuns }}
          max-delay-between-runs: {{ .Values.orchestration.history.maxDelayBetweenRuns }}
          {{- if .Values.orchestration.history.retention.enabled }}
          policy-name: {{ .Values.orchestration.history.retention.policyName | quote }}
          {{- end }}
      {{- end }}
      {{- if or .Values.optimize.database.opensearch.enabled (eq .Values.orchestration.data.secondaryStorage.type "opensearch") }}
      opensearch:
        aws-enabled: {{ .Values.orchestration.data.secondaryStorage.opensearch.aws.enabled }}
        url: {{ include "camundaPlatform.opensearchURL" . | quote }}
        username: {{ .Values.orchestration.data.secondaryStorage.opensearch.auth.username | quote }}
        password: "${VALUES_OPENSEARCH_PASSWORD:}"
        index-prefix: {{ .Values.orchestration.index.prefix | quote }}
        number-of-replicas: {{ .Values.orchestration.index.replicas | quote }}
        history:
          els-rollover-date-format: {{ .Values.orchestration.history.elsRolloverDateFormat | quote }}
          rollover-interval: {{ .Values.orchestration.history.rolloverInterval | quote }}
          rollover-batch-size: {{ .Values.orchestration.history.rolloverBatchSize }}
          wait-period-before-archiving: {{ .Values.orchestration.history.waitPeriodBeforeArchiving | quote }}
          delay-between-runs: {{ .Values.orchestration.history.delayBetweenRuns }}
          max-delay-between-runs: {{ .Values.orchestration.history.maxDelayBetweenRuns }}
          {{- if .Values.orchestration.history.retention.enabled }}
          policy-name: {{ .Values.orchestration.history.retention.policyName | quote }}
          {{- end }}
      {{- end }}
      {{- if .Values.orchestration.exporters.rdbms.enabled }}
      rdbms:
        {{- with .Values.orchestration.data.secondaryStorage.rdbms }}
        aws-enabled: {{ .aws.enabled }}
        url: {{ .url | quote }}
        username: {{ .username | quote }}
        password: "${VALUES_ORCHESTRATION_DATA_SECONDARYSTORAGE_RDBMS_PASSWORD:}"
        {{- end }}
      {{- end }}

  # Security configuration - Separated syntax.
  security:
    authentication:
    {{- if and (eq (include "orchestration.authMethod" .) "basic") (.Values.orchestration.security.authentication.unprotectedApi) }}
      basic:
        allow-unauthenticated-api-access: {{ .Values.orchestration.security.authentication.unprotectedApi }}
    {{- end }}
    {{- if eq (include "orchestration.authMethod" .) "oidc" }}
      oidc:
        username-claim: {{ .Values.orchestration.security.authentication.oidc.usernameClaim | quote }}
        client-id-claim: {{ .Values.orchestration.security.authentication.oidc.clientIdClaim | quote }}
        {{- if .Values.orchestration.security.authentication.oidc.groupsClaim }}
        groups-claim: {{ .Values.orchestration.security.authentication.oidc.groupsClaim | quote }}
        {{- end }}
        client-id: {{ include "orchestration.authClientId" . | quote }}
        client-secret: ${VALUES_ORCHESTRATION_CLIENT_SECRET:}
        audiences:
          {{- range .Values.orchestration.security.authentication.oidc.backwardsCompatibleAudiences }}
          - {{ . | quote }}
          {{- end }}
          - {{ include "orchestration.authClientId" . | quote }}
          - {{ include "orchestration.authAudience" . | quote }}
          - {{ (or .Values.global.identity.auth.camundaHub.clientApiAudience .Values.global.identity.auth.webModeler.clientApiAudience) | quote }}
        {{- if (include "orchestration.authIssuerUrl" .) }}
        issuer-uri: {{ include "orchestration.authIssuerUrl" . | quote }}
        {{- else }}
        authorization-uri: {{ include "orchestration.authIssuerUrlEndpointAuth" . | quote }}
        jwk-set-uri: {{ include "orchestration.authIssuerBackendUrlEndpointCerts" . | quote }}
        token-uri: {{ include "orchestration.authIssuerBackendUrlEndpointToken" . | quote }}
        {{- end }}
        redirect-uri: {{ printf "%s/sso-callback" (include "orchestration.RedirectURI" .) | quote }}
        authenticationRefreshInterval: {{ .Values.orchestration.security.authentication.authenticationRefreshInterval | quote }}
        {{- if .Values.orchestration.security.authentication.oidc.preferUsernameClaim }}
        prefer-username-claim: {{ .Values.orchestration.security.authentication.oidc.preferUsernameClaim }}
        {{- end }}
        {{- if .Values.orchestration.security.authentication.oidc.scope }}
        scope:
          {{- include "common.tplvalues.render" ( dict "value" .Values.orchestration.security.authentication.oidc.scope "context" $ ) | nindent 10 }}
        {{- end }}
      {{- end }}
      method: {{ include "orchestration.authMethod" . | quote }}
      unprotectedApi: {{ .Values.orchestration.security.authentication.unprotectedApi }}
    authorizations:
      enabled: {{ .Values.orchestration.security.authorizations.enabled }}
    initialization:
      default-roles:
        {{- .Values.orchestration.security.initialization.defaultRoles | toYaml | nindent 8 }}
      {{- if eq (include "orchestration.authMethod" .) "basic" }}
      users:
        {{- .Values.orchestration.security.initialization.users | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.orchestration.security.initialization.mappingRules }}
      mapping-rules:
        {{- .Values.orchestration.security.initialization.mappingRules | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.orchestration.security.initialization.authorizations }}
      authorizations:
        {{- .Values.orchestration.security.initialization.authorizations | toYaml | nindent 8 }}
      {{- end }}
    multiTenancy:
      checksEnabled: {{ include "orchestration.multitenancyChecksEnabled" . }}
      apiEnabled: {{ include "orchestration.multitenancyApiEnabled" . }}
  {{- if .Values.orchestration.hub.ping.endpoint }}
  hub:
    ping:
      endpoint: {{ .Values.orchestration.hub.ping.endpoint | quote }}
      credentials:
        token-endpoint: {{ include "orchestration.hubPingTokenEndpoint" . | quote }}
        client-id: {{ include "orchestration.hubPingClientId" . | quote }}
        client-secret: ${VALUES_CAMUNDAHUB_PING_CLIENT_SECRET:}
        {{- with .Values.orchestration.hub.ping.credentials.tokenRequestParameters }}
        token-request-parameters:
          {{- range $name, $value := . }}
          {{ $name }}: {{ tpl $value $ | quote }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if eq (include "orchestration.authMethod" .) "oidc" }}
  identity:
    clientId: {{ include "orchestration.authClientId" . | quote }}
    audience: {{ include "orchestration.authAudience" . | quote }}
  {{- end }}
  persistent:
    sessions:
      enabled: {{ include "orchestration.persistentSessionsEnabled" . }}


{{- if .Values.orchestration.profiles.operate -}}
  {{- "\n" }}
  #
  # Camunda Operate Configuration - Separated syntax.
  #
  operate:
    multiTenancy:
      enabled: {{ include "orchestration.multitenancyChecksEnabled" . }}
    {{- if eq (include "orchestration.authMethod" .) "oidc" }}
    identity:
      redirectRootUrl: {{ printf "%s/operate" (include "orchestration.RedirectURI" .) | quote }}
    {{- end }}
    # Zeebe instance
    zeebe:
      # Gateway address
      gatewayAddress: {{ include "orchestration.serviceNameGRPC" . | quote }}
      {{- include "orchestration.operateTasklistZeebeSecurity" . | nindent 6 }}
    {{- if .Values.orchestration.history.retention.enabled }}
    archiver:
      ilmEnabled: true
      ilmMinAgeForDeleteArchivedIndices: {{ .Values.orchestration.history.retention.minimumAge }}
    {{- end }}
{{- end -}}

{{- if .Values.orchestration.profiles.tasklist -}}
  {{- "\n" }}
  #
  # Camunda Tasklist Configuration - Separated syntax.
  #
  tasklist:
    multiTenancy:
      enabled: {{ include "orchestration.multitenancyChecksEnabled" . }}

    {{- if eq (include "orchestration.authMethod" .) "oidc" }}
    identity:
      redirectRootUrl: {{ printf "%s/tasklist" (include "orchestration.RedirectURI" .) | quote }}
    {{- end }}
    # Zeebe instance
    zeebe:
      # Gateway address
      gatewayAddress: {{ include "orchestration.serviceNameGRPC" . | quote }}
      restAddress: {{ include "camundaPlatform.orchestrationHTTPInternalURL" . | quote }}
      {{- include "orchestration.operateTasklistZeebeSecurity" . | nindent 6 }}
    {{- if .Values.orchestration.history.retention.enabled }}
    archiver:
      ilmEnabled: true
      ilmMinAgeForDeleteArchivedIndices: {{ .Values.orchestration.history.retention.minimumAge }}
    {{- end }}
{{- end -}}

{{- if .Values.orchestration.profiles.broker -}}
{{- "\n" }}
#
# Camunda Zeebe Configuration - Separated syntax.
#
zeebe:
  host: 0.0.0.0
  log:
    level: {{ .Values.orchestration.logLevel | quote }}

  broker:
    # zeebe.broker.gateway
    gateway:
      enable: true
      multitenancy:
        enabled: {{ include "orchestration.multitenancyChecksEnabled" . }}

    # zeebe.broker.network
    network:
      {{- if or (eq (include "orchestration.zoned" .) "true") (gt (int $mr.regions) 1) }}
      advertisedHost: "${K8S_NAME}.${K8S_SERVICE_NAME}.${K8S_NAMESPACE}.svc"
      {{- else }}
      advertisedHost: "${K8S_NAME}.${K8S_SERVICE_NAME}"
      {{- end }}
      host: 0.0.0.0
      commandApi:
        port: {{ .Values.orchestration.service.commandPort }}
      internalApi:
        port: {{ .Values.orchestration.service.internalPort }}

    # zeebe.broker.cluster
    cluster:
      clusterName: {{ tpl .Values.global.zeebeClusterName . }}

    {{- if or
      (eq (include "orchestration.hasElasticsearchExporter" .) "true")
      (eq (include "orchestration.hasOpenSearchExporter" .) "true")
      (eq (include "orchestration.hasAppIntegrations" .) "true")
    }}
    # zeebe.broker.exporters
    exporters:
    {{- end }}
    {{- if eq (include "orchestration.hasElasticsearchExporter" .) "true" }}
      elasticsearch:
        className: "io.camunda.zeebe.exporter.ElasticsearchExporter"
        args:
          {{- if .Values.optimize.database.elasticsearch.external }}
          authentication:
            username: {{ include "orchestration.legacyElasticsearchExporterUsername" . | quote }}
            password: "{{ include "orchestration.legacyElasticsearchExporterPasswordRef" . }}"
          {{- end }}
          url: {{ include "camundaPlatform.legacyExporterElasticsearchURL" . | quote }}
          index:
            prefix: {{ .Values.optimize.database.elasticsearch.prefix | default "zeebe-record" | quote }}
            numberOfReplicas: {{ ternary .Values.orchestration.index.replicas .Values.orchestration.exporters.zeebe.replicas (kindIs "invalid" .Values.orchestration.exporters.zeebe.replicas) | quote }}
          {{- if .Values.orchestration.retention.enabled }}
          retention:
            enabled: true
            minimumAge: {{ .Values.orchestration.retention.minimumAge | quote }}
            policyName: {{ .Values.orchestration.retention.policyName | quote }}
          {{- end }}
    {{- else if eq (include "orchestration.hasOpenSearchExporter" .) "true" }}
      opensearch:
        className: "io.camunda.zeebe.exporter.opensearch.OpensearchExporter"
        args:
          {{- if eq (include "orchestration.legacyOpenSearchExporterAuthenticationEnabled" .) "true" }}
          authentication:
            username: {{ include "orchestration.legacyOpenSearchExporterUsername" . | quote }}
            password: "{{ include "orchestration.legacyOpenSearchExporterPasswordRef" . }}"
          {{- end }}
          url: {{ include "camundaPlatform.legacyExporterOpensearchURL" . | quote }}
          index:
            prefix: {{ .Values.optimize.database.opensearch.prefix | default "zeebe-record" | quote }}
            numberOfReplicas: {{ ternary .Values.orchestration.index.replicas .Values.orchestration.exporters.zeebe.replicas (kindIs "invalid" .Values.orchestration.exporters.zeebe.replicas) | quote }}
          {{- if eq (include "orchestration.legacyOpenSearchExporterAwsEnabled" .) "true" }}
          aws:
            enabled: true
          {{- end }}
          {{- if .Values.orchestration.retention.enabled }}
          retention:
            enabled: true
            minimumAge: {{ .Values.orchestration.retention.minimumAge | quote }}
            policyName: {{ .Values.orchestration.retention.policyName | quote }}
          {{- end }}
    {{- end }}
    {{- if eq (include "orchestration.hasAppIntegrations" .) "true" }}
      appIntegrations:
        args:
          apiKey: "${VALUES_EXPORTERS_APPINTEGRATIONS_APIKEY:}"
    {{- end }}
{{ end -}}
