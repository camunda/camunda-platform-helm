{{- if .Values.capacityManager.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "capacityManager.fullname" . }}
  labels: {{- include "capacityManager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "capacityManager.matchLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end -}}
