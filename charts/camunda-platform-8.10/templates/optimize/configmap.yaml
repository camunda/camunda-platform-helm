{{- if and (eq (include "camundaPlatform.optimizeEnabled" .) "true") (not .Values.global.noSecondaryStorage) -}}
kind: ConfigMap
metadata:
  name: {{ include "optimize.fullname" . }}-configuration
  labels:
    {{- include "optimize.labels" . | nindent 4 }}
apiVersion: v1
data:
  environment-config.yaml: |
  {{- if .Values.optimize.configuration }}
    {{ .Values.optimize.configuration | indent 4 | trim }}
  {{- else }}
    {{- include "optimize.defaultConfig" . | trim | nindent 4 }}
  {{- end }}
  {{- if or .Values.global.identity.auth.enabled .Values.optimize.extraConfiguration }}
  application-ccsm.yaml: |
    {{- $springImport := include "optimize.springConfigImport" . }}
    {{- if $springImport }}
    spring:
      config:
        import: {{ $springImport }}
    {{- end }}
    {{- if .Values.global.identity.auth.enabled }}
    {{- $cslEnabled := eq (include "optimize.cslEnabled" .) "true" }}
    {{- if $cslEnabled }}
    optimize:
      security:
        csl:
          enabled: true
    {{- end }}
    camunda:
      identity:
        clientId: {{ include "optimize.authClientId" . | quote }}
        audience: {{ include "optimize.authAudience" . | quote }}
        issuer: {{ include "camundaPlatform.authIssuerUrlWithFallback" . | quote }}
        issuerBackendUrl: {{ include "camundaPlatform.authIssuerBackendUrl" . | quote }}
      {{- if $cslEnabled }}
      security:
        authentication:
          method: "oidc"
          oidc:
            client-id: {{ include "optimize.authClientId" . | quote }}
            client-secret: ${VALUES_OPTIMIZE_CLIENT_SECRET:}
            audiences:
              - {{ include "optimize.authClientId" . | quote }}
              - {{ include "optimize.authAudience" . | quote }}
              - {{ (or .Values.global.identity.auth.camundaHub.clientApiAudience .Values.global.identity.auth.webModeler.clientApiAudience) | quote }}
            {{- /* NOTE: the strict issuer, not authIssuerUrlWithFallback: issuer-uri makes CSL run OIDC
                   discovery over the public URL at startup, which fails wherever the JVM truststore is
                   replaced for a self-signed database. Falling back to publicIssuerUrl would take that
                   branch for a plain Keycloak setup, where the orchestration chart uses the in-cluster
                   back-channel endpoints below instead. */}}
            {{- if (include "camundaPlatform.authIssuerUrl" .) }}
            issuer-uri: {{ include "camundaPlatform.authIssuerUrl" . | quote }}
            {{- else }}
            authorization-uri: {{ include "camundaPlatform.authIssuerUrlEndpointAuth" . | quote }}
            jwk-set-uri: {{ include "camundaPlatform.authIssuerBackendUrlEndpointCerts" . | quote }}
            token-uri: {{ include "camundaPlatform.authIssuerBackendUrlEndpointToken" . | quote }}
            {{- end }}
            {{- /* NOTE: Optimize keeps its legacy callback path so the Identity-provisioned client needs no new redirect URI.
                   {baseUrl} rather than optimize.redirectUrl: CSL derives the callback listener path from this value and
                   strips the servlet context-path using server.servlet.context-path, which Optimize never sets (it applies
                   optimize.contextPath to the Tomcat factory directly), so an absolute URL would register the listener at
                   /<contextPath>/api/authentication/callback and never match. {baseUrl} expands per request to include the
                   context-path, keeping the IdP redirect_uri identical while the listener path stays context-relative. */}}
            redirect-uri: "{baseUrl}/api/authentication/callback"
      {{- end }}
    {{- end }}
  {{- end }}

  {{- range .Values.optimize.extraConfiguration }}
  {{ .file }}: |
    {{ .content | indent 4 | trim }}
  {{- end }}
{{- end }}
