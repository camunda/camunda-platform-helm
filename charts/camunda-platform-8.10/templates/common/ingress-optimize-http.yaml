{{- if and .Values.global.ingress.enabled (not .Values.global.ingress.external) .Values.optimize.enabled .Values.optimize.contextPath (eq (include "camundaPlatform.optimizeServerTLSEnabled" .) "true") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "camundaPlatform.fullname" . }}-optimize-http
  labels:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        (include "camundaPlatform.labels" .)
        .Values.global.ingress.labels
      )
      "context" .
    ) | nindent 4 }}
  annotations:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        .Values.global.ingress.annotations
        (dict "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS")
      )
      "context" .
    ) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  rules:
    {{- if .Values.global.host }}
    - host: {{ tpl .Values.global.host $ }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - backend:
              service:
                name: {{ include "optimize.fullname" . }}
                port:
                  number: {{ .Values.optimize.service.port }}
            path: {{ .Values.optimize.contextPath }}
            pathType: {{ .Values.global.ingress.pathType }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    {{- if eq .Values.global.ingress.tls.secretName "-" }}
    - {}
    {{- else }}
    - hosts:
        - {{ tpl .Values.global.host $ }}
      {{- if .Values.global.ingress.tls.secretName }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
