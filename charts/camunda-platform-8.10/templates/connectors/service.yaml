{{- if eq (include "camundaPlatform.connectorsEnabled" .) "true" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "connectors.serviceName" . }}
  labels:
    {{- include "connectors.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.global.annotations}}
      {{- toYaml .Values.global.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.connectors.service.annotations}}
      {{- toYaml .Values.connectors.service.annotations | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.connectors.service.type }}
  ports:
    - name: {{ .Values.connectors.service.serverName }}
      port: {{ .Values.connectors.service.serverPort }}
      targetPort: {{ .Values.connectors.service.serverPort }}
      protocol: TCP
      {{- $appProtocols := .Values.connectors.service.appProtocols -}}
      {{- if and (eq (include "camundaPlatform.connectorsTLSEnabled" .) "true") (not (hasKey $appProtocols "server")) -}}
      {{- $appProtocols = merge (dict "server" "https") $appProtocols -}}
      {{- end -}}
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "server" "knownPorts" (list "server") "appProtocols" $appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
  selector:
    {{- include "connectors.matchLabels" . | nindent 4 }}
{{- end }}
