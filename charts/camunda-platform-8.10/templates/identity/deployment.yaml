{{- if eq (include "camundaPlatform.identityEnabled" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}
  labels: {{- include "identity.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.global.annotations | nindent 4 }}
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels: {{- include "identity.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
        {{- if .Values.identity.podLabels }}
        {{- tpl (toYaml .Values.identity.podLabels) $ | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/identity/configmap.yaml") . | sha256sum }}
        {{- with (include "camundaPlatform.caBundleChecksumAnnotation" .) }}{{ . | nindent 8 }}{{- end }}
      {{- if .Values.identity.podAnnotations }}
        {{- tpl (toYaml .Values.identity.podAnnotations) $ | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        {{- include "identity.imagePullSecrets" . | nindent 8 }}
      initContainers:
        {{- if eq (include "camundaPlatform.hasCaBundle" .) "true" }}
        {{- include "camundaPlatform.caBundleInitContainer" (dict "context" $ "image" (include "camundaPlatform.imageByParams" (dict "base" $.Values.global "overlay" $.Values.identity))) | nindent 8 }}
        {{- end }}
        {{- with .Values.identity.initContainers }}
        {{- tpl (toYaml . | nindent 8) $ }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "camundaPlatform.imageByParams" (dict "base" .Values.global "overlay" .Values.identity) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- if .Values.identity.containerSecurityContext }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" $.Values.identity.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
                "envName" "CAMUNDA_LICENSE_KEY"
                "config" .Values.global.license
            ) | nindent 12 }}
            {{- if .Values.global.identity.auth.enabled }}
            {{- if eq (include "camundaPlatform.authIssuerType" .) "KEYCLOAK"}}
            {{- if eq (include "camundaPlatform.topologyMode" .) "hub" }}
            {{- range $cluster := dig "clusters" list (.Values.global.topology | default dict) }}
            {{- $token := include "camundaPlatform.topologyEnvToken" $cluster.id }}
            {{- $orchestration := dig "components" "orchestration" dict $cluster }}
            {{- $optimize := dig "components" "optimize" dict $cluster }}
            {{- $connectors := dig "components" "connectors" dict $cluster }}
            {{- if $orchestration.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict "envName" (printf "VALUES_TOPOLOGY_%s_ORCHESTRATION_SECRET" $token) "config" $orchestration) | nindent 12 }}
            {{- end }}
            {{- if $optimize.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict "envName" (printf "VALUES_TOPOLOGY_%s_OPTIMIZE_SECRET" $token) "config" $optimize) | nindent 12 }}
            {{- end }}
            {{- if $connectors.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict "envName" (printf "VALUES_TOPOLOGY_%s_CONNECTORS_SECRET" $token) "config" $connectors) | nindent 12 }}
            {{- end }}
            {{- range $tenant := dig "physicalTenants" list $cluster }}
            {{- $tenantOptimize := dig "components" "optimize" dict $tenant }}
            {{- if $tenantOptimize.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict "envName" (printf "VALUES_TOPOLOGY_%s_TENANT_%s_OPTIMIZE_SECRET" $token (include "camundaPlatform.topologyEnvToken" $tenant.id)) "config" $tenantOptimize) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.global.identity.auth.connectors.alwaysRegister (and (ne (include "camundaPlatform.topologyMode" .) "hub") (eq (include "connectors.authMethod" .) "oidc")) }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
                "envName"       "VALUES_KEYCLOAK_INIT_CONNECTORS_SECRET"
                "config"        .Values.connectors.security.authentication.oidc
            ) | nindent 12 }}
            - name: CAMUNDA_CONNECTORS_CLIENT_ID
              value: {{ .Values.connectors.security.authentication.oidc.clientId | default "connectors" | quote }}
            {{- end }}
            {{- if or .Values.global.identity.auth.orchestration.alwaysRegister (and (ne (include "camundaPlatform.topologyMode" .) "hub") (or .Values.global.identity.auth.orchestration.hubPingAuthorizationEnabled (eq (include "orchestration.authMethod" .) "oidc"))) }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
                "envName"       "VALUES_KEYCLOAK_INIT_ORCHESTRATION_SECRET"
                "config"        .Values.orchestration.security.authentication.oidc
            ) | nindent 12 }}
            - name: CAMUNDA_ORCHESTRATION_CLIENT_ID
              value: {{ include "orchestration.authClientId" . | quote }}
            {{- end }}
            {{- if or .Values.global.identity.auth.optimize.alwaysRegister (and (ne (include "camundaPlatform.topologyMode" .) "hub") .Values.optimize.enabled) }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
                "envName"       "VALUES_KEYCLOAK_INIT_OPTIMIZE_SECRET"
                "config"        .Values.global.identity.auth.optimize
            ) | nindent 12 }}
            - name: CAMUNDA_OPTIMIZE_CLIENT_ID
              value: {{ include "optimize.effectiveAuthClientId" . | quote }}
            {{- end }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
                "envName"           "VALUES_KEYCLOAK_SETUP_PASSWORD"
                "config"            .Values.global.identity.keycloak.auth
            ) | nindent 12 }}
            {{- if .Values.identity.firstUser.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
              "envName" "VALUES_IDENTITY_FIRSTUSER_PASSWORD"
              "config" .Values.identity.firstUser
            ) | nindent 12 }}
            {{- end }}
            {{- if .Values.global.identity.auth.admin.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
              "envName" "VALUES_CAMUNDA_ADMIN_CLIENT_SECRET"
              "config" .Values.global.identity.auth.admin
            ) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if eq (include "camundaPlatform.hasSecretConfig" (dict "config" .Values.global.identity.auth.identity)) "true" }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
              "envName" "VALUES_CAMUNDA_IDENTITY_CLIENT_SECRET"
              "config" .Values.global.identity.auth.identity
            ) | nindent 12 }}
            {{- if or .Values.global.identity.auth.optimize.alwaysRegister (and (ne (include "camundaPlatform.topologyMode" .) "hub") .Values.optimize.enabled) }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
              "envName" "CAMUNDA_OPTIMIZE_SECRET"
              "config" .Values.global.identity.auth.optimize
            ) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.identity.externalDatabase.enabled }}
            {{- include "camundaPlatform.emitEnvVarFromSecretConfig" (dict
              "envName" "IDENTITY_DATABASE_PASSWORD"
              "config" .Values.identity.externalDatabase
            ) | nindent 12 }}
            {{- end }}
          {{- if .Values.identity.users}}
          {{- range $index, $user := .Values.identity.users }}
          {{- if $user.secret.inlineSecret }}
            - name: VALUES_{{ $user.username | upper}}_USER_PASSWORD
              value: {{ $user.secret.inlineSecret | quote }}
          {{- else }}
            - name: VALUES_{{ $user.username | upper}}_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $user.secret.existingSecret }}
                  key: {{ $user.secret.existingSecretKey }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.identity.clients}}
            {{- range $index, $client := .Values.identity.clients }}
            {{- if $client.secret.inlineSecret }}
            - name: VALUES_{{ $client.id | upper}}_CLIENT_SECRET
              value: {{ $client.secret.inlineSecret | quote }}
            {{- else }}
            - name: VALUES_{{ $client.id | upper}}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $client.secret.existingSecret }}
                  key: {{ $client.secret.existingSecretKey }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if eq (include "camundaPlatform.hasCaBundle" .) "true" }}
            {{- include "camundaPlatform.caBundleEnv" . | nindent 12 }}
            {{- include "camundaPlatform.caBundleJavaToolOptionsEnv" . | nindent 12 }}
          {{- end }}
          {{- with .Values.identity.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- if .Values.identity.envFrom }}
          envFrom:
            {{- .Values.identity.envFrom | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.identity.command}}
          command: {{ toYaml .Values.identity.command | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          ports:
            - containerPort: 8084
              name: http
              protocol: TCP
            - containerPort: 8082
              name: metrics
              protocol: TCP
          {{- if .Values.identity.startupProbe.enabled }}
          startupProbe:
            httpGet:
              {{- /* NOTE: Identity does not support contextPath for health endpoints. */}}
              path: {{ .Values.identity.startupProbe.probePath }}
              scheme: {{ .Values.identity.startupProbe.scheme }}
              port: metrics
            initialDelaySeconds: {{ .Values.identity.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.identity.startupProbe.periodSeconds }}
            successThreshold: {{ .Values.identity.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.identity.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.identity.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.identity.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              {{- /* NOTE: Identity does not support contextPath for health endpoints. */}}
              path: {{ .Values.identity.readinessProbe.probePath }}
              scheme: {{ .Values.identity.readinessProbe.scheme }}
              port: metrics
            initialDelaySeconds: {{ .Values.identity.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.identity.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.identity.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.identity.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.identity.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.identity.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              {{- /* NOTE: Identity does not support contextPath for health endpoints. */}}
              path: {{ .Values.identity.livenessProbe.probePath }}
              scheme: {{ .Values.identity.livenessProbe.scheme }}
              port: metrics
            initialDelaySeconds: {{ .Values.identity.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.identity.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.identity.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.identity.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.identity.livenessProbe.timeoutSeconds }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - name: config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
          {{- with .Values.identity.extraConfiguration }}
          {{- include "camundaPlatform.extraConfigurationVolumeMounts" (dict "extraConfig" . "volumeName" "config" "basePath" "/app/config") | trim | nindent 12 }}
          {{- end }}
            {{- if eq (include "camundaPlatform.hasCaBundle" .) "true" }}
            {{- include "camundaPlatform.caBundleVolumeMount" . | nindent 12 }}
            {{- include "camundaPlatform.caBundleTruststoreVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.identity.extraVolumeMounts}}
              {{- .Values.identity.extraVolumeMounts | toYaml | nindent 12 }}
            {{- end }}
        {{- if .Values.identity.sidecars }}
        {{- .Values.identity.sidecars | toYaml | nindent 8 }}
        {{- end }}

      volumes:
        - name: tmp
          {{- if and .Values.identity.persistence.enabled .Values.identity.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.identity.persistence.existingClaim }}
          {{- else if .Values.identity.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "camundaPlatform.fullname" . }}-identity-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "identity.fullname" . }}-configuration
        {{- if eq (include "camundaPlatform.hasCaBundle" .) "true" }}
        {{- include "camundaPlatform.caBundleVolume" . | nindent 8 }}
        {{- include "camundaPlatform.caBundleTruststoreVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.identity.extraVolumes}}
        {{- .Values.identity.extraVolumes | toYaml | nindent 8 }}
        {{- end }}
      serviceAccountName: {{ include "identity.serviceAccountName" . }}
      {{- if kindIs "bool" .Values.identity.automountServiceAccountToken }}
      automountServiceAccountToken: {{ .Values.identity.automountServiceAccountToken }}
      {{- end }}
      {{- if .Values.identity.dnsConfig }}
      dnsConfig: {{- toYaml .Values.identity.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.identity.dnsPolicy }}
      dnsPolicy: {{ .Values.identity.dnsPolicy | quote }}
      {{- end }}
      {{- if .Values.identity.podSecurityContext }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" $.Values.identity.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
