apiVersion: v2
name: camunda-platform
version: 15.0.0-alpha5
appVersion: 8.10.x
description: |
  Camunda 8 Self-Managed Helm charts.
  Camunda's process automation platform allows developers to design, automate and improve processes.
type: application
icon: https://helm.camunda.io/imgs/camunda.svg
home: https://docs.camunda.io/docs/self-managed/about-self-managed/
sources:
  - https://github.com/camunda/camunda-platform-helm
keywords:
  - automation
  - business-rules
  - bpm
  - bpmn
  - camunda-platform
  - decision-engine
  - dmn
  - modeling
  - orchestration
  - process-automation
  - process-engine
  - process-orchestration
  - workflow
  - workflow-engine
dependencies:
  # Helpers.
  - name: common
    repository: "file://../common-2"
    version: 2.x.x
maintainers:
  - name: eamonnmoloney
    email: eamonn.moloney@camunda.com
  - name: hisImminence
    email: immanuel.monma@camunda.com
  - name: bkenez
    email: balazs.kenez@camunda.com
annotations:
  artifacthub.io/prerelease: "true"
  camunda.io/helmCLIVersion: "4.2.3"
  artifacthub.io/links: |
    - name: Camunda 8 docs
      url: https://docs.camunda.io/
    - name: Camunda 8 Self-Managed docs
      url: https://docs.camunda.io/docs/self-managed/about-self-managed/
    - name: Camunda 8 Self-Managed Helm charts
      url: https://github.com/camunda/camunda-platform-helm
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Make Gateway API listener port and route sectionName configurable"
    - kind: added
      description: "Support S3-compatible endpoints in AWS document store"
    - kind: added
      description: "Add multi-namespace topology CI scenario"
    - kind: added
      description: "Support shared and cross-namespace Gateway via global.gateway.name and namespace"
    - kind: added
      description: "Support topologySpreadConstraints for zeebe brokers and gateway"
    - kind: added
      description: "Add opt-in orchestration.hub.ping values for authenticated Hub ping"
    - kind: added
      description: "[TOPOLOGY 3/6] add topology-aware deployment contract"
    - kind: added
      description: "Add pod-level service account token automount control"
    - kind: changed
      description: "Hoist camundaHub.webModeler.* and console overrides to the camundaHub.* parent"
    - kind: fixed
      description: "Omit empty zeebe.broker.exporters map for no-exporter scenarios"
    - kind: fixed
      description: "Allow Web Modeler and Console with external management Identity"
    - kind: fixed
      description: "Decouple requestBodySize from Zeebe maxMessageSize"
    - kind: fixed
      description: "Correct console deprecation signals after hub consolidation"
    - kind: fixed
      description: "Normalize orchestration internal REST URL when contextPath is root"
    - kind: fixed
      description: "Remove publishNotReadyAddresses from orchestration client-facing service"
    - kind: fixed
      description: "Only use document store configuration where required"
    - kind: fixed
      description: "Bind azure document store connection string to the unified config path"
    - kind: fixed
      description: "Gate OpenSearch password env vars on effective backend"
