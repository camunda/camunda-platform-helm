apiVersion: v2
name: camunda-platform
version: 15.0.0-alpha5
appVersion: 8.10.x
description: |
  Camunda 8 Self-Managed Helm charts.
  Camunda's process automation platform allows developers to design, automate and improve processes.
type: application
icon: https://helm.camunda.io/imgs/camunda.svg
home: https://docs.camunda.io/docs/self-managed/about-self-managed/
sources:
  - https://github.com/camunda/camunda-platform-helm
keywords:
  - automation
  - business-rules
  - bpm
  - bpmn
  - camunda-platform
  - decision-engine
  - dmn
  - modeling
  - orchestration
  - process-automation
  - process-engine
  - process-orchestration
  - workflow
  - workflow-engine
dependencies:
  # Helpers.
  - name: common
    repository: "file://../common-2"
    version: 2.x.x
maintainers:
  - name: eamonnmoloney
    email: eamonn.moloney@camunda.com
  - name: hisImminence
    email: immanuel.monma@camunda.com
  - name: bkenez
    email: balazs.kenez@camunda.com
annotations:
  artifacthub.io/prerelease: "true"
  camunda.io/helmCLIVersion: "4.2.4"
  artifacthub.io/links: |
    - name: Camunda 8 docs
      url: https://docs.camunda.io/
    - name: Camunda 8 Self-Managed docs
      url: https://docs.camunda.io/docs/self-managed/about-self-managed/
    - name: Camunda 8 Self-Managed Helm charts
      url: https://github.com/camunda/camunda-platform-helm
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Add orchestration.secretStore for centralized secret resolution"
    - kind: added
      description: "Add generic appProtocol support for Service ports in 8.10"
    - kind: added
      description: "Configure Optimize via camunda.security.* for CSL"
    - kind: added
      description: "Rename Web Modeler Keycloak preset roles to Hub in 8.10"
    - kind: added
      description: "Add Camunda Hub database migration phases"
    - kind: added
      description: "First-class global.tls.orchestration.{rest,grpc} surface"
    - kind: added
      description: "First-class TLS for Connectors"
    - kind: changed
      description: "Read merged Hub values across the remaining templates"
    - kind: changed
      description: "Remove deprecated global elasticsearch and opensearch values from 8.10 chart"
    - kind: changed
      description: "Rename web modeler play to test mode"
    - kind: changed
      description: "Remove redundant camundaexporter from zeebe.broker.exporters"
    - kind: fixed
      description: "Document defaultRoles.admin.clients in orchestration values schema [ready]"
    - kind: fixed
      description: "Read external URLs from global.host when using the gateway api"
    - kind: fixed
      description: "Allow root path as optimize client redirect uri in identity configmap"
    - kind: fixed
      description: "Document camundaHub override maps in values schema [ready]"
    - kind: fixed
      description: "Bump camunda-platform-8.10 identity image tag to 8.10.0-alpha4.2"
    - kind: fixed
      description: "Align legacy exporter with its component datastore source"
    - kind: fixed
      description: "Back Connectors and Identity /tmp with a per-pod ephemeral volume"
    - kind: fixed
      description: "Preserve Hub securityContext and resource defaults on partial override"
    - kind: fixed
      description: "Back Optimize /tmp with emptyDir to fix persistence double-mount"
    - kind: fixed
      description: "Stop exposing credentials in deployment output"
    - kind: fixed
      description: "Warn on inert console config keys and enforce deprecation-key coverage"
    - kind: fixed
      description: "Stop emitting orchestration log4j2.xml twice when extraConfiguration supplies it"
