apiVersion: v2
name: camunda-platform
version: 15.3.0
appVersion: 8.10.x
description: |
  Camunda 8 Self-Managed Helm charts.
  Camunda's process automation platform allows developers to design, automate and improve processes.
type: application
icon: https://helm.camunda.io/imgs/camunda.svg
home: https://docs.camunda.io/docs/self-managed/about-self-managed/
sources:
  - https://github.com/camunda/camunda-platform-helm
keywords:
  - automation
  - business-rules
  - bpm
  - bpmn
  - camunda-platform
  - decision-engine
  - dmn
  - modeling
  - orchestration
  - process-automation
  - process-engine
  - process-orchestration
  - workflow
  - workflow-engine
dependencies:
  # Helpers.
  - name: common
    repository: "file://../common-2"
    version: 2.x.x
maintainers:
  - name: camunda
    url: https://camunda.com
annotations:
  camunda.io/helmCLIVersion: "3.22.1,4.3.1"
  artifacthub.io/links: |
    - name: Camunda 8 docs
      url: https://docs.camunda.io/
    - name: Camunda 8 Self-Managed docs
      url: https://docs.camunda.io/docs/self-managed/about-self-managed/
    - name: Camunda 8 Self-Managed Helm charts
      url: https://github.com/camunda/camunda-platform-helm
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Keep Gateway API redirects on HTTPS for bare Web Modeler, Orchestration and Optimize paths"
    - kind: fixed
      description: "Honor env replication factor override in dual-region warning"
    - kind: fixed
      description: "Deprecate global.image tag and repository in the 8.10 chart"
    - kind: fixed
      description: "Render the Identity and Optimize ServiceMonitors only when their component is deployed"
    - kind: fixed
      description: "Warn when 8.10 and 8.11 Management Identity uses Keycloak without a Keycloak URL"
    - kind: fixed
      description: "Warn when global.noSecondaryStorage conflicts with orchestration secondary storage type"
    - kind: fixed
      description: "Align 8.10 and 8.11 deprecation removal targets and policy docs with the Camunda 8 non-public API policy"
