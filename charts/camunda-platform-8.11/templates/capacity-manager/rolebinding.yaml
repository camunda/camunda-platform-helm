{{- if .Values.capacityManager.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capacityManager.fullname" . }}
  labels: {{- include "capacityManager.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "capacityManager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capacityManager.fullname" . }}
{{- end -}}
