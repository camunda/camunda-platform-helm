{{- if eq (include "orchestration.standaloneGatewayRESTIngressEnabled" .) "true" -}}
{{- $ingress := .Values.orchestration.standaloneGateway.ingress.rest -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "camundaPlatform.fullname" . }}-standalone-gateway-rest
  labels:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        (include "camundaPlatform.labels" .)
        $ingress.labels
      )
      "context" .
    ) | nindent 4 }}
  {{- $annotations := dict -}}
  {{- if eq (include "camundaPlatform.orchestrationRESTTLSEnabled" .) "true" -}}
  {{- $annotations = mergeOverwrite $annotations (dict "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS") (include "camundaPlatform.orchestrationProxyVerifyAnnotations" . | fromYaml | default dict) -}}
  {{- end -}}
  {{- $annotations = mergeOverwrite $annotations ($ingress.annotations | default dict) -}}
  {{- with $annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ingress.className }}
  rules:
    {{- if $ingress.host }}
    - host: {{ tpl $ingress.host $ }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: {{ $ingress.path }}
            pathType: {{ $ingress.pathType }}
            backend:
              service:
                name: {{ include "orchestration.standaloneGatewayServiceName" . }}
                port:
                  number: {{ .Values.orchestration.service.httpPort }}
  {{- if $ingress.tls.enabled }}
  tls:
    {{- if eq $ingress.tls.secretName "-" }}
    - {}
    {{- else }}
    - hosts:
        - {{ tpl $ingress.host $ }}
      {{- if $ingress.tls.secretName }}
      secretName: {{ $ingress.tls.secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
