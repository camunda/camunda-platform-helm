{{- if eq (include "orchestration.standaloneGatewayRESTRouteEnabled" .) "true" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orchestration.standaloneGatewayFullname" . }}-rest
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.global.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        (include "camundaPlatform.labels" .)
        .Values.global.gateway.labels
      )
      "context" .
    ) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name | default (include "camundaPlatform.fullname" .) }}
      {{- if .Values.global.gateway.namespace }}
      namespace: {{ .Values.global.gateway.namespace }}
      {{- end }}
      sectionName: {{ .Values.orchestration.standaloneGateway.gateway.rest.sectionName | default (ternary "standalone-rests" "standalone-rest" .Values.global.gateway.tls.enabled) }}
  hostnames:
    - {{ tpl .Values.orchestration.standaloneGateway.gateway.rest.host $ | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ include "camundaPlatform.joinpath" (list .Values.orchestration.contextPath) }}
      backendRefs:
        - name: {{ include "orchestration.standaloneGatewayServiceName" . }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.orchestration.service.httpPort }}
{{- end }}
