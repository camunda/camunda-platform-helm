{{- if and (eq (include "orchestration.standaloneGatewayEnabled" .) "true") .Values.orchestration.standaloneGateway.serviceAccount.enabled -}}
{{- $sa := .Values.orchestration.standaloneGateway.serviceAccount -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestration.standaloneGatewayServiceAccountName" . }}
  labels:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        (include "orchestration.standaloneGatewayLabels" .)
        $sa.labels
      )
      "context" .
    ) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $sa.automountServiceAccountToken }}
{{- end }}
