{{- if eq (include "orchestration.standaloneGatewayEnabled" .) "true" -}}
{{- $service := .Values.orchestration.standaloneGateway.service -}}
{{- $knownPorts := list "management" "internal" "command" "http" "grpc" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestration.standaloneGatewayServiceName" . }}
  labels:
    {{- include "orchestration.standaloneGatewayLabels" . | nindent 4 }}
  annotations:
    {{- include "common.tplvalues.merge-overwrite" (dict
      "values" (list
        .Values.global.annotations
        $service.annotations
      )
      "context" .
    ) | nindent 4 }}
spec:
  type: {{ $service.type }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.orchestration.service.managementPort }}
      protocol: TCP
      name: {{ default "management" .Values.orchestration.service.managementName }}
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "management" "knownPorts" $knownPorts "appProtocols" .Values.orchestration.service.appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
    - port: {{ .Values.orchestration.service.httpPort }}
      protocol: TCP
      name: {{ default "http" .Values.orchestration.service.httpName }}
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "http" "knownPorts" $knownPorts "appProtocols" .Values.orchestration.service.appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
    - port: {{ .Values.orchestration.service.grpcPort }}
      protocol: TCP
      name: {{ default "grpc" .Values.orchestration.service.grpcName }}
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "grpc" "knownPorts" $knownPorts "appProtocols" .Values.orchestration.service.appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
    {{- with $service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "orchestration.standaloneGatewayMatchLabels" . | nindent 4 }}
{{- end }}
