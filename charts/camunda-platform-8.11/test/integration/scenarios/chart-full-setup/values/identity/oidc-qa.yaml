# QA OIDC auth configuration for 8.11 (Entra ID)
# Layer 2: Auth method - External OIDC provider (Microsoft Entra) for QA
# Expects: base.yaml + base-qa.yaml to be applied alongside this file

global:
  annotations:
    keycloak-token-url: "https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/oauth2/v2.0/token"
  security:
    authentication:
      method: oidc
  identity:
    auth:
      issuer: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/v2.0
      issuerBackendUrl: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/v2.0
      tokenUrl: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/oauth2/v2.0/token
      authUrl: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/oauth2/v2.0/authorize
      jwksUrl: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/discovery/v2.0/keys
      publicIssuerUrl: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/v2.0
      type: "MICROSOFT"
      identity:
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        # this existingSecret must be a string literal
        secret:
          inlineSecret: $ENTRA_APP_CLIENT_SECRET
        initialClaimValue: ""
        redirectUrl: "https://{{ .Values.global.host }}{{ .Values.identity.contextPath }}"
      optimize:
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        secret:
          existingSecret: integration-test-credentials
          existingSecretKey: entra-child-app-client-secret
        redirectUrl: "https://{{ .Values.global.host }}{{ .Values.optimize.contextPath }}"
      webModeler:
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        clientApiAudience: $ENTRA_APP_CLIENT_ID
        publicApiAudience: $ENTRA_APP_CLIENT_ID
        redirectUrl: "https://{{ .Values.global.host }}{{ .Values.camundaHub.contextPath | default .Values.webModeler.contextPath }}"
      console:
        wellKnown: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        secret:
          existingSecret: integration-test-credentials
          existingSecretKey: entra-child-app-client-secret
        tokenScope: $ENTRA_APP_CLIENT_ID/.default
        redirectUrl: "https://{{ .Values.global.host }}{{ .Values.console.contextPath }}"

orchestration:
  security:
    authentication:
      unprotectedApi: false
      oidc:
        redirectUrl: "https://{{ .Values.global.host }}{{ .Values.orchestration.contextPath }}"
        usernameClaim: oid
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        secret:
          inlineSecret: $ENTRA_APP_CLIENT_SECRET
    initialization:
      defaultRoles:
        admin:
          users:
            - $INITIAL_CLAIM_VALUE

connectors:
  security:
    authentication:
      oidc:
        clientId: $ENTRA_APP_CLIENT_ID
        audience: $ENTRA_APP_CLIENT_ID
        clientApiAudience: $ENTRA_APP_CLIENT_ID
        secret:
          existingSecret: integration-test-credentials
          existingSecretKey: entra-child-app-client-secret
        tokenScope: $ENTRA_APP_CLIENT_ID/.default

console:
  env:
    - name: CAMUNDA_IDENTITY_JWKS_URL
      value: https://login.microsoftonline.com/$ENTRA_APP_DIRECTORY_ID/discovery/v2.0/keys

# Mirrors the roles the Keycloak path seeds on identity.firstUser; the OIDC
# path seeds only the Default rule, which grants the Identity UI alone.
identity:
  env:
    - name: IDENTITY_MAPPINGRULES_0_NAME
      value: "QA E2E component access"
    - name: IDENTITY_MAPPINGRULES_0_CLAIMNAME
      value: "oid"
    - name: IDENTITY_MAPPINGRULES_0_CLAIMVALUE
      value: "$INITIAL_CLAIM_VALUE"
    - name: IDENTITY_MAPPINGRULES_0_OPERATOR
      value: "EQUALS"
    - name: IDENTITY_MAPPINGRULES_0_RULETYPE
      value: "ROLE"
    - name: IDENTITY_MAPPINGRULES_0_APPLIEDROLENAMES_0
      value: "ManagementIdentity"
    - name: IDENTITY_MAPPINGRULES_0_APPLIEDROLENAMES_1
      value: "Hub"
    - name: IDENTITY_MAPPINGRULES_0_APPLIEDROLENAMES_2
      value: "Hub Admin"
    - name: IDENTITY_MAPPINGRULES_0_APPLIEDROLENAMES_3
      value: "Optimize"

# Without the resource scope Entra issues a Microsoft Graph access token, which
# Optimize cannot validate against the Camunda issuer; it then falls back to ID
# token claims and denies access. The chart exposes tokenScope for connectors
# and orchestration only, so Optimize takes the property as env.
optimize:
  env:
    - name: CAMUNDA_SECURITY_AUTHENTICATION_OIDC_SCOPE_0
      value: "openid"
    - name: CAMUNDA_SECURITY_AUTHENTICATION_OIDC_SCOPE_1
      value: "profile"
    - name: CAMUNDA_SECURITY_AUTHENTICATION_OIDC_SCOPE_2
      value: "email"
    - name: CAMUNDA_SECURITY_AUTHENTICATION_OIDC_SCOPE_3
      value: "$ENTRA_APP_CLIENT_ID/.default"
