global:
  tls:
    orchestration:
      rest:
        enabled: true
        type: pkcs12
        keyAlias: orchestration-rest
        cert:
          secret:
            existingSecret: orchestration-tls-keystore
            existingSecretKey: keystore.p12
        keystorePassword:
          secret:
            existingSecretKey: keystore-password
    caBundle:
      secret:
        existingSecret: orchestration-tls
        existingSecretKey: tls.crt
# Contour: REST serves TLS on 8080, so Envoy must speak TLS to that port.
orchestration:
  service:
    annotations:
      projectcontour.io/upstream-protocol.tls: "8080"
