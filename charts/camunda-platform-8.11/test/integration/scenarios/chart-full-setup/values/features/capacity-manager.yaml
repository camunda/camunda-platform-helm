# Load-responsive capacity scenario. One CPU-limited broker hosts three
# partitions; a ramping load generator drives it into backpressure. The
# capacity manager must add a broker on backpressure + broker CPU evidence
# from an in-namespace Prometheus, then remove it once load stops.
capacityManager:
  enabled: true
  replicaOwnership: capacityManager
  image:
    registry: registry.camunda.cloud
    repository: team-distribution/capacity-manager
    tag: latest
    digest: ""
    pullSecrets:
      - name: registry-camunda-cloud
  reconcileInterval: 5s
  operationTimeout: 10m
  # The CI release is always named "integration"; this value is not templated.
  prometheusURL: http://integration-capacity-prometheus:9090
  extraConfiguration:
    - file: policy.json
      content: |
        {
          "mode": "automatic",
          "minBrokers": 1,
          "maxBrokers": 2,
          "scaleUpSamples": 3,
          "scaleDownSamples": 6,
          "scaleDownStabilization": "2m",
          "cooldown": "2m",
          "scaleUpSignals": [
            {"name": "backpressure", "operator": ">=", "threshold": 0.05,
             "query": "max(sum by (partition) (rate(zeebe_dropped_request_count_total{$SELECTOR}[1m])) / clamp_min(sum by (partition) (rate(zeebe_received_request_count_total{$SELECTOR}[1m])), 1))"},
            {"name": "broker-cpu", "operator": ">=", "threshold": 0.75,
             "query": "max(avg_over_time(process_cpu_usage{$SELECTOR}[1m]))"}
          ],
          "scaleDownSignals": [
            {"name": "no-backpressure", "operator": "<=", "threshold": 0.001,
             "query": "max(sum by (partition) (rate(zeebe_dropped_request_count_total{$SELECTOR}[1m])) / clamp_min(sum by (partition) (rate(zeebe_received_request_count_total{$SELECTOR}[1m])), 1))"},
            {"name": "fits-on-fewer-brokers", "operator": "<=", "threshold": 0.5,
             "query": "sum(avg_over_time(process_cpu_usage{$SELECTOR}[2m])) / ($BROKERS - 1)"}
          ],
          "vetoSignals": [
            {"name": "exporter-backlog", "operator": ">=", "threshold": 1000000,
             "query": "max(max by (partition) (zeebe_log_appender_last_committed_position{$SELECTOR}) - min by (partition) (max by (partition, exporter) (zeebe_exporter_last_exported_position{$SELECTOR}))) or vector(0)"},
            {"name": "partition-unhealthy", "operator": "<=", "threshold": 0,
             "query": "min(zeebe_health{$SELECTOR})"}
          ]
        }

orchestration:
  clusterSize: "1"
  partitionCount: "3"
  replicationFactor: "1"
  affinity: {}
  # A single CPU makes one broker saturate at a load the generator can reach;
  # the JVM then reports process_cpu_usage relative to that one CPU.
  resources:
    requests:
      cpu: 1000m
      memory: 1500Mi
    limits:
      cpu: 1000m
      memory: 2000Mi

global:
  extraManifests:
    - |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
    - |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
    - |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: {{ .Release.Name }}-capacity-prometheus
      subjects:
        - kind: ServiceAccount
          name: {{ .Release.Name }}-capacity-prometheus
          namespace: {{ .Release.Namespace }}
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
      data:
        prometheus.yml: |
          global:
            scrape_interval: 10s
            scrape_timeout: 5s
          scrape_configs:
            - job_name: orchestration-brokers
              metrics_path: {{ .Values.orchestration.contextPath }}/actuator/prometheus
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Release.Namespace | quote }}]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_name]
                  regex: {{ .Release.Name }}-zeebe-[0-9]+
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "9600"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
        labels:
          app.kubernetes.io/component: capacity-prometheus
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: capacity-prometheus
        template:
          metadata:
            labels:
              app.kubernetes.io/component: capacity-prometheus
          spec:
            serviceAccountName: {{ .Release.Name }}-capacity-prometheus
            containers:
              - name: prometheus
                image: docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 # v3.5.0
                args:
                  - --config.file=/etc/prometheus/prometheus.yml
                  - --storage.tsdb.path=/prometheus
                  - --storage.tsdb.retention.time=6h
                ports:
                  - name: http
                    containerPort: 9090
                readinessProbe:
                  httpGet:
                    path: /-/ready
                    port: http
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65534
                volumeMounts:
                  - name: config
                    mountPath: /etc/prometheus
                  - name: data
                    mountPath: /prometheus
            volumes:
              - name: config
                configMap:
                  name: {{ .Release.Name }}-capacity-prometheus
              - name: data
                emptyDir: {}
    - |
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .Release.Name }}-capacity-prometheus
      spec:
        selector:
          app.kubernetes.io/component: capacity-prometheus
        ports:
          - name: http
            port: 9090
            targetPort: http
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .Release.Name }}-capacity-load
        labels:
          app.kubernetes.io/component: capacity-load
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: capacity-load
        template:
          metadata:
            labels:
              app.kubernetes.io/component: capacity-load
          spec:
            imagePullSecrets:
              - name: registry-camunda-cloud
            containers:
              - name: load-generator
                image: registry.camunda.cloud/team-distribution/capacity-manager@sha256:e5d16ee4d35d454a483666b5237dc5c47ae82febdcd1b7c7470bb075935ca696
                imagePullPolicy: Always
                command: ["/load-generator"]
                args:
                  - --url=http://{{ .Release.Name }}-zeebe-gateway:8080{{ .Values.orchestration.contextPath }}/v2
                  - --username=demo
                  - --password=demo
                  - --rate=50
                  - --max-rate=3000
                  - --ramp-step=50
                  - --ramp-every=20s
                  - --workers=128
                resources:
                  requests:
                    cpu: 500m
                    memory: 64Mi
                  limits:
                    cpu: 1000m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65532
