# File secret store configuration for centralized secret resolution.
# Deploys only the Orchestration Cluster; the hooks verify secret resolution.

identity:
  enabled: false

webModeler:
  enabled: false

camundaHub:
  enabled: false

console:
  enabled: false

optimize:
  enabled: false

orchestration:
  secretStore:
    file:
      default:
        path: /etc/camunda/secrets
        secret:
          existingSecret: camunda-secret-store-test
