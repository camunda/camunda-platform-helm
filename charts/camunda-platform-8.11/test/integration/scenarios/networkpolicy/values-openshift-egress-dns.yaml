global:
  networkPolicy:
    enabled: true
    egress:
      enabled: true
      allowDNS: false
      allowedNamespaces:
        - name: "{{ .Release.Namespace }}-dns"
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
          ports:
            - protocol: UDP
              port: 5353
            - protocol: TCP
              port: 5353
        - "{{ .Release.Namespace }}-allowed"
