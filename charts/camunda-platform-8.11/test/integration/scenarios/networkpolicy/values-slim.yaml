global:
  noSecondaryStorage: true
identity: {enabled: false}
optimize: {enabled: false}
webModeler: {enabled: false}
camundaHub: {enabled: false}
orchestration:
  image: {repository: busybox, tag: "1.36"}
  command:
    - sh
    - -c
    - for p in 8080 9600 26500 26501 26502; do httpd -p "$p" -h /tmp; done; exec sleep 86400
  startupProbe: {enabled: false}
  readinessProbe: {enabled: false}
  livenessProbe: {enabled: false}
  pvcSize: 64Mi
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
  clusterSize: "1"
  replicationFactor: "1"
  partitionCount: "1"
connectors:
  image: {repository: busybox, tag: "1.36"}
  command:
    - sh
    - -c
    - httpd -p 8080 -h /tmp; exec sleep 86400
  startupProbe: {enabled: false}
  readinessProbe: {enabled: false}
  livenessProbe: {enabled: false}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
