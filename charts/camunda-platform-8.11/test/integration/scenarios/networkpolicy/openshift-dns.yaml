apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-default
data:
  Corefile: |
    .:5353 {
        errors
        forward . /etc/resolv.conf
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-default
  labels:
    dns.operator.openshift.io/daemonset-dns: default
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: dns
      image: registry.k8s.io/coredns/coredns:v1.11.3
      args: ["-conf", "/etc/coredns/Corefile"]
      ports:
        - containerPort: 5353
          protocol: UDP
        - containerPort: 5353
          protocol: TCP
      readinessProbe:
        tcpSocket:
          port: 5353
      volumeMounts:
        - name: config
          mountPath: /etc/coredns
  volumes:
    - name: config
      configMap:
        name: dns-default
---
apiVersion: v1
kind: Service
metadata:
  name: dns-default
spec:
  selector:
    dns.operator.openshift.io/daemonset-dns: default
  ports:
    - name: dns
      protocol: UDP
      port: 53
      targetPort: 5353
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 5353
