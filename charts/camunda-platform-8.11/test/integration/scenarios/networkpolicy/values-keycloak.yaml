global:
  identity:
    keycloak:
      url:
        protocol: http
        host: "keycloak.{{ .Release.Namespace }}.svc.cluster.local"
        port: "80"
      contextPath: "/auth"
      realm: "/realms/camunda-platform"
      auth:
        adminUser: admin
        secret:
          existingSecret: "integration-test-credentials"
          existingSecretKey: "identity-keycloak-admin-password"
    auth:
      enabled: true
      publicIssuerUrl: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local/auth/realms/camunda-platform"
      admin:
        enabled: true
        secret:
          existingSecret: "integration-test-credentials"
          existingSecretKey: "identity-admin-client-token"
  security:
    authentication:
      method: oidc
identity:
  enabled: true
  externalDatabase:
    enabled: true
    host: postgresql
    port: 5432
    database: identity
    username: "<POSTGRESQL_USERNAME>"
    secret:
      existingSecret: "integration-test-credentials"
      existingSecretKey: "identity-database-password"
connectors:
  security:
    authentication:
      oidc:
        secret:
          existingSecret: "integration-test-credentials"
          existingSecretKey: "identity-connectors-client-token"
orchestration:
  security:
    authentication:
      oidc:
        secret:
          existingSecret: "integration-test-credentials"
          existingSecretKey: "identity-orchestration-client-token"
