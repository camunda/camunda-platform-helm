global:
  networkPolicy:
    enabled: true
    egress:
      enabled: true
      allowedNamespaces:
        - "{{ .Release.Namespace }}-allowed"
        - namespaceSelector:
            matchLabels:
              camunda.io/tenant-of: "{{ .Release.Namespace }}"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hub-server
        - name: elastic-system
          ports:
            - protocol: TCP
              port: 9200
