script: pre-install-orchestration-tls.sh
description: |
  Generates one self-signed RSA-4096 certificate whose SANs cover the
  Orchestration gateway Service DNS, then creates three Secrets from it:
  `orchestration-tls` (PEM tls.crt/tls.key — the gRPC server cert, and the
  REST server cert when `rest.type: pem`), `orchestration-tls-keystore`
  (PKCS12 keystore.p12 plus keystore-password — the REST server keystore used
  when `rest.type: pkcs12`), and `orchestration-tls-truststore` (PKCS12
  truststore.p12 plus truststore-password, consumed by Web Modeler restapi).
  The same self-signed cert is also referenced as global.tls.caBundle so
  in-cluster Java clients (Web Modeler, Connectors) trust it via the
  chart-derived internal URLs. The Identity/WebModeler PostgreSQL database is
  provided by the `postgresql` companion dependency.
