---
# Source: camunda-platform/charts/identityKeycloak/templates/configmap-env-vars.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: camunda-platform-test-keycloak-env-vars
  namespace: "camunda"
  labels:
    app.kubernetes.io/instance: camunda-platform-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/version: 26.3.3
    app.kubernetes.io/component: keycloak
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KEYCLOAK_HTTP_PORT: "8080"
  KC_PROXY_HEADERS: "xforwarded"
  KC_METRICS_ENABLED: "false"
  KEYCLOAK_DATABASE_HOST: "camunda-platform-test-postgresql"
  KEYCLOAK_DATABASE_PORT: "5432"
  KEYCLOAK_DATABASE_NAME: "bitnami_keycloak"
  KEYCLOAK_DATABASE_SCHEMA: "public"
  KEYCLOAK_DATABASE_USER: "bn_keycloak"
  KEYCLOAK_PRODUCTION: "false"
  KEYCLOAK_ENABLE_HTTPS: "false"
  KC_CACHE_TYPE: "local"
  JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
  KC_LOG_CONSOLE_OUTPUT: "default"
  KC_LOG_LEVEL: "INFO"
