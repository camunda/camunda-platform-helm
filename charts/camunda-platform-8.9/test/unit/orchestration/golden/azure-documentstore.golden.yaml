---
# Source: camunda-platform/templates/orchestration/configmap.yaml
kind: ConfigMap
metadata:
  name: camunda-platform-test-zeebe-configuration
  labels:
    app: camunda-platform
    app.kubernetes.io/name: camunda-platform
    app.kubernetes.io/instance: camunda-platform-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: camunda-platform
    app.kubernetes.io/component: zeebe-broker
    app.kubernetes.io/version: "8.9.19"
apiVersion: v1
data:
  startup.sh: |
    # The Node ID depends on the StatefulSet Pod's name so it cannot be templated in the StatefulSet level.
    # The value of "node-id" is calculated in the "startup.sh" file and exported as "VALUES_ORCHESTRATION_NODE_ID" env var.
    export VALUES_ORCHESTRATION_NODE_ID="${VALUES_ORCHESTRATION_NODE_ID:-$[${K8S_NAME##*-} * 1 + 0]}"
    echo "export VALUES_ORCHESTRATION_NODE_ID=${VALUES_ORCHESTRATION_NODE_ID}"

    if [ "$ZEEBE_RESTORE" = "true" ]; then
      if [ "${ZEEBE_RESTORE_FROM_BACKUP_ID:-}" ]; then
        exec restore --backupId="${ZEEBE_RESTORE_FROM_BACKUP_ID}"
      elif [ "${ZEEBE_RESTORE_FROM_TIMESTAMP:-}" ] && [ "${ZEEBE_RESTORE_TO_TIMESTAMP:-}" ]; then
        exec restore --from="${ZEEBE_RESTORE_FROM_TIMESTAMP}" --to="${ZEEBE_RESTORE_TO_TIMESTAMP}"
      elif [ "${ZEEBE_RESTORE_FROM_TIMESTAMP:-}" ]; then
        exec restore --from="${ZEEBE_RESTORE_FROM_TIMESTAMP}"
      elif [ "${ZEEBE_RESTORE_TO_TIMESTAMP:-}" ]; then
        exec restore --to="${ZEEBE_RESTORE_TO_TIMESTAMP}"
      else
        exec restore
      fi
    else
      exec camunda
    fi
  application.yaml: |    
    spring:
      profiles:
        active: "admin,broker,operate,tasklist,consolidated-auth"
      servlet:
        multipart:
          max-file-size: "10MB"
          max-request-size: "10MB"
    
    server:
      address: 0.0.0.0
      port: 8080
      tomcat:
        max-http-form-post-size: "10MB"
    
    management:
      server:
        address: 0.0.0.0
        port: 9600
        base-path: "/"
    
    camunda:
      license:
        key: "${VALUES_ORCHESTRATION_LICENSE_KEY}"
    
      system:
        cpu-thread-count: 3
        io-thread-count: 3
        clock-controlled: false
        validate-restore-config: true
        upgrade:
          enable-version-check: true
    
      cluster:
        # The Node ID depends on the StatefulSet Pod's name so it cannot be templated in the StatefulSet level.
        # The value of "node-id" is calculated in the "startup.sh" file and exported as "VALUES_ORCHESTRATION_NODE_ID" env var.
        node-id: "${VALUES_ORCHESTRATION_NODE_ID:}"
        size: "3"
        replication-factor: "3"
        partition-count: "3"
        # zeebe.broker.cluster
        initial-contact-points:
          - camunda-platform-test-zeebe-0.${K8S_SERVICE_NAME}:26502
          - camunda-platform-test-zeebe-1.${K8S_SERVICE_NAME}:26502
          - camunda-platform-test-zeebe-2.${K8S_SERVICE_NAME}:26502
    
      api:
        grpc:
          address: 0.0.0.0
          port: 26500
    
      # Database configuration - Separated syntax.
      database:
    
      data:
        snapshot-period: "5m"
        primary-storage:
          disk:
            free-space:
              processing: "2GB"
              replication: "1GB"
        secondary-storage:
          autoconfigure-camunda-exporter: true
          type: "elasticsearch"
          elasticsearch:
            aws-enabled: false
            url: "http://camunda-platform-test-elasticsearch:9200"
            cluster-name: "elasticsearch"
            username: ""
            password: "${VALUES_ELASTICSEARCH_PASSWORD:}"
            index-prefix: ""
            number-of-replicas: "1"
            history:
              els-rollover-date-format: "date"
              rollover-interval: "1d"
              rollover-batch-size: 100
              wait-period-before-archiving: "1h"
              delay-between-runs: 2000
              max-delay-between-runs: 60000
    
      # Security configuration - Separated syntax.
      security:
        authentication:
          method: "basic"
          unprotectedApi: false
        authorizations:
          enabled: true
        initialization:
          default-roles:
            admin:
              users:
              - demo
            connectors:
              clients:
              - connectors
              users:
              - connectors
          users:
            - email: connector@demo.com
              name: Connector User
              password: connector
              username: connectors
            - email: demo@demo.com
              name: Demo User
              password: demo
              username: demo
        multiTenancy:
          checksEnabled: false
          apiEnabled: true
      persistent:
        sessions:
          enabled: true
    
      #
      # Camunda Operate Configuration - Separated syntax.
      #
      operate:
        multiTenancy:
          enabled: false
        # Zeebe instance
        zeebe:
          # Gateway address
          gatewayAddress: "camunda-platform-test-zeebe-gateway:26500"
    
      #
      # Camunda Tasklist Configuration - Separated syntax.
      #
      tasklist:
        multiTenancy:
          enabled: false
        # Zeebe instance
        zeebe:
          # Gateway address
          gatewayAddress: "camunda-platform-test-zeebe-gateway:26500"
          restAddress: "http://camunda-platform-test-zeebe-gateway:8080"
    
    #
    # Camunda Zeebe Configuration - Separated syntax.
    #
    zeebe:
      host: 0.0.0.0
      log:
        level: "info"
    
      broker:
        # zeebe.broker.gateway
        gateway:
          enable: true
          multitenancy:
            enabled: false
    
        # zeebe.broker.network
        network:
          advertisedHost: "${K8S_NAME}.${K8S_SERVICE_NAME}"
          host: 0.0.0.0
          commandApi:
            port: 26501
          internalApi:
            port: 26502
    
        # zeebe.broker.cluster
        cluster:
          clusterName: camunda-platform-test-zeebe
    
  log4j2.xml: |


---
# Source: camunda-platform/templates/orchestration/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: camunda-platform-test-zeebe
  labels:
    app: camunda-platform
    app.kubernetes.io/name: camunda-platform
    app.kubernetes.io/instance: camunda-platform-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: camunda-platform
    app.kubernetes.io/component: zeebe-broker
    app.kubernetes.io/version: "8.9.19"
  annotations:
spec:
  replicas: 3
  selector:
    matchLabels:
      app: camunda-platform
      app.kubernetes.io/name: camunda-platform
      app.kubernetes.io/instance: camunda-platform-test
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: camunda-platform
      app.kubernetes.io/component: zeebe-broker
  serviceName: "camunda-platform-test-zeebe"
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: camunda-platform
        app.kubernetes.io/name: camunda-platform
        app.kubernetes.io/instance: camunda-platform-test
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: camunda-platform
        app.kubernetes.io/component: zeebe-broker
        app.kubernetes.io/version: "8.9.19"
      annotations:
    spec:
      imagePullSecrets:
        []
      containers:
        - name: orchestration
          image: camunda/camunda:8.9.19
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command: ["bash", "/usr/local/bin/startup.sh"]
          env:
            - name: LC_ALL
              value: C.UTF-8
            - name: K8S_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_SERVICE_NAME
              value: "camunda-platform-test-zeebe"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/local/camunda/data -XX:ErrorFile=/usr/local/camunda/data/camunda_error%p.log -XX:+ExitOnOutOfMemoryError"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DOCUMENT_STORE_AZ1_CLASS
              value: io.camunda.document.store.azure.AzureBlobDocumentStoreProvider
            - name: DOCUMENT_STORE_AZ1_CONTAINER
              value: documents
            - name: DOCUMENT_STORE_AZ1_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-credentials
                  key: connection-string
            
            
          envFrom:
            - configMapRef:
                name: camunda-platform-test-documentstore-env-vars
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 26501
              name: command
            - containerPort: 26502
              name: internal
            - containerPort: 9600
              name: server
            - containerPort: 26500
              name: grpc
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              scheme: HTTP
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 2000m
              memory: 3000Mi
            requests:
              cpu: 1000m
              memory: 1500Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/bin/startup.sh
              subPath: startup.sh
            - name: data
              mountPath: /usr/local/camunda/data
            - name: exporters
              mountPath: /exporters
            - mountPath: /tmp
              name: tmp
            - name: config
              mountPath: /usr/local/camunda/config/application.yaml
              subPath: application.yaml
      volumes:
        - name: config
          configMap:
            name: camunda-platform-test-zeebe-configuration
            defaultMode: 492
        - name: exporters
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      serviceAccountName: camunda-platform-test-zeebe
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - zeebe-broker
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        annotations:
          {}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "32Gi"
