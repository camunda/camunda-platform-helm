{{- if .Values.console.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.global.annotations}}
      {{- toYaml .Values.global.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.console.service.annotations}}
      {{- toYaml .Values.console.service.annotations | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "http" "knownPorts" (list "http" "management") "appProtocols" .Values.console.service.appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
    - port: {{ .Values.console.service.managementPort }}
      name: management
      targetPort: management
      protocol: TCP
      {{- with include "camundaPlatform.appProtocol" (dict "portName" "management" "knownPorts" (list "http" "management") "appProtocols" .Values.console.service.appProtocols) }}
      appProtocol: {{ . | quote }}
      {{- end }}
  selector:
    {{- include "console.matchLabels" . | nindent 4 }}
{{- end }}
