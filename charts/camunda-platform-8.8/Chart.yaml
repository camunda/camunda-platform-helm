apiVersion: v2
name: camunda-platform
version: 13.14.2
appVersion: 8.8.x
description: |
  Camunda 8 Self-Managed Helm charts.
  Camunda's process automation platform allows developers to design, automate and improve processes.
type: application
icon: https://helm.camunda.io/imgs/camunda.svg
home: https://docs.camunda.io/docs/self-managed/about-self-managed/
sources:
  - https://github.com/camunda/camunda-platform-helm
keywords:
  - automation
  - business-rules
  - bpm
  - bpmn
  - camunda-platform
  - decision-engine
  - dmn
  - modeling
  - orchestration
  - process-automation
  - process-engine
  - process-orchestration
  - workflow
  - workflow-engine
dependencies:
  # Identity Dependencies.
  - name: keycloak
    alias: identityKeycloak
    repository: "file://../keycloak-24"
    version: 24.x.x
    condition: "identityKeycloak.enabled"
  - name: postgresql
    alias: identityPostgresql
    repository: "file://../identity-postgresql-15"
    version: 15.x.x
    condition: "identityPostgresql.enabled"
  # WebModeler Dependencies.
  - name: web-modeler-postgresql
    alias: webModelerPostgresql
    repository: "file://../web-modeler-postgresql-15"
    version: 15.x.x
    condition: "webModelerPostgresql.enabled"
  # Shared Dependencies.
  - name: elasticsearch
    repository: "file://../elasticsearch-21"
    version: 21.6.3
    condition: "elasticsearch.enabled"
  # Helpers.
  - name: common
    repository: "file://../common-2"
    version: 2.x.x
maintainers:
  - name: camunda
    url: https://camunda.com
annotations:
  camunda.io/helmCLIVersion: "3.22.1"
  artifacthub.io/links: |
    - name: Camunda 8 docs
      url: https://docs.camunda.io/
    - name: Camunda 8 Self-Managed docs
      url: https://docs.camunda.io/docs/self-managed/about-self-managed/
    - name: Camunda 8 Self-Managed Helm charts
      url: https://github.com/camunda/camunda-platform-helm
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "Remove the document store configuration from the 8.8 migration importer"
    - kind: fixed
      description: "Warn when shared authentication issuer is unresolved"
    - kind: fixed
      description: "Add the Console audience to the orchestration OIDC audiences when Console is enabled"
    - kind: fixed
      description: "Keep published Helm CLI support v3-only"
    - kind: fixed
      description: "Warn when orchestration OIDC endpoints are not absolute URLs"
    - kind: fixed
      description: "Warn when the dual-region replication factor is not 4"
    - kind: fixed
      description: "Honor env replication factor override in dual-region warning"
    - kind: fixed
      description: "Render the Identity and Optimize ServiceMonitors only when their component is deployed"
