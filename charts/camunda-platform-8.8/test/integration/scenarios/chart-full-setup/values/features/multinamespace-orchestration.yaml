# Orchestration-side component configuration for the multi-namespace topology.
global:
  elasticsearch:
    prefix: $ORCHESTRATION_INDEX_PREFIX

orchestration:
  index:
    prefix: $ORCHESTRATION_INDEX_PREFIX

optimize:
  enabled: true
  env:
    - name: CAMUNDA_OPTIMIZE_ELASTICSEARCH_SETTINGS_INDEX_PREFIX
      value: $OPTIMIZE_INDEX_PREFIX

connectors:
  enabled: true
