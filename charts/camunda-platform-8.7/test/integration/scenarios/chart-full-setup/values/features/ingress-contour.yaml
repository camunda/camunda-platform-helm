# Opt-in, test-only: no scenario selects this layer yet. Plaintext backends (h2c).
# Never combine with ingress-contour-tls.yaml.
global:
  ingress:
    className: contour
    annotations:
      projectcontour.io/websocket-routes: "/modeler-ws"
      projectcontour.io/response-timeout: "300s"
zeebeGateway:
  service:
    annotations:
      projectcontour.io/upstream-protocol.h2c: "26500"
  ingress:
    grpc:
      className: contour
      annotations:
        projectcontour.io/response-timeout: "120s"
