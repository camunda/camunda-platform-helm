# Companion values for internal-keycloak-26 chart.
# Deployed as a separate Helm release before the Camunda chart.
# Uses the same credential secret that the matrix runner provisions.

fullnameOverride: keycloak

auth:
  adminUser: admin
  existingSecret: integration-test-credentials
  passwordSecretKey: identity-keycloak-admin-password

httpRelativePath: "/auth/"
proxy: edge

# Keycloak 26.8.2 rejects Admin API tokens that lack the kc-admin-api client scope,
# and the camunda-identity client has none yet (camunda/camunda#69230,
# camunda/identity#5704). Remove once Identity ships that fix.
extraStartupArgs: "--spi-admin--audience-check-enabled=false"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

postgresql:
  enabled: true
  auth:
    database: keycloak
    username: keycloak
    password: "keycloak-ci-password"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
