---
repos:
  - repo: local
    hooks:
      # shortcut: copy of infraex-common-config's action-pin-spacing (camunda/infraex-common-config#609); switch to that hook once it is released.
      - id: action-pin-spacing
        name: Exactly one space before the version comment of a pinned action
        language: pygrep
        entry: uses:\s*\S+@[0-9a-f]{40}(\s{2,}|\t)#
        files: ^\.github/(workflows/[^/]+|actions/.+/action)\.ya?ml$
        # shortcut: release workflows are fixed in a separate PR that test-runs them; drop this exclude then.
        exclude: ^\.github/(workflows/(chart-build-dev|chart-promote-rc|chart-release-public)\.yaml|actions/observe-build-status/action\.yml)$
