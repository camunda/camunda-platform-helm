---
repos:
  - repo: https://github.com/camunda/infraex-common-config
    rev: 3.0.0 # use tags until renovate supports sha: https://github.com/renovatebot/renovate/issues/22567
    hooks:
      - id: action-pin-spacing
        # shortcut: release workflows are fixed in a separate PR that test-runs them; drop this exclude then.
        exclude: ^\.github/(workflows/(chart-build-dev|chart-promote-rc|chart-release-public)\.yaml|actions/observe-build-status/action\.yml)$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=high, --config=.github/zizmor.yml]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: \.bats$
